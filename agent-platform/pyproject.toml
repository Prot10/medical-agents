[project]
name = "neuroagent"
version = "0.1.0"
description = "NeuroAgent agentic platform for neurological clinical decision support"
requires-python = ">=3.11"
dependencies = [
    "neuroagent-schemas",
    "pydantic>=2.0",
    "openai>=1.0",
    "pyyaml",
    "rich",
    "typer",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "jsonschema>=4.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroagent"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio"]
# Only presentations/*/make_figures.py plots; not needed at runtime.
figures = ["matplotlib"]
training = [
    "torch>=2.2",
    # TRL >=1.8 renders conversational prompt/completion examples with a `tools` column and
    # per-example `chat_template_kwargs`, which is what lets SFT train on the exact transcript
    # the harness sends at inference (see training/train_sft.py).
    "transformers>=5.16.1,<5.20",  # the range vLLM 0.32 requires
    "peft>=0.21",
    "trl>=1.17,<1.18",
    "datasets>=3.0",
    "accelerate>=1.0",
    # Qwen3.5 is a hybrid model: its gated-delta-net layers run a slow pure-torch
    # fallback unless fla supplies the Triton delta-rule kernels. Measured 2.2x faster
    # SFT step time on an A100 (66s -> 30s/step). Pure Triton, no nvcc needed. The sibling
    # `causal-conv1d` and `flash-attn` are deliberately NOT here: no cu13/py313 wheels
    # exist, they need nvcc, and torch SDPA already covers full attention.
    "flash-linear-attention>=0.6",
    # GRPO rollouts run in-process (TRL colocate mode) on the single training GPU. Pinned to the
    # serving venv's version: 0.32 is the newest TRL 1.17 allows and the first we measured with
    # prefix cache on Qwen3.5 inside the noise floor. Since 0.26 Qwen3.5's delta-net runs on
    # TileLang kernels that need nvcc on the host. Keep both venvs on the same version.
    "vllm==0.32.0",
    "ninja",
]

[tool.uv.sources]
neuroagent-schemas = { workspace = true }
