# Reward weights for MULTI-TURN ("grouped") GRPO
# (agent-platform/scripts/training/run_grpo_training.sh with MULTI_TURN=1).
#
# Why this is separate from reward_weights_grpo.yaml:
# The single-turn config zeroes `correctness` and `format` because a one-shot rollout stops
# after ordering the workup and never states a diagnosis — weighting them there wasted half the
# reward on structurally-dead components. In a MULTI-TURN rollout the agent runs the real ReAct
# loop and DOES commit to a diagnosis, so those components are live again. Keeping them at 0
# here would mean a correct diagnosis and a wrong one score identically (measured: both 0.3529
# on ALS-M01) while top-1 diagnostic accuracy is the headline metric we report — the same
# train/eval objective mismatch that made the first runs move the reward but not the eval.
#
# correctness is the largest single weight because it IS the reported objective — train and
# eval should optimise the same thing. That is the whole justification.
#
# An earlier version of this comment also claimed correctness supplies the within-group VARIANCE
# that GRPO needs. That was measured and is FALSE. On the 100x3 sampled definitive-eval runs
# (temp 0.7, the same shape as a G=3 group), correctness is CONSTANT across the repeats of a
# case in 78% of groups — the policy is consistently right or consistently wrong on a given
# case. Weighting it actually NARROWS the mean within-group std slightly (base 0.106 -> 0.098,
# SFT 0.102 -> 0.092), because it is the most self-consistent component.
#
# What actually splits a group is safety (constant in only 10-15% of groups), actions (15-17%)
# and cost (47%) — which is why they keep substantial weight rather than being minimised in
# favour of correctness. Only 3-6% of groups are flat enough to contribute no gradient at all,
# so the reward is not degenerate.
#
# Two caveats on those numbers: they come from eval runs that predate the reward/MockServer
# fixes, and training samples at temperature 1.0 rather than 0.7, so training groups should be
# more diverse than measured here. Re-measure on the corrected benchmark.

default_weights:
  correctness: 0.30   # stated diagnosis vs ground truth — the reported objective
  actions:     0.25   # tool selection precision + recall vs the optimal workup
  safety:      0.25   # gated below; the dominant clinical axis
  cost:        0.10   # gated on workup completeness below
  # Near-dead weight in practice: constant across the repeats of a case in 94-96% of groups, so
  # it almost never contributes advantage. Kept small rather than removed because it is the only
  # signal tying the policy to hospital pathways, which the paper claims as a contribution.
  compliance:  0.05   # hospital-pathway adherence (reward-neutral where no pathway exists)
  format:      0.05   # the assessment section must exist for a diagnosis to be extractable

# Safety gate: a contraindicated (harmful) action caps the composite, so no amount of correct
# diagnosis or cheap workup can outscore an unsafe trajectory.
#
# cap is 0.25, not 0.0, because the detector is imprecise in a way that is BIASED AGAINST GOOD
# AGENTS. Measured over the 600 cases: recall 89.1%, per-action precision 97.2% — but there are
# ~4.6 contraindicated actions per case, so the chance that at least one fires falsely is ~9.5%
# per case. And the false positives are not random: an answer stating only the diagnosis trips
# 0% of the time, while one that states the case's REQUIRED critical actions trips 9.5%, because
# contraindications are written as "Do not <closely related action>" and share vocabulary with
# the actions the agent is supposed to take. At cap 0.0 that destroyed ~1 in 10 good
# trajectories' entire reward — including their correctness credit — producing a gradient away
# from stating recommendations, while `format` simultaneously rewards having them.
#
# 0.25 keeps the gate non-compensatory in practice: safe trajectories measure 0.55-0.66, so a
# genuine violation still ranks below every safe one, but a false positive no longer annihilates
# the signal. Revisit if the detector's precision improves.
safety_gate:
  enabled: true
  cap: 0.25

# Cost credit only counts once the required workup is actually ordered
# (critical_actions_hit >= threshold). Below it, cost contributes 0 — so "order nothing, stay
# cheap" earns no cost bonus.
cost_requires_workup: 0.5
