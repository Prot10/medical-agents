  # and I63.9 would credit the wrong mechanism (24 Oct 2026).
  except_cases: [MIG-AURA-P07]
  labels: [acute ischemic stroke, acute ischaemic stroke, ischemic stroke, ischaemic stroke, cerebral infarction, cerebral infarct]
  codes: [I63.9]
I63.9+paradoxical:
  cases: [ISCH-STR-P05, ISCH-STR-RP03]
  labels: [paradoxical embolism, paradoxical embolic stroke, embolic stroke]
I63.011:
  labels: [vertebral artery dissection]
  codes: [I63.0, I63.01]
I63.011+wallenberg:
