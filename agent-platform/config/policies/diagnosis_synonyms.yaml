  labels: [lateral medullary syndrome, wallenberg syndrome, lateral medullary infarct]
I63.011+pica:
  cases: [ISCH-STR-RM04]
  labels: [PICA infarct, cerebellar infarct]
I63.012:
  labels: [vertebral artery dissection, PICA infarct, cerebellar infarct]
  codes: [I63.0, I63.01]
I63.22:
  labels: [basilar artery occlusion, basilar artery thrombosis, posterior circulation stroke]
  codes: [I63.2]
I63.232:
  codes: [I63.2, I63.23]
I63.232+moyamoya:
