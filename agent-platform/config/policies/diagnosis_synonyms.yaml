A32:
  conditions: [bacterial_meningitis]
  labels: [listeria meningitis, listeria monocytogenes meningitis, listeria meningoencephalitis, listerial meningitis, bacterial meningitis, acute bacterial meningitis, community acquired bacterial meningitis]
