I63.40:
  labels: [septic embolic stroke, septic emboli, infective endocarditis stroke, infective endocarditis, embolic stroke]
  codes: [I63.4]
I63.411:
  labels: [cardioembolic stroke, embolic stroke]
  codes: [I63.4, I63.41]
I63.412:
  labels: [cardioembolic stroke, embolic stroke]
  codes: [I63.4, I63.41]
I63.431:
  labels: [cardioembolic stroke, embolic stroke]
