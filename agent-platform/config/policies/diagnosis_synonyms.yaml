I63.81+cadasil:
  cases: [ISCH-STR-RP05]
  labels: [CADASIL]
I77.71:
  labels: [carotid artery dissection, internal carotid artery dissection, cervical artery dissection]
# MIG-AURA-P07 only (right PCA cardioembolic infarct from paroxysmal AF; a small PFO is the red
# herring). Mechanism labels only: "embolic stroke" would credit paradoxical embolism, generic
# stroke or "PCA territory infarct" labels would credit migrainous infarction; I63.432 is the left
# PCA and I63.9 the unspecified code.
I63.4:
  cases: [MIG-AURA-P07]
  labels: [cardioembolic stroke, cardioembolic infarct, cardioembolic infarction, atrial fibrillation stroke, atrial fibrillation infarct]
  codes: [I63.43, I63.431]

# SYNC-CARD (24 Oct 2026 close-out, plans/SYNC-CARD-decisions.md). No generic "cardiac syncope",
# "arrhythmic syncope", "bradyarrhythmia" or "tachyarrhythmia" label (29 of 30 cases accepted
# "cardiac syncope", so the diagnosis score was trivial), and no R55. Each entry names the
# mechanism or substrate the case scores; a label whose tokens occur in a mimic the work-up
# excludes (e.g. "ventricular tachycardia" in idiopathic RVOT VT against ARVC, "long QT syndrome"
# in acquired LQTS against congenital, "central sleep apnoea" in heart-failure CSA against anti-Hu
# brainstem encephalitis) is not granted.
# AV block: grades do not grant each other. Second-degree (Mobitz II, high-grade) cases do not
# accept complete heart block unless the monitoring captures it (M03); complete heart block cases
# do not accept Mobitz II. Bare "second degree av block" is retired (it credits Mobitz I).
I44.1:
  labels: [mobitz ii, mobitz type ii, mobitz 2, high grade av block, high-grade atrioventricular block, high degree av block, advanced av block]
  codes: [I44.30]
I44.1+chb:
  # M03: telemetry captures transient complete heart block besides the Mobitz II block
  cases: [SYNC-CARD-M03]
  labels: [complete heart block, complete av block, complete atrioventricular block, third degree av block, third-degree atrioventricular block]
  codes: [I44.2]
I44.2:
  # RM02 scores the rheumatic cause (chloroquine toxicity and familial conduction disease are its mimics)
  except_cases: [SYNC-CARD-RM02]
  labels: [complete heart block, complete av block, complete atrioventricular block, third degree av block, third-degree atrioventricular block, third degree heart block]
  codes: [I44.30]
I44.2+rheumatic:
  cases: [SYNC-CARD-RM02]
  labels: [rheumatic carditis, rheumatic fever carditis, rheumatic carditis with heart block, rheumatic heart block, rheumatic heart disease heart block, rheumatic av block]
  codes: [I01.8, I01.9]
I45.6:
  labels: [wolff parkinson white, wolff-parkinson-white syndrome, WPW, pre-excitation syndrome]
# I45.81: congenital (P04) and drug-induced (M04, recoded from T46.2X5A) long QT do not grant each
# other; bare "long qt syndrome", "LQTS" and "torsades de pointes" are retired (their tokens occur
# in the other mechanism). M04 codes: torsades (I47.21) and the adverse effect of each drug.
I45.81+congenital:
  cases: [SYNC-CARD-P04]
  labels: [congenital long qt syndrome, congenital long qt, congenital LQTS, inherited long qt syndrome, hereditary long qt syndrome, long qt syndrome type 1, LQT1, kcnq1 long qt syndrome]
I45.81+drug:
  cases: [SYNC-CARD-M04]
  labels: [drug induced long qt syndrome, drug induced long qt, drug-induced long qt syndrome, acquired long qt syndrome, acquired long qt, drug induced torsades de pointes, medication induced long qt]
  codes: [I47.21, T36.3X5A, T45.0X5A, T43.225A]
# I47 split: SVT (I47.1, M05) and VT (I47.2) do not grant each other, and VT is a label only where
# VT itself is the diagnosis (RS05); ARVC (P01) and CPVT (RP03) must be named.
I47.1:
  labels: [supraventricular tachycardia, SVT, paroxysmal supraventricular tachycardia, AVNRT, av nodal reentrant tachycardia, atrioventricular nodal reentrant tachycardia, av nodal re-entrant tachycardia]
  codes: [I47.10, I47.19]
I47.2+vt:
  cases: [SYNC-CARD-RS05]
  labels: [ventricular tachycardia, VT, sustained ventricular tachycardia, monomorphic ventricular tachycardia]
  codes: [I47.20, I47.29]
I47.2+arvc:
  cases: [SYNC-CARD-P01]
  labels: [arrhythmogenic right ventricular cardiomyopathy, ARVC, arrhythmogenic cardiomyopathy]
  codes: [I42.8]
I47.2+cpvt:
  cases: [SYNC-CARD-RP03]
  labels: [catecholaminergic polymorphic ventricular tachycardia, CPVT, catecholaminergic polymorphic vt]
I48.3:
  labels: [atrial flutter, atrial flutter with rapid ventricular response, typical atrial flutter, atrial flutter with 1:1 conduction]
  codes: [I48.92]
I49.5:
  labels: [sick sinus syndrome, sinus node dysfunction, tachy brady syndrome, tachycardia bradycardia syndrome]
I49.8:
  # bare "brugada" is retired: it credits "Brugada phenocopy"
  labels: [brugada syndrome]
I42.1:
  labels: [hypertrophic cardiomyopathy, HCM, hypertrophic obstructive cardiomyopathy, HOCM, obstructive hypertrophic cardiomyopathy]
I42.8:
  labels: [arrhythmogenic right ventricular cardiomyopathy, ARVC, arrhythmogenic cardiomyopathy]
I35.0:
  labels: [aortic stenosis, severe aortic stenosis]
I26.09:
  # PE with acute cor pulmonale (RV strain): I26.9 (without acute cor pulmonale) is not granted
  labels: [pulmonary embolism, acute pulmonary embolism, PE]
  codes: [I26.0]
D15.1:
  # "cardiac tumour" is retired: it credits a malignant primary cardiac tumour, the mimic
  labels: [cardiac myxoma, right ventricular myxoma, rvot myxoma, right ventricular outflow tract myxoma]
D86.85:
  # complete heart block alone does not name the sarcoid cause; "sarcoid myocarditis" is retired
  # (its tokens occur in "non-sarcoid myocarditis", a mimic in RP05)
  labels: [cardiac sarcoidosis, cardiac sarcoid, sarcoid heart block, sarcoid heart disease]
G13.1:
  # SYNC-CARD-RM01 scores the paraneoplastic cause: central sleep apnoea and nocturnal asystole alone
  # credit heart-failure CSA, OSA or intrinsic sinus node disease; G47.31 is idiopathic CSA and
  # G47.37 covers CSA from other causes.
  labels: [anti hu brainstem encephalitis, anti hu encephalitis, anti hu encephalomyelitis, paraneoplastic brainstem encephalitis, anti hu paraneoplastic syndrome, paraneoplastic central sleep apnea, paraneoplastic central sleep apnoea]

# K72: grade-specific labels and codes are scoped. K72.90/K72.91 split hepatic failure without/with
# coma; K76.82 is hepatic encephalopathy itself and is the generic code.
K72:
  labels: [hepatic encephalopathy, HE, portosystemic encephalopathy]
  codes: [K76.82]
K72+overt:
  # every West Haven grade II-IV case; HEP-ENC-P07 is covert
  except_cases: [HEP-ENC-P07]
  labels: [overt hepatic encephalopathy]
K72+covert:
  cases: [HEP-ENC-P07]
  labels: [covert hepatic encephalopathy, minimal hepatic encephalopathy]
K72.91+coma:
  # West Haven grade IV
  cases: [HEP-ENC-S06]
  labels: [hepatic coma]
# HEP-ENC-P04 (October 2026): HE revealing unrecognised Wilson disease. Wilson disease is the
# missing diagnosis the case scores, so the case is coded E83.01 and an answer must name both.
E83.01:
  cases: [HEP-ENC-P04]
  labels: [wilson disease hepatic encephalopathy, wilson disease HE, wilsons disease hepatic encephalopathy, hepatolenticular degeneration hepatic encephalopathy]

# VASC-DEM (October 2026 close-out, plans/VASC-DEM-decisions.md). Severity is part of the label:
# F01 (major, dementia) and F06.7 (mild) do not grant each other, and the umbrella "vascular
# cognitive impairment" (both severities) is retired. Subtype labels are scoped to the cases of
# that mechanism; the five mixed cases do not accept a vascular-only answer.
F01:
  conditions: [vascular_dementia]
  except_cases: [VASC-DEM-M05, VASC-DEM-M07, VASC-DEM-M08, VASC-DEM-P01, VASC-DEM-P02]
  labels: [vascular dementia, major vascular neurocognitive disorder, major neurocognitive disorder due to vascular disease, VaD]
  codes: [F01.50, F01.51, F01.5, F01.9, F01.A0, F01.B0, F01.C0]
F01+svd:
  cases: [VASC-DEM-M02, VASC-DEM-P06, VASC-DEM-P07, VASC-DEM-S01, VASC-DEM-S02, VASC-DEM-S03, VASC-DEM-S04, VASC-DEM-S05]
  labels: [subcortical vascular dementia, subcortical ischaemic vascular dementia, subcortical ischemic vascular dementia, small vessel disease dementia]
  codes: [F01.2, I67.3]
F01+multi_infarct:
  cases: [VASC-DEM-M03, VASC-DEM-M10, VASC-DEM-P08, VASC-DEM-S06, VASC-DEM-S07, VASC-DEM-S08]
  labels: [multi-infarct dementia, multi infarct dementia]
  codes: [F01.1]
F01+strategic:
  cases: [VASC-DEM-M04, VASC-DEM-P09, VASC-DEM-S09, VASC-DEM-S10]
  labels: [strategic infarct dementia]
F01+post_stroke:
  cases: [VASC-DEM-M09, VASC-DEM-S11]
  labels: [post-stroke dementia]
F01+caa:
  cases: [VASC-DEM-P03, VASC-DEM-P04]
  labels: [cerebral amyloid angiopathy, CAA]
  codes: [I68.0]
# Mixed Alzheimer and vascular dementia: ICD-10-CM has no single code (G30.x + F02.8x + F01.5x),
# and G30/F02 alone would credit an Alzheimer-only answer, so only WHO ICD-10 F00.2 (mixed type)
# is added. The F01.50 primary code still credits a vascular-only answer coded F01.50 (scorer,
# code-alone matching: CENTRAL_PENDING).
F01+mixed:
  cases: [VASC-DEM-M05, VASC-DEM-M07, VASC-DEM-M08, VASC-DEM-P01, VASC-DEM-P02]
  labels: [mixed dementia, alzheimer vascular dementia, alzheimers vascular dementia, alzheimer cerebrovascular disease, alzheimers cerebrovascular disease]
  codes: [F00.2]
F06.7:
  conditions: [vascular_dementia]
  labels: [mild vascular cognitive impairment, mild vascular cognitive disorder, mild vascular neurocognitive disorder, mild neurocognitive disorder due to vascular disease, vascular mild cognitive impairment, vascular cognitive impairment no dementia]
  codes: [F06.70]
