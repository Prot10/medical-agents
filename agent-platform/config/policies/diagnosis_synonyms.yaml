# Accepted diagnosis synonyms, keyed by ICD-10-CM code or 3-character category.
#
# Applied to every case whose ground-truth ICD code matches the key exactly or by category
# (both entries apply when both exist), optionally restricted to the listed conditions. The
# migration `scripts/validation/apply_diagnosis_synonyms.py` appends `labels` to
# `ground_truth.diagnosis.accepted` and `codes` to `ground_truth.diagnosis.icd_codes`; the case
# file remains the scored artefact. A submitted diagnosis matches when every token of an accepted
# label appears in it, or when the submitted ICD-10 code is one of the accepted codes.
#
# STATUS: draft, authored 2026-09-02 for the migration; every entry is subject to physician review
# together with the case policies. Entity-specific puzzles (e.g. LGI1 encephalitis filed under
# G04.81) keep only their case-specific label and need per-case synonyms from the reviewers.
#
# Scoping (October 2026 review round): a category entry carries only generic labels and codes.
# A label naming a specific organism, mechanism, variant, grade or another disease goes on the
# specific code, or is scoped with `cases: [...]`, so it is accepted only where the case is that
# thing; `except_cases: [...]` removes a generic label from the cases it contradicts.

# Labels the table granted once and no longer grants; `--prune` strips them from every case.
RETIRED:
  retired_labels: [stroke, carotid stenosis stroke, internal carotid artery stenosis, large artery atherosclerotic stroke, perioperative stroke, postprocedural stroke, astrocytoma grade 4, spinal cord glioma, intramedullary glioma, cns lymphoma]

G12.21:
  labels: [amyotrophic lateral sclerosis, ALS, motor neuron disease, motor neurone disease, MND]
  codes: [G12.2, G12.20, G12.23, G12.24, G12.25]
# ALS-P02: the ALS mimic is the diagnosis (relabelled October 2026).
E05.90:
  conditions: [als]
  # 24 Oct 2026: thyroid hormone excess is the decisive finding; TSI stays positive after radioiodine,
  # so residual Graves activity cannot be excluded from the case data and is credited too.
  labels: [thyrotoxicosis, levothyroxine over-replacement, iatrogenic thyrotoxicosis, levothyroxine induced thyrotoxicosis, exogenous thyrotoxicosis, hyperthyroidism, graves disease, graves hyperthyroidism]
  codes: [E05.9, E05.00, T38.1X5A]
# ALS-P08: SOD1 A4V carrier with suspected early ALS, Gold Coast not met (recoded October 2026, so a
# plain "ALS" answer is an overcall); cautious labels only.
Z15.89:
  conditions: [als]
  cases: [ALS-P08]
  labels: [suspected ALS, prodromal ALS, possible ALS, suspected motor neuron disease, mild motor impairment]

# ALZ-EARLY (October 2026 close-out). G30.0 (onset under 65) and G30.1 (onset 65 or later) do not
# grant each other: the onset code is part of the label. The category grants the disease name and
# the unspecified code; stage, onset and phenotype labels sit on scoped entries.
G30:
  labels: [alzheimer disease, alzheimer's disease, alzheimers disease]
  codes: [G30.9]
# Dementia-stage labels: every G30 case is staged mild dementia except ALZ-EARLY-P02 (lvPPA with
# instrumental function preserved).
G30+dementia:
  except_cases: [ALZ-EARLY-P02]
  labels: [alzheimer dementia, dementia due to alzheimer]
  codes: [F00]
G30.0:
  labels: [early onset alzheimer]
G30.1:
  labels: [late onset alzheimer]
# Atypical phenotypes, each only where the case is that phenotype (G30.8 is the code some coders
# use for atypical presentations).
G30.0+pca:
  cases: [ALZ-EARLY-P01, ALZ-EARLY-RP01, ALZ-EARLY-RP02, ALZ-EARLY-RP03]
  labels: [posterior cortical atrophy, benson syndrome]
  codes: [G30.8]
G30.0+lvppa:
  cases: [ALZ-EARLY-P02]
  labels: [logopenic variant primary progressive aphasia, logopenic progressive aphasia, logopenic aphasia, lvPPA]
  codes: [G30.8]
G30.0+frontal:
  cases: [ALZ-EARLY-P03]
  labels: [frontal variant alzheimer, behavioral variant alzheimer, behavioural variant alzheimer, dysexecutive alzheimer]
  codes: [G30.8]
# MCI due to AD (ALZ-EARLY M01-M04, RM04, S06): MCI labels only. A bare "alzheimer disease" label
# is not granted (every "dementia due to Alzheimer disease" answer contains its tokens), nor are
# dementia labels or G30 codes, so a dementia answer to an MCI case does not score.
G31.84:
  labels: [mild cognitive impairment, MCI, amnestic mild cognitive impairment, amnestic MCI, prodromal alzheimer, mild cognitive impairment due to alzheimer]
G31.09:
  labels: [frontotemporal dementia, FTD, behavioral variant frontotemporal dementia, behavioural variant frontotemporal dementia, bvFTD, frontotemporal lobar degeneration, pick disease, pick's disease]
  codes: [G31.0, G31.01]
G31.83:
  labels: [dementia with lewy bodies, lewy body dementia, DLB]

G04.81:
