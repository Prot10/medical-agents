# I60 (24 Oct 2026, SAH close-out): the category serves the aneurysmal cases, so it no longer
# grants I60.8 (other nontraumatic SAH, the non-aneurysmal code). SAH-P02 (perimesencephalic
# non-aneurysmal SAH, I60.8) is excluded from the category: with token matching, a generic
# "subarachnoid hemorrhage" or "SAH" label would credit an answer of aneurysmal rupture, which is
# the error the case tests, and I60.9 or a location code would do the same through the code.
I60:
  except_cases: [SAH-P02]
  labels: [subarachnoid hemorrhage, subarachnoid haemorrhage, SAH, aneurysmal subarachnoid hemorrhage, aneurysmal subarachnoid haemorrhage, ruptured intracranial aneurysm, ruptured cerebral aneurysm]
  codes: [I60.9, I60.7, I60.0, I60.1, I60.2, I60.3, I60.4, I60.5, I60.6]
I60.8:
  cases: [SAH-P02]
  labels: [perimesencephalic subarachnoid hemorrhage, perimesencephalic subarachnoid haemorrhage, perimesencephalic SAH, perimesencephalic hemorrhage, perimesencephalic haemorrhage, pretruncal subarachnoid hemorrhage, non-aneurysmal subarachnoid hemorrhage, non-aneurysmal subarachnoid haemorrhage, nonaneurysmal subarachnoid hemorrhage, non-aneurysmal SAH, angiogram negative subarachnoid hemorrhage]

