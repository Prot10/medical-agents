# High-grade glioma (GLIO-HG close-out, 24 Oct 2026). ICD-10 C71 codes the site, not the entity, so
# the category carries only labels true of every high-grade glioma in the condition; entity names are
# scoped so that glioblastoma is not accepted for an IDH-mutant astrocytoma or a diffuse midline
# glioma (WHO CNS5), and a grade label is not accepted where the grade or the H3 status differs.
C71:
  conditions: [brain_tumor_glioma]
  labels: [high grade glioma, malignant glioma]
  codes: [C71.9]
C71+glioblastoma:
  conditions: [brain_tumor_glioma]
  # IDH-mutant astrocytomas (M04, M05, RP03) and the H3 K27-altered diffuse midline glioma (P05)
  except_cases: [GLIO-HG-M04, GLIO-HG-M05, GLIO-HG-RP03, GLIO-HG-P05]
  labels: [glioblastoma, GBM, glioblastoma idh wildtype]
C71+grade4:
  conditions: [brain_tumor_glioma]
  # not the grade 3 astrocytoma (M05), nor the H3-wildtype midline glioblastomas (RM01 pons, RM03
  # cerebellum and vermis), where "diffuse midline glioma ... grade 4" is the wrong answer
  except_cases: [GLIO-HG-M05, GLIO-HG-RM01, GLIO-HG-RM03]
  labels: [grade 4 glioma, glioma who grade 4]
C71+gliosarcoma:
  cases: [GLIO-HG-RM04]
  labels: [gliosarcoma]
C71+astrocytoma-idh-mutant-4:
  cases: [GLIO-HG-M04, GLIO-HG-RP03]
  labels: [astrocytoma idh mutant grade 4]
C71+astrocytoma-idh-mutant-3:
  cases: [GLIO-HG-M05]
  labels: [astrocytoma idh mutant grade 3]
C71+diffuse-midline-glioma:
  cases: [GLIO-HG-P05]
  labels: [diffuse midline glioma, h3 k27 altered glioma, h3 k27m altered glioma]
C72.0:
  conditions: [brain_tumor_glioma]
  # RM02 is H3-wildtype: generic "spinal cord glioma" would accept a diffuse midline glioma answer
  labels: [spinal cord glioblastoma, intramedullary glioblastoma, glioblastoma, GBM, high grade glioma, malignant glioma]
C83.390:
  # "cns lymphoma" alone would accept secondary CNS lymphoma, a different disease
  labels: [primary cns lymphoma, PCNSL, primary central nervous system lymphoma, primary cns diffuse large b cell lymphoma]
  codes: [C83.39, C85.80]
C83.390+hiv:
  cases: [GLIO-HG-P02]
  labels: [hiv associated cns lymphoma, aids related cns lymphoma, ebv positive diffuse large b cell lymphoma cns]

