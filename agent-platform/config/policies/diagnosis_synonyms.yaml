B45.1:
  labels: [cryptococcal meningitis, cryptococcal meningoencephalitis, cryptococcus meningitis]

# High-grade glioma (GLIO-HG close-out, 24 Oct 2026). ICD-10 C71 codes the site, not the entity, so
# the category carries only labels true of every high-grade glioma in the condition; entity names are
# scoped so that glioblastoma is not accepted for an IDH-mutant astrocytoma or a diffuse midline
# glioma (WHO CNS5), and a grade label is not accepted where the grade or the H3 status differs.
C71:
  conditions: [brain_tumor_glioma]
  labels: [high grade glioma, malignant glioma]
  codes: [C71.9]
C71+glioblastoma:
  conditions: [brain_tumor_glioma]
  # IDH-mutant astrocytomas (M04, M05, RP03) and the H3 K27-altered diffuse midline glioma (P05)
  except_cases: [GLIO-HG-M04, GLIO-HG-M05, GLIO-HG-RP03, GLIO-HG-P05]
  labels: [glioblastoma, GBM, glioblastoma idh wildtype]
C71+grade4:
  conditions: [brain_tumor_glioma]
  # not the grade 3 astrocytoma (M05), nor the H3-wildtype midline glioblastomas (RM01 pons, RM03
  # cerebellum and vermis), where "diffuse midline glioma ... grade 4" is the wrong answer
  except_cases: [GLIO-HG-M05, GLIO-HG-RM01, GLIO-HG-RM03]
  labels: [grade 4 glioma, glioma who grade 4]
C71+gliosarcoma:
  cases: [GLIO-HG-RM04]
  labels: [gliosarcoma]
C71+astrocytoma-idh-mutant-4:
  cases: [GLIO-HG-M04, GLIO-HG-RP03]
  labels: [astrocytoma idh mutant grade 4]
C71+astrocytoma-idh-mutant-3:
  cases: [GLIO-HG-M05]
  labels: [astrocytoma idh mutant grade 3]
C71+diffuse-midline-glioma:
  cases: [GLIO-HG-P05]
  labels: [diffuse midline glioma, h3 k27 altered glioma, h3 k27m altered glioma]
C72.0:
  conditions: [brain_tumor_glioma]
  # RM02 is H3-wildtype: generic "spinal cord glioma" would accept a diffuse midline glioma answer
  labels: [spinal cord glioblastoma, intramedullary glioblastoma, glioblastoma, GBM, high grade glioma, malignant glioma]
C83.390:
  # "cns lymphoma" alone would accept secondary CNS lymphoma, a different disease
  labels: [primary cns lymphoma, PCNSL, primary central nervous system lymphoma, primary cns diffuse large b cell lymphoma]
  codes: [C83.39, C85.80]
C83.390+hiv:
  cases: [GLIO-HG-P02]
  labels: [hiv associated cns lymphoma, aids related cns lymphoma, ebv positive diffuse large b cell lymphoma cns]

G40:
  labels: [focal epilepsy, temporal lobe epilepsy, mesial temporal lobe epilepsy, mesial temporal sclerosis epilepsy, focal onset seizures, focal impaired awareness seizures, focal seizures, TLE, epilepsy temporal lobe]
  codes: [G40.2, G40.209, G40.219, G40.1, G40.109, G40.119, G40.009, G40.019, G40.9, G40.909]
F44.5:
  labels: [psychogenic non-epileptic seizures, psychogenic nonepileptic seizures, PNES, functional seizures, dissociative seizures, non-epileptic seizures]
  codes: [F44.4, F44.7]
F44:
  conditions: [functional_neurological_disorder]
  labels: [functional neurological disorder, functional neurological symptom disorder, conversion disorder, FND, functional movement disorder, functional weakness, psychogenic non-epileptic seizures, PNES, functional seizures]
  codes: [F44.4, F44.5, F44.6, F44.7, F44.9]

# G41 (24 Oct 2026, SE close-out): the category grants the generic labels and the unspecified codes
# only. The type codes (G41.0 convulsive, G41.2 complex partial / focal NCSE, G41.8 other) and their
# labels come from the specific code, so a convulsive case no longer accepts an NCSE label or code
# and an NCSE case no longer accepts a convulsive one. G41.8 holds several phenotypes, so each of
# its labels is scoped to the cases that are that phenotype.
G41:
  except_cases: [SE-P06]
  labels: [status epilepticus, SE]
  codes: [G41.9, G40.901, G40.911]
G41.2:
  except_cases: [SE-P06]
  labels: [non-convulsive status epilepticus, nonconvulsive status epilepticus, NCSE]
# SE-P06: probable sporadic CJD is already in the history; the superimposed NCSE is what the case
# scores, so it is coded G41.2 and an answer must name both (HEP-ENC-P04 precedent).
G41.2+cjd:
  cases: [SE-P06]
  labels: [CJD status epilepticus, sCJD status epilepticus, creutzfeldt jakob disease status epilepticus, prion disease status epilepticus, CJD NCSE, sCJD NCSE, creutzfeldt jakob disease NCSE, prion disease NCSE]
G41.0:
  labels: [generalized convulsive status epilepticus, convulsive status epilepticus, GCSE, tonic clonic status epilepticus]
G41.8+ncse:
  # generalized NCSE (post-anoxic in SE-M07; HEP-ENC-P06)
  cases: [SE-M07, HEP-ENC-P06]
  labels: [non-convulsive status epilepticus, nonconvulsive status epilepticus, NCSE]
G41.8+myoclonic:
  cases: [SE-P03]
  labels: [myoclonic status epilepticus]
G41.8+fbds:
  # faciobrachial dystonic seizure status from anti-LGI1 encephalitis: motor, not NCSE
  # (anti-LGI1 encephalitis itself is in the history, so it is not a label here)
  cases: [SE-S12]
  labels: [faciobrachial dystonic seizures]
# No case is coded A81.09 since SE-P06 was recoded G41.2 (24 Oct 2026); kept for future CJD cases.
A81.09:
  labels: [creutzfeldt jakob disease, creutzfeldt-jakob disease, CJD, sporadic CJD, prion disease]
  codes: [A81.00, A81.0]
# "pyridoxine deficiency seizures" (dietary or inherited pyridoxine deficiency) and "cholinergic
# toxidrome" (carbamates, nerve agents, muscarinic mushrooms, cholinesterase-inhibitor drugs) name
# other causes; retired 24 Oct 2026 (SE close-out).
T37.1X1A:
  labels: [isoniazid toxicity, isoniazid induced seizures, isoniazid poisoning]
  codes: [T37.1X1]
T60.0X1A:
  labels: [organophosphate poisoning, organophosphate toxicity, organophosphate intoxication]
  codes: [T60.0X1]
# SE-P04: the left MCA stroke is in the chief complaint; what the case scores is the post-stroke
# seizures with LPDs on the ictal-interictal continuum (not NCSE), so it is coded R56.9 (24 Oct 2026)
# and an answer must name the seizure component.
R56.9:
  cases: [SE-P04]
  labels: [stroke lateralized periodic discharges, stroke LPDs, stroke ictal interictal continuum, stroke seizures, stroke seizure, acute symptomatic seizures, acute symptomatic seizure]

# MIG-AURA (24 Oct 2026 close-out, plans/MIG-AURA-decisions.md). No G43 category entry: the
# subtype is what the hemiplegic and brainstem-aura cases score (triptan avoidance, genetics), so
# a generic "migraine with aura" answer or a G43.1 code does not credit them. "migraine aura" is
# retired: its tokens are a subset of "migraine without aura".
G43.109:
  codes: [G43.1, G43.119, G43.909]
G43.109+aura:
  # MIG-AURA-M04 is migraine with brainstem aura (ICHD-3 1.2.2), not typical aura
  except_cases: [MIG-AURA-M04]
  labels: [migraine with aura, migraine with typical aura, classic migraine]
G43.109+brainstem:
  cases: [MIG-AURA-M04]
  labels: [migraine with brainstem aura, basilar migraine, basilar type migraine]
G43.109+acephalgic:
  cases: [MIG-AURA-M05]
  labels: [typical aura without headache, acephalgic migraine]
G43.109+probable:
  # single attacks relabelled ICHD-3 1.5.2
  cases: [MIG-AURA-M01, MIG-AURA-M07]
  labels: [probable migraine with aura]
G43.409:
  labels: [hemiplegic migraine, sporadic hemiplegic migraine, migraine with motor aura]
  codes: [G43.4, G43.419]
# MIG-AURA-P03: migrainous infarction (ICHD-3 1.4.3), recoded G43.609 (ICD-10-CM codes the
# migrainous infarction under G43.6 with I63 as the additional code). Stroke labels and I63 codes
# are not granted: a cardioembolic, lacunar or cryptogenic stroke answer is the error the case tests.
G43.609:
  cases: [MIG-AURA-P03]
  labels: [migrainous infarction, migrainous stroke, migraine induced stroke, migraine related stroke, persistent migraine aura with cerebral infarction, persistent aura with infarction]
  codes: [G43.6, G43.601, G43.611, G43.619]
E88.41:
  labels: [MELAS, mitochondrial encephalomyopathy lactic acidosis and stroke-like episodes, mitochondrial encephalomyopathy]
  codes: [E88.4]
I67.850:
  labels: [CADASIL, cerebral autosomal dominant arteriopathy with subcortical infarcts and leukoencephalopathy]
  codes: [I67.85]

G35:
  labels: [multiple sclerosis, MS, relapsing remitting multiple sclerosis, relapsing-remitting multiple sclerosis, RRMS, demyelinating disease]
  codes: [G35, G35.A, G35.B, G35.C, G35.D]

G20:
  labels: [parkinson disease, parkinson's disease, parkinsons disease, idiopathic parkinson disease, idiopathic parkinson's disease, PD]
  codes: [G20, G20.A1, G20.A2, G20.B1, G20.B2, G20.C]
G23.1:
  labels: [progressive supranuclear palsy, PSP, richardson syndrome]
G90.3:
  labels: [multiple system atrophy, MSA, MSA-P, multiple system atrophy parkinsonian type]

G61.0:
  labels: [guillain barre syndrome, guillain-barre syndrome, guillain-barré syndrome, GBS]
# GBS variant and subtype labels scoped to the cases whose findings meet them (24 Oct 2026,
# plans/GBS-decisions.md): an AIDP answer is wrong for Miller Fisher, PCB, bifacial, ptosis and
# AMAN cases, and "Miller Fisher syndrome" is wrong for AIDP. The ICD code G61.0 still credits any
# GBS-spectrum answer that submits it (ICD-10 files every variant under G61.0).
G61.0+aidp:
  conditions: [guillain_barre]
  except_cases: [GBS-P01, GBS-RM12, GBS-RM15, GBS-RS11, GBS-RS15, GBS-RP16]
  labels: [acute inflammatory demyelinating polyneuropathy, AIDP, acute inflammatory demyelinating polyradiculoneuropathy]
G61.0+aman:
  cases: [GBS-RP16]
  labels: [acute motor axonal neuropathy, AMAN]
G61.0+mfs:
  cases: [GBS-P01]
  labels: [miller fisher syndrome, fisher syndrome, MFS]
G61.0+gq1b:
  cases: [GBS-RM15]
  labels: [anti gq1b syndrome, incomplete miller fisher syndrome]
G61.0+pcb:
  cases: [GBS-RM12, GBS-RS15]
  labels: [pharyngeal cervical brachial]
G61.0+bifacial:
  cases: [GBS-RS11]
  labels: [bifacial weakness with paraesthesias, bifacial weakness with paresthesias]

# MG (24 Oct 2026 close-out, plans/MG-decisions.md). The category grants the disease name and
# the WHO code only. Distribution, serotype and exacerbation labels are scoped to the cases whose
# data meet them, so a generalized case no longer lists "ocular myasthenia gravis" and an ocular
# case no longer lists "generalized". Bare "MG" is retired (a one-token label matches any text
# that mentions MG, including a LEMS answer "not MG"); two-token forms ("ocular MG") replace it.
# Residual limit: a wrong-subtype answer that contains "myasthenia gravis" still scores through
# the generic label (needs per-case rejected tokens, CENTRAL_PENDING).
G70:
  labels: [myasthenia gravis, autoimmune myasthenia]
  codes: [G70.0]
# Stable presentations: G70.00 first; G70.01 is also credited (a coding nuance of a worsening
# new presentation, not a different entity).
G70.00:
  codes: [G70.00, G70.01]
# Exacerbation and crisis (MG-M04 impending crisis, MG-RM14 and MG-RM15 crisis): G70.00 ("without
# exacerbation") is not credited.
G70.01+crisis:
  conditions: [myasthenia_gravis]
  cases: [MG-M04, MG-RM14, MG-RM15]
  labels: [myasthenic crisis, myasthenic exacerbation, impending myasthenic crisis, MG crisis, MG exacerbation]
G70+generalized:
  conditions: [myasthenia_gravis]
  except_cases: [MG-RS11, MG-S05]
  labels: [generalized myasthenia gravis, generalised myasthenia gravis, generalized MG, generalised MG]
G70.00+ocular:
  conditions: [myasthenia_gravis]
  cases: [MG-RS11, MG-S05]
  labels: [ocular myasthenia gravis, ocular myasthenia, ocular MG]
G70.00+seronegative:
  conditions: [myasthenia_gravis]
  cases: [MG-P01, MG-RP14]
  labels: [seronegative myasthenia gravis, seronegative MG]
G70.00+double_seronegative:
  conditions: [myasthenia_gravis]
  cases: [MG-P01, MG-P04, MG-RP14]
  labels: [double seronegative myasthenia gravis, double seronegative MG]
G70.00+lrp4:
  conditions: [myasthenia_gravis]
  cases: [MG-P04]
  labels: [LRP4 myasthenia gravis, LRP4 antibody positive myasthenia gravis, LRP4 MG]
G70.00+musk:
  conditions: [myasthenia_gravis]
  cases: [MG-RS14]
  labels: [MuSK myasthenia gravis, MuSK antibody positive myasthenia gravis, anti-MuSK myasthenia gravis, MuSK MG]
# LEMS (MG-P02, MG-RM13, both paraneoplastic with SCLC): G73.1 is "Lambert-Eaton syndrome in
# neoplastic disease", G70.80 "Lambert-Eaton syndrome, unspecified".
G73.1:
  labels: [lambert eaton myasthenic syndrome, lambert-eaton myasthenic syndrome, LEMS, lambert eaton syndrome, paraneoplastic lambert eaton myasthenic syndrome, LEMS with small cell lung cancer]
  codes: [G73.1, G70.80]

# NPH (24 Oct 2026 close-out). G91.2 is (idiopathic) NPH and G91.0 communicating hydrocephalus,
# which ICD-10-CM uses for secondary NPH: they no longer grant each other. The secondary cases
# (G91.0) do not take the bare "normal pressure hydrocephalus" / "NPH" labels, because with token
# matching they would credit "idiopathic NPH", the wrong answer those cases test (an antecedent
# excludes iNPH); they take "secondary" and antecedent-specific labels instead.
G91.2:
  labels: [normal pressure hydrocephalus, NPH, idiopathic normal pressure hydrocephalus, iNPH]
  codes: [G91.9]
G91.0:
  labels: [secondary normal pressure hydrocephalus, secondary NPH, communicating hydrocephalus]
  codes: [G91.9]
G91.0+subdural:
  cases: [NPH-M06]
  labels: [subdural NPH, subdural normal pressure hydrocephalus]
G91.0+meningitic:
  cases: [NPH-M08]
  labels: [post-meningitic NPH, post-meningitic normal pressure hydrocephalus, meningitis NPH, meningitis normal pressure hydrocephalus]
# G91.3 is post-traumatic hydrocephalus, unspecified (plan R1).
G91.0+traumatic:
  cases: [NPH-M09]
  labels: [traumatic NPH, traumatic normal pressure hydrocephalus, TBI NPH, TBI normal pressure hydrocephalus]
  codes: [G91.3]
G91.0+sah:
  cases: [NPH-P05]
  labels: [SAH NPH, SAH normal pressure hydrocephalus, haemorrhagic NPH, hemorrhagic NPH, subarachnoid NPH, subarachnoid normal pressure hydrocephalus]

# I60 (24 Oct 2026, SAH close-out): the category serves the aneurysmal cases, so it no longer
# grants I60.8 (other nontraumatic SAH, the non-aneurysmal code). SAH-P02 (perimesencephalic
# non-aneurysmal SAH, I60.8) is excluded from the category: with token matching, a generic
# "subarachnoid hemorrhage" or "SAH" label would credit an answer of aneurysmal rupture, which is
# the error the case tests, and I60.9 or a location code would do the same through the code.
I60:
  except_cases: [SAH-P02]
  labels: [subarachnoid hemorrhage, subarachnoid haemorrhage, SAH, aneurysmal subarachnoid hemorrhage, aneurysmal subarachnoid haemorrhage, ruptured intracranial aneurysm, ruptured cerebral aneurysm]
  codes: [I60.9, I60.7, I60.0, I60.1, I60.2, I60.3, I60.4, I60.5, I60.6]
I60.8:
  cases: [SAH-P02]
  labels: [perimesencephalic subarachnoid hemorrhage, perimesencephalic subarachnoid haemorrhage, perimesencephalic SAH, perimesencephalic hemorrhage, perimesencephalic haemorrhage, pretruncal subarachnoid hemorrhage, non-aneurysmal subarachnoid hemorrhage, non-aneurysmal subarachnoid haemorrhage, nonaneurysmal subarachnoid hemorrhage, non-aneurysmal SAH, angiogram negative subarachnoid hemorrhage]

