# Accepted diagnosis synonyms, keyed by ICD-10-CM code or 3-character category.
#
# Applied to every case whose ground-truth ICD code matches the key exactly or by category
# (both entries apply when both exist), optionally restricted to the listed conditions. The
# migration `scripts/validation/apply_diagnosis_synonyms.py` appends `labels` to
# `ground_truth.diagnosis.accepted` and `codes` to `ground_truth.diagnosis.icd_codes`; the case
# file remains the scored artefact. A submitted diagnosis matches when every token of an accepted
# label appears in it, or when the submitted ICD-10 code is one of the accepted codes.
#
# STATUS: draft, authored 2026-09-02 for the migration; every entry is subject to physician review
# together with the case policies. Entity-specific puzzles (e.g. LGI1 encephalitis filed under
# G04.81) keep only their case-specific label and need per-case synonyms from the reviewers.
#
# Scoping (October 2026 review round): a category entry carries only generic labels and codes.
# A label naming a specific organism, mechanism, variant, grade or another disease goes on the
# specific code, or is scoped with `cases: [...]`, so it is accepted only where the case is that
# thing; `except_cases: [...]` removes a generic label from the cases it contradicts.

# Labels the table granted once and no longer grants; `--prune` strips them from every case.
RETIRED:
  retired_labels: [stroke, carotid stenosis stroke, internal carotid artery stenosis, large artery atherosclerotic stroke, perioperative stroke, postprocedural stroke, astrocytoma grade 4, spinal cord glioma, intramedullary glioma, cns lymphoma, pyridoxine deficiency seizures, cholinergic toxidrome, migraine aura, PCA territory infarct, vascular cognitive impairment, cardiac syncope, arrhythmic syncope, bradyarrhythmia, tachyarrhythmia, conduction disease syncope, second degree av block, torsades de pointes, long qt syndrome, LQTS, brugada, cardiac tumor, cardiac tumour, central sleep apnea, central sleep apnoea, sleep apnea syncope, nocturnal asystole, sleep related bradyarrhythmia, sarcoid myocarditis, pick disease, pick's disease, MG]

G12.21:
  labels: [amyotrophic lateral sclerosis, ALS, motor neuron disease, motor neurone disease, MND]
  codes: [G12.2, G12.20, G12.23, G12.24, G12.25]
# ALS-P02: the ALS mimic is the diagnosis (relabelled October 2026).
E05.90:
  conditions: [als]
  # 24 Oct 2026: thyroid hormone excess is the decisive finding; TSI stays positive after radioiodine,
  # so residual Graves activity cannot be excluded from the case data and is credited too.
  labels: [thyrotoxicosis, levothyroxine over-replacement, iatrogenic thyrotoxicosis, levothyroxine induced thyrotoxicosis, exogenous thyrotoxicosis, hyperthyroidism, graves disease, graves hyperthyroidism]
  codes: [E05.9, E05.00, T38.1X5A]
# ALS-P08: SOD1 A4V carrier with suspected early ALS, Gold Coast not met (recoded October 2026, so a
# plain "ALS" answer is an overcall); cautious labels only.
Z15.89:
  conditions: [als]
  cases: [ALS-P08]
  labels: [suspected ALS, prodromal ALS, possible ALS, suspected motor neuron disease, mild motor impairment]

# ALZ-EARLY (October 2026 close-out). G30.0 (onset under 65) and G30.1 (onset 65 or later) do not
# grant each other: the onset code is part of the label. The category grants the disease name and
# the unspecified code; stage, onset and phenotype labels sit on scoped entries.
G30:
  labels: [alzheimer disease, alzheimer's disease, alzheimers disease]
  codes: [G30.9]
# Dementia-stage labels: every G30 case is staged mild dementia except ALZ-EARLY-P02 (lvPPA with
# instrumental function preserved).
G30+dementia:
  except_cases: [ALZ-EARLY-P02]
  labels: [alzheimer dementia, dementia due to alzheimer]
  codes: [F00]
G30.0:
  labels: [early onset alzheimer]
G30.1:
  labels: [late onset alzheimer]
# Atypical phenotypes, each only where the case is that phenotype (G30.8 is the code some coders
# use for atypical presentations).
G30.0+pca:
  cases: [ALZ-EARLY-P01, ALZ-EARLY-RP01, ALZ-EARLY-RP02, ALZ-EARLY-RP03]
  labels: [posterior cortical atrophy, benson syndrome]
  codes: [G30.8]
G30.0+lvppa:
  cases: [ALZ-EARLY-P02]
  labels: [logopenic variant primary progressive aphasia, logopenic progressive aphasia, logopenic aphasia, lvPPA]
  codes: [G30.8]
G30.0+frontal:
  cases: [ALZ-EARLY-P03]
  labels: [frontal variant alzheimer, behavioral variant alzheimer, behavioural variant alzheimer, dysexecutive alzheimer]
  codes: [G30.8]
# MCI due to AD (ALZ-EARLY M01-M04, RM04, S06): MCI labels only. A bare "alzheimer disease" label
# is not granted (every "dementia due to Alzheimer disease" answer contains its tokens), nor are
# dementia labels or G30 codes, so a dementia answer to an MCI case does not score.
G31.84:
  labels: [mild cognitive impairment, MCI, amnestic mild cognitive impairment, amnestic MCI, prodromal alzheimer, mild cognitive impairment due to alzheimer]
# FTD (24 Oct 2026 close-out, plans/FTD-decisions.md). "Pick disease" names one FTLD-tau
# pathology (Pick bodies) that no case establishes and that the C9orf72 and GRN cases (TDP-43)
# cannot have; ICD-10-CM G31.01 (Pick's disease) is also where primary progressive aphasia is
# coded, so neither is granted to bvFTD. The two PPA cases are coded G31.01 and accept only their
# own variant (every token of "frontotemporal dementia" occurs in a bvFTD answer). FTD-P08 needs
# both components, as SE-P06 and HEP-ENC-P04 do.
G31.09:
  except_cases: [FTD-P08]
  labels: [frontotemporal dementia, FTD, behavioral variant frontotemporal dementia, behavioural variant frontotemporal dementia, bvFTD, frontotemporal lobar degeneration]
  codes: [G31.0]
G31.09+mnd:
  cases: [FTD-P08]
  labels: [FTD-MND, FTD-ALS, ALS-FTD, bvFTD MND, bvFTD ALS, ALS-FTSD, frontotemporal dementia motor neuron disease, frontotemporal dementia motor neurone disease, frontotemporal dementia ALS, frontotemporal dementia amyotrophic lateral sclerosis, bvFTD motor neuron disease, bvFTD motor neurone disease]
G31.01+svppa:
  cases: [FTD-S11]
  labels: [semantic variant primary progressive aphasia, semantic variant PPA, svPPA, semantic PPA, semantic primary progressive aphasia, semantic dementia]
G31.01+nfvppa:
  cases: [FTD-S12]
  labels: [nonfluent variant primary progressive aphasia, non-fluent variant primary progressive aphasia, nfvPPA, agrammatic variant primary progressive aphasia, agrammatic primary progressive aphasia, agrammatic PPA, nonfluent PPA, non-fluent PPA, progressive nonfluent aphasia, progressive non-fluent aphasia, PNFA]
G31.83:
  labels: [dementia with lewy bodies, lewy body dementia, DLB]

G04.81:
  # NMDAR-ENC close-out (24 Oct 2026): the generic labels are not granted in the anti-NMDAR cases.
  # Every token of "autoimmune encephalitis" or "antibody mediated encephalitis" occurs in
  # "anti-LGI1 autoimmune encephalitis" or "seronegative autoimmune encephalitis", the alternatives
  # each case's work-up excludes; "autoimmune limbic encephalitis" is a different syndrome (Graus
  # 2016); G04.90 is unspecified encephalitis. The case's antibody is what the CSF order establishes.
  except_cases: [NMDAR-ENC-M01, NMDAR-ENC-M02, NMDAR-ENC-M03, NMDAR-ENC-M04, NMDAR-ENC-M05, NMDAR-ENC-P01, NMDAR-ENC-P02, NMDAR-ENC-P03, NMDAR-ENC-P04, NMDAR-ENC-P05, NMDAR-ENC-P06, NMDAR-ENC-P07, NMDAR-ENC-P08, NMDAR-ENC-RM01, NMDAR-ENC-RM02, NMDAR-ENC-RM03, NMDAR-ENC-RP01, NMDAR-ENC-RP02, NMDAR-ENC-RP03, NMDAR-ENC-RS01, NMDAR-ENC-RS02, NMDAR-ENC-RS03, NMDAR-ENC-RS04, NMDAR-ENC-S01, NMDAR-ENC-S02, NMDAR-ENC-S03, NMDAR-ENC-S04, NMDAR-ENC-S06, NMDAR-ENC-S09, NMDAR-ENC-S10]
  labels: [autoimmune encephalitis, antibody mediated encephalitis, autoimmune limbic encephalitis]
  codes: [G04.8, G04.90]
G04.81+nmdar:
  conditions: [autoimmune_encephalitis_nmdar]
  labels: [anti nmda receptor encephalitis, anti-nmda receptor encephalitis, anti nmdar encephalitis, anti-nmdar encephalitis, nmdar encephalitis, nmda receptor encephalitis, nmda encephalitis, glun1 encephalitis, nr1 encephalitis]
  codes: [G04.8]

G00:
  labels: [bacterial meningitis, acute bacterial meningitis, pyogenic meningitis]
