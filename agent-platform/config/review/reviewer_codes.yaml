# Reviewer access codes for the NeuroBench dataset review tool.
#
# Hand-edit this file to add/remove reviewers. The review API reads it at
# startup and reloads it whenever its mtime changes (no server restart needed).
#
# Code rules:
#   - 3-16 characters, A-Z, 0-9, or hyphen.
#   - Case-insensitive at lookup time (stored uppercase).
#
# Roles:
#   - reviewer: can read/write only their own annotations.
#   - admin:    can additionally read the aggregate views (inter-rater table,
#               progress dashboard, field hotspots, side-by-side diff).
#
# Set active: false to soft-disable a code without deleting it.

reviewers:
  - code: R-123
    name: Reviewer 1
    role: reviewer
    active: true
  - code: R-001
    name: Reviewer 2
    role: reviewer
    active: true
  - code: R-111
    name: Reviewer 3
    role: reviewer
    active: true
  - code: Test
    name: Tester
    role: reviewer
    active: true
  - code: AAA
    name: Researcher
    role: admin
    active: true
