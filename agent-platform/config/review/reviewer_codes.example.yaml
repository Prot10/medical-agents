# TEMPLATE for reviewer_codes.yaml — copy to reviewer_codes.yaml (which is
# gitignored) and replace the placeholder codes with your own.
#
# Codes are BEARER SECRETS used as the X-Reviewer-Code header. Memorable
# word-phrases are fine here: the auth rate limiter blocks brute force
# (10 failed tries per IP per 15 min, then a lockout). Give each reviewer
# their own code; make admin codes a bit longer (4 words) since admins can
# read everyone's data. Login is case-insensitive.
#
# Generate a memorable code:
#   python -c "import secrets;w='amber anchor apple arch arrow autumn basil beacon birch'.split();print('-'.join(secrets.choice(w) for _ in range(3)).upper())"
#
# Rules: 3-64 chars of A-Z, 0-9, hyphen. Roles: reviewer | admin.
# active: false soft-disables a code. The server hot-reloads on file change.

reviewers:
  - code: MAPLE-RIVER-STONE
    name: Reviewer 1
    role: reviewer
    active: true
  - code: JUNIPER-MEADOW-HARBOR-SLATE
    name: Researcher
    role: admin
    active: true
