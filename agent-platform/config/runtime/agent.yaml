llm:
  base_url: "http://localhost:8000/v1"
  api_key: "not-needed"
  model: "Qwen/Qwen3.5-9B"
  temperature: 1.0
  max_tokens: 8192
  top_p: 0.95
  presence_penalty: 1.5
  # Sampling seed sent to vLLM on every request so runs at temperature 1.0 are
  # reproducible (same seed + same server config => same samples). Set to null
  # to restore unseeded sampling.
  seed: 42
  # Per-request HTTP timeout (seconds) and automatic retry count for the
  # OpenAI-compatible client. Long agent turns on the A100 can take minutes.
  request_timeout: 120.0
  max_retries: 2

agent:
  max_turns: 15
  enable_reflection: true
  allowed_tools: null
  excluded_tools: null
  all_info_upfront: false

rules:
  hospital: "us_mayo"
