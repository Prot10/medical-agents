            pulmonic: normal
            tricuspid: normal
          ejection_fraction: 60.0
          wall_motion: no regional wall-motion abnormality
          findings:
          - No left atrial appendage thrombus and no spontaneous echo contrast.
          - Intact interatrial septum; no patent foramen ovale on colour Doppler or agitated saline; no atrial septal
            aneurysm.
          - No valvular vegetation. Thoracic aorta without complex atheroma (grade I or less).
          impression: Normal transoesophageal echocardiogram. No cardioembolic source identified.
          recommended_actions: []
        bubble_study:
          echo_type: bubble_study
          chambers:
            LA: normal size
            LV: normal size and systolic function
            RA: normal size
            RV: normal size and function
          valves:
            aortic: structurally normal
            mitral: structurally normal
            pulmonic: normal
            tricuspid: normal
          ejection_fraction: 60.0
          wall_motion: no regional wall-motion abnormality
          findings:
          - Agitated saline injected at rest and with Valsalva release; adequate right heart opacification.
