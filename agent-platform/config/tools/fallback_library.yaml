# Benchmark-level fallback library: the MockServer's last tier.
#
# A normal, non-contributory report for every tool and parameter value, served identically in every
# case when the case has neither a pathway output nor a case-specific fallback for the order, so an
# off-pathway order never reveals that it was off-pathway. Authored 2026-09-03 from the tool output
# schemas (packages/neuroagent-schemas/.../tool_outputs.py); `status: draft` until physicians have
# reviewed it. Resolution rules: agent-platform/src/neuroagent/tools/fallback_library.py.
version: 1
status: draft
tools:
  analyze_eeg:
    by:
      eeg_type:
        routine:
          eeg_type: routine
          classification: normal
          background:
            overall: normal organisation for age
            pdr: 9-10 Hz posterior dominant rhythm, symmetric and reactive to eye opening
            sleep_features: drowsiness attained; normal vertex waves
          findings: []
          artifacts: []
          activating_procedures:
            hyperventilation: performed for 3 minutes; no significant change
            photic_stimulation: 1-30 Hz; symmetric driving response, no photoparoxysmal response
          impression: Normal awake and drowsy routine EEG. No epileptiform discharges and no focal slowing.
          limitations: Approximately 25 minutes of recording; a normal routine EEG does not exclude epilepsy.
          recommended_actions: []
        sleep_deprived:
          eeg_type: sleep_deprived
          classification: normal
          background:
            overall: normal organisation for age in wakefulness and sleep
            pdr: 9-10 Hz posterior dominant rhythm, symmetric and reactive
            sleep_features: stage N1-N2 sleep attained with normal vertex waves, sleep spindles and K-complexes;
              arousals normal
          findings: []
          artifacts: []
          activating_procedures:
            hyperventilation: performed for 3 minutes; no activation
            photic_stimulation: 1-30 Hz; no photoparoxysmal response
            sleep: natural sleep after overnight deprivation; no activation of epileptiform activity
          impression: Normal sleep-deprived EEG including wakefulness, drowsiness and N2 sleep. No epileptiform
            discharges and no focal slowing.
          limitations: A normal interictal recording does not exclude epilepsy.
          recommended_actions: []
        ambulatory:
          eeg_type: ambulatory
          classification: normal
          background:
            overall: normal organisation throughout the recording
            pdr: 9-10 Hz posterior dominant rhythm, symmetric and reactive in wakefulness
            sleep_features: normal sleep architecture across two nights with vertex waves, spindles and K-complexes
          findings: []
          artifacts:
          - type: movement and electrode
            description: intermittent movement and electrode artefact during daytime activity; did not obscure interpretation
          activating_procedures: {}
          impression: Normal 48-hour ambulatory EEG. No electrographic seizures and no interictal epileptiform discharges.
            No events were recorded by the patient during the recording period.
          limitations: No push-button events captured; sampled behaviour without concurrent video.
          recommended_actions: []
        video:
          eeg_type: video
          classification: normal
          background:
            overall: normal organisation for age in wakefulness and sleep
            pdr: 9-10 Hz posterior dominant rhythm, symmetric and reactive
            sleep_features: normal sleep architecture with vertex waves and sleep spindles
          findings: []
          artifacts: []
          activating_procedures:
            hyperventilation: performed; no significant change
            photic_stimulation: 1-30 Hz; no photoparoxysmal response
          impression: Normal video-EEG recording over the monitoring period. No clinical events occurred and no
            interictal epileptiform discharges were seen.
          limitations: No typical clinical events were captured during monitoring; the interictal recording alone
            does not exclude epilepsy.
          recommended_actions: []
        continuous_icu:
          eeg_type: continuous_icu
          classification: normal
          background:
            overall: continuous, symmetric and reactive background
            pdr: 8-9 Hz posterior dominant rhythm during wakefulness, reactive to stimulation
            sleep_features: sleep transients present with preserved sleep-wake cycling
          findings: []
          artifacts:
          - type: electrical and ventilator
            description: intermittent 60 Hz and ventilator artefact; did not preclude interpretation
          activating_procedures: {}
          impression: Continuous EEG monitoring over 24 hours shows a continuous, reactive background with preserved
            sleep-wake cycling. No electrographic seizures, periodic discharges or rhythmic patterns on the ictal-interictal
            continuum.
          limitations: Quantitative trends reviewed with raw EEG; recording quality adequate throughout.
          recommended_actions: []
  analyze_brain_mri:
    by:
      protocol:
        standard:
          findings: []
          volumetrics: null
          additional_observations:
          - Normal grey-white differentiation; no restricted diffusion.
          - No white matter signal abnormality on FLAIR; no susceptibility artefact on SWI.
          - Ventricles and sulci normal for age; no midline shift or extra-axial collection.
          - No abnormal enhancement following gadolinium.
          impression: Normal MRI of the brain.
          recommended_actions: []
        stroke:
          findings: []
          volumetrics: null
          additional_observations:
          - No restricted diffusion to suggest acute or subacute infarction.
          - No susceptibility to suggest haemorrhage or microbleeds on SWI.
          - No chronic infarct and no significant small-vessel white matter change.
          - Major intracranial flow voids preserved.
          impression: No acute infarct, haemorrhage or mass lesion. Normal stroke-protocol MRI.
          recommended_actions: []
        epilepsy:
          findings: []
          volumetrics:
            hippocampal_volume: symmetric, within normal limits for age
          additional_observations:
          - Hippocampi symmetric in size and signal with preserved internal architecture on coronal FLAIR and T2.
          - No cortical dysplasia, transmantle sign or grey-white blurring on thin-section 3D T1 and FLAIR.
          - No cavernoma, tumour or gliosis; no periventricular nodular heterotopia.
          impression: Normal epilepsy-protocol MRI. No hippocampal sclerosis and no epileptogenic structural lesion
            identified.
          recommended_actions: []
        ms:
          findings: []
          volumetrics: null
          additional_observations:
          - No T2/FLAIR hyperintense lesions in periventricular, juxtacortical, infratentorial or spinal regions
            imaged.
          - No enhancing lesion following gadolinium.
          - No central vein sign candidates on SWI; no paramagnetic rim lesions.
          impression: Normal demyelination-protocol MRI of the brain. No lesions meeting dissemination in space.
          recommended_actions: []
        dementia:
          findings: []
          volumetrics:
            medial_temporal_atrophy: MTA score 0-1 bilaterally, appropriate for age
            global_cortical_atrophy: GCA score 0
            fazekas: grade 0-1
          additional_observations:
          - Hippocampi and entorhinal cortex preserved bilaterally; no disproportionate parietal or frontal atrophy.
          - No significant white matter hyperintensities; no microbleeds or superficial siderosis on SWI.
          - No hydrocephalus; ventricular size proportionate to sulcal prominence.
          - No restricted diffusion in the cortex or basal ganglia.
          impression: Normal dementia-protocol MRI. No atrophy pattern beyond that expected for age and no vascular
            or structural abnormality.
          recommended_actions: []
        tumor:
          findings: []
          volumetrics: null
          additional_observations:
          - No intra-axial or extra-axial mass lesion on T1, T2 and FLAIR.
          - No abnormal enhancement following gadolinium; no leptomeningeal enhancement.
          - No restricted diffusion, no elevated relative cerebral blood volume on perfusion, no susceptibility.
          - No midline shift, hydrocephalus or transtentorial herniation.
          impression: Normal tumour-protocol MRI of the brain. No mass lesion.
          recommended_actions: []
