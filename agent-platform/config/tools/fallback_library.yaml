            passage.
          impression: Normal transthoracic echocardiogram with agitated saline contrast. No right-to-left shunt
            detected.
          recommended_actions: []
        exercise_echo:
          echo_type: exercise_echo
          chambers:
            LA: normal size
            LV: normal size and resting systolic function
            RA: normal size
            RV: normal size and function
          valves:
            aortic: structurally normal
            mitral: structurally normal
            pulmonic: normal
            tricuspid: normal
          ejection_fraction: 62.0
          wall_motion: no resting or stress-induced regional wall-motion abnormality
          findings:
          - Achieved 9.5 METs on treadmill protocol with 90 percent of age-predicted maximal heart rate.
          - Appropriate hyperdynamic response at peak stress; ejection fraction rose from 62 to 74 percent.
          - No ischaemic ECG change and no arrhythmia during exercise or recovery.
          impression: Normal exercise stress echocardiogram. No inducible ischaemia.
          recommended_actions: []
