# Orders the benchmark library must never answer, per condition (25 Oct 2026).
#
# The library (`fallback_library.yaml`) answers an order a case stores nothing for with the same
# normal report in every case. Where that normal would contradict the case (the condition's
# characteristic test, the patient's history, a finding the case already stores), the case stores
# its own report, and `test_case_guards.py::test_library_never_answers_a_contradicted_order`
# keeps it so. Merged from the October 2026 review round's per-group maps
# (`data/review/round-2026-10/plans/LIBRARY-group*-map.yaml`); reasons in the matching decisions
# files.
#
# COND:
#   all_cases: [{tool: ..., params: {...}}]   # every case of the condition
#   except: [CASE, ...]                       # cases exempt from all_cases (mimics)
#   cases: {CASE: [{tool: ..., params: {...}}]}
