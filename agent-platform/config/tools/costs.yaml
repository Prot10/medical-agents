# Tool cost configuration — reference rates in EUR
# Source: US Medicare Physician Fee Schedule (2024) converted at 1 USD = 0.92 EUR
# (mid-2026 reference rate). These are reference rates for cost-efficiency
# evaluation; actual fees vary by country, payer, and facility. Italian SSN
# tariffs are typically lower for diagnostic studies; private-sector EU rates
# are typically higher.

tools:
  analyze_brain_mri:
    # CPT 70551 (without contrast), 70553 (with+without contrast)
    base: 294
    modifiers:
      contrast: 116  # 320 + 126 = 446 for CPT 70553
    # Protocol does not change billing — radiologist selects sequences
    protocols:
      standard: 0
      epilepsy: 0
      stroke: 0
      tumor: 0
      ms: 0
      dementia: 0

  analyze_eeg:
    # CPT 95816 (routine), 95819 (awake and asleep, i.e. sleep-deprived), 95711/95717
    # (ambulatory), 95720-95726 (video-EEG)
    by_type:
      routine: 230
      # Added on the July 2026 clinical review: reviewer 1 asked for a sleep-deprived study as
      # the second-line recording when a normal routine EEG leaves the question open, and the
      # vocabulary had no way to express it, so the request could be neither ordered nor scored.
      sleep_deprived: 276
      ambulatory: 644
      video: 1104
      continuous_icu: 828

  analyze_ecg:
    # CPT 93000 (12-lead global)
    base: 18

  interpret_labs:
    # Per-panel costs from CMS Clinical Lab Fee Schedule
    by_panel:
      CBC: 14
      BMP: 18
      CMP: 28
      LFT: 23
      coagulation: 18
      thyroid: 28
      TSH: 23
      lipid: 18
      B12: 18
      folate: 14
      ESR: 9
      CRP: 14
      # Antistreptolysin-O titre. SYNC-CARD-RM02's lab report states the ASO result and its
      # ground truth turns on it (rheumatic activity), but the assay had no price, so the agent
      # could not name it and no optimal action could ask for it — the same
      # a-term-without-a-price gap the vocabulary rule exists to prevent, in reverse.
      ASO: 18
      urinalysis: 9
      troponin: 23
      BNP: 37
      HbA1c: 23
      RPR: 14
      HIV: 23
      ceruloplasmin: 23
      copper: 18
      drug_screen: 28
      prolactin: 23
      AED_levels: 28
      dementia_workup: 92
      inflammatory_markers: 28
      autoimmune_basic: 74
      autoimmune_encephalitis: 1840
      paraneoplastic: 2300
      NMO_MOG: 460
      genetic: 1380
      # --- Panels the 600 NeuroBench cases actually order (free-text `panels`, so the authors
      # wrote real, specific lab names). Priced from CMS Clinical Lab Fee Schedule bands so the
      # cost reward is accurate rather than everything collapsing to default_panel. Aliases of a
      # panel already above carry its price. See docs/benchmark/tool-contract.md.
      # Routine chemistry singles
      glucose: 5
      sodium: 7
      calcium: 7
      creatinine: 7
      bilirubin: 7
      magnesium: 9
      LDH: 9
      CK: 14
      aldolase: 18
      ammonia: 18
      haptoglobin: 14
      iron_studies: 23
      "peripheral smear": 9
      smear: 9
      eosinophil_count: 9
      "beta-hCG": 14
      procalcitonin: 28
      D_dimer: 14
      "D-dimer": 14
      ACE: 28
      # Named by the ground truth of 100+ status-epilepticus and hepatic-encephalopathy actions
      # and reported in their stored lab panels, but never priced — so the agent could not ask
      # for either and no optimal action could pin them.
      lactate: 14
      ABG: 28   # arterial blood gas: pH, pCO2, pO2, bicarbonate, base excess
      # Aliases of panels already priced above
      LFTs: 23
      UA: 9
      lipids: 18
      lipid_panel: 18
      "lipid panel": 18
      syphilis: 14
      toxicology: 28
      tox_screen: 28
      valproate_level: 28
      ESR_CRP: 23
      serum_copper: 18
      # Vitamins / metabolic
      vitamin_D: 40
      MMA: 28
      homocysteine: 28
      thiamine_B1: 37
      niacin_B3: 40
      zinc: 18
      "24h_urinary_copper": 28
      # Myeloma / paraprotein workup
      SPEP: 28
      IFE: 28
      serum_free_light_chains: 60
      beta2_microglobulin: 18
      quantitative_Ig: 28
      IgA: 18
      IgE: 18
      IgG_subclasses: 28
      plasma_progranulin: 100
      # Autoimmune / rheumatologic
      ANA: 18
      anti_dsDNA: 23
      "anti-dsDNA": 23
      ANCA: 28
      RF: 14
      anti_CCP: 28
      complement: 14
      C3: 9
      C4: 9
      "complement C3/C4": 18
      cryoglobulins: 37
      anti_SSA: 23
      anti_SSB: 23
      anti_Jo1: 28
      myositis_panel: 200
      "vasculitis screen": 100
      inflammatory: 28
      # Thrombophilia / coagulation
      protein_C: 37
      "protein C": 37
      protein_S: 37
      "protein S": 37
      "antithrombin III": 37
      "factor V Leiden": 200
      "prothrombin G20210A": 200
      lupus_anticoagulant: 37
      "lupus anticoagulant": 37
      antiphospholipid: 60
      anti_cardiolipin: 23
      "anticardiolipin IgG": 23
      "anticardiolipin IgM": 23
      anti_b2GP1: 23
      "anti-beta-2-glycoprotein-I IgG": 23
      "anti-beta-2-glycoprotein-I IgM": 23
      type_and_screen: 23
      ADAMTS13: 200
      ADAMTS13_activity: 200
      ADAMTS13_inhibitor: 200
      # Neuromuscular / paraneoplastic autoantibodies (send-out)
      anti_AChR: 100
      clustered_AChR_cell_based: 150
      anti_MuSK: 150
      anti_LRP4: 150
      AQP4_IgG: 230
      MOG_IgG: 230
      "anti-GM1 IgM": 100
      anti_MAG: 200
      anti_NF155: 300
      anti_CNTN1: 300
      anti_VGCC_PQ: 200
      anti_VGCC_N: 200
      anti_SOX1: 200
      VEGF: 60
      paraneoplastic_panel: 2300
      paraneoplastic_antibodies: 2300
      autoimmune_encephalitis_panel: 1840
      # Endocrine / thyroid
      "Free T4": 28
      free_T4: 28
      free_T3: 28
      TRAb: 37
      anti_TPO: 23
      PTH: 37
      gastrin: 28
      endocrine_panel: 40
      anti_intrinsic_factor: 23
      anti_parietal_cell: 23
      # Infectious serologies. Blood cultures are NOT here: they are
      # `order_microbiology{specimen: blood_culture}`. They were priced under both tools, so the
      # same study was reachable two ways and either satisfied the ground truth — exactly what
      # the one-study-one-tool rule below `perform_clinical_assessment` exists to prevent. 62
      # cases were ordering them through the laboratory tool and have been moved.
      VZV_IgG: 23
      Lyme_serology: 28
      hepatitis_B_surface_antigen: 18
      anti_HBc_IgG: 18
      hepatitis_C_antibody: 18
      anti_JCV_antibody: 100
      BAL: 100
      # Genetic
      "androgen receptor CAG repeat": 300
      # Toxicology / heavy metals
      blood_lead: 18
      urine_arsenic: 28
      urine_thallium: 28
      blood_mercury: 28
      # Porphyria workup
      urine_PBG: 37
      urine_ALA: 37
      urine_porphyrins: 37
      fecal_porphyrins: 37
      plasma_porphyrins: 37
    default_panel: 23

  analyze_csf:
    # CPT 62270 (LP procedure) + basic studies
    base: 230  # LP procedure + cell count, protein, glucose
    by_special_test:
      oligoclonal_bands: 23
      IgG_index: 18
      HSV_PCR: 184
      meningitis_panel: 322
      cytology: 37
      flow_cytometry: 184
      autoimmune_panel: 1840
      14_3_3_protein: 92
      RT_QuIC: 138
      Abeta42: 138
      phospho_tau: 138
      total_tau: 92
      NMDAR_antibodies: 276
      MOG_antibodies: 230
      # Assays the benchmark cases order but which had no row, so they silently fell back to
      # `default_test` (46). Rates are reference estimates in the same CLFS band as their
      # neighbours and are pending coding sign-off; they are not read from a fee schedule.
      NfL: 276                  # CSF neurofilament light chain (ALS, neurodegeneration)
      NfH: 276                  # CSF neurofilament heavy chain
      Abeta42_40_ratio: 184     # Abeta42/40 ratio (more specific than Abeta42 alone)
      VDRL: 23                  # CSF VDRL (neurosyphilis)
      HIV_RNA: 184              # CSF HIV viral load
      JCV_PCR: 184              # JC virus PCR (PML)
      cryptococcal_antigen: 46  # CSF CrAg
      ACE_CSF: 46               # CSF angiotensin-converting enzyme (neurosarcoidosis)
    default_test: 46

  order_ct_scan:
    # CPT 70450 (without contrast), 70460 (with contrast), 70496 (CTA head)
    base: 184
    modifiers:
      contrast: 92
      angiography: 184

  order_echocardiogram:
    # CPT 93306 (TTE), 93312 (TEE), 93350 (echo during exercise stress)
    by_type:
      TTE: 276
      TEE: 552
      bubble_study: 368
      # Exercise echocardiography. Its own study, not order_specialized_test's ergometry:
      # the answer is an imaged, provoked left-ventricular outflow gradient, not the ECG
      # response to exertion. ESC 2018 gives it a Class I recommendation in hypertrophic
      # cardiomyopathy with syncope and a resting or provoked peak gradient below 50 mmHg;
      # SYNC-CARD-P02 was modelling it as a stress test, so a plain treadmill test scored
      # the point.
      exercise_echo: 460

  order_cardiac_monitoring:
    # CPT 93224 (Holter 24h), 93226 (48h), 93291 (event monitor), 33285 (ILR insertion)
    by_type:
      holter_24h: 138
      holter_48h: 184
      event_monitor_14d: 230
      event_monitor_30d: 276
      telemetry: 92
      # Implantable loop recorder: months-to-years of monitoring, used when the cases
      # specify duration_days of 180-365 (cryptogenic stroke, unexplained syncope). It has
      # no honest substitute among the external monitors, so it gets its own row rather
      # than being mis-mapped onto a 30-day event monitor.
      implantable_loop_recorder: 4600

  order_advanced_imaging:
    # Closed vocab defined in dataset-generation/TOOL_PARAMETER_VOCABULARY.md
    by_type:
      amyloid_PET: 3680
      tau_PET: 4140
      FDG_PET: 1840
      # Cardiac 18F-FDG PET/CT. A different study from the brain scan above under the same
      # tracer: 24-72 h of dietary suppression of myocardial glucose uptake, gated cardiac
      # acquisition, read against a perfusion study. Requested by the clinical review as part
      # of second-line cardiac imaging; SYNC-CARD-RP05 (cardiac sarcoidosis) was pinning
      # `FDG_PET`, so the ground truth for a cardiac question was satisfied by a dementia
      # scan. Priced above the brain study for the preparation and the co-registered perfusion.
      cardiac_FDG_PET: 2300
      # 11C-methionine / 18F-FET. Requested by the clinical review for high-grade glioma, to
      # separate treatment effect from true progression and to target biopsy at the most
      # aggressive area (EANO 2021, RANO). The same source states 18F-FDG is NOT an adequate
      # tracer for primary brain tumours, so without this row the only route to that question
      # was the study the guideline rules out. Between FDG_PET and amyloid_PET: cost is
      # dominated by tracer production (11C-methionine needs an on-site cyclotron).
      # Reference estimate, pending coding sign-off — as for the rest of this file.
      amino_acid_PET: 2300
      DaTscan: 4600
      MIBG_scan: 1656
      perfusion_MRI: 460
      # CT perfusion — tissue-based selection for extended-window thrombolysis and for
      # thrombectomy 6-24 h from last known well (AHA/ASA 2026). Only perfusion_MRI existed,
      # so the CT arm of that pathway was unreachable.
      CT_perfusion: 460
      cardiac_MRI: 552
      # Second-line cardiac imaging beyond the echocardiogram, requested by the clinical
      # review as one OPTIONAL item alongside cardiac_MRI: "the panel offers no such
      # escalation while it does offer brain MRI — the arrangement most likely to produce the
      # wrong imaging choice". The reviewer weighted the two halves differently and so does
      # this file: CT/MR escalation rests on advisory guideline text, whereas coronary
      # angiography carries a Class IIa recommendation (ESC 2018) driven by suspected
      # ischaemia rather than by the syncope itself.
      coronary_CTA: 460          # CPT 75574 — non-invasive route to coronary disease
      coronary_angiography: 2760  # invasive catheter study, procedure + facility
      # Cerebral digital subtraction angiography. Added 2026-08-08 after the per-case audit found
      # that the gold standard of the aneurysmal-SAH pathway could not be ordered, priced or scored:
      # coronary angiography was here, cerebral angiography was not. All 30 SAH cases made the CT
      # angiogram their definitive study, and the three stored DSA reports — including the one
      # carrying the coiling result — were reachable by no action at all. DSA is what AHA/ASA 2023
      # requires when the CTA is negative in a patient with a diffuse aneurysmal bleed pattern, and
      # it is the route by which the aneurysm is treated.
      # CPT 36224 (selective catheter placement, internal carotid, with angiography) plus facility;
      # priced just under coronary_angiography, which includes the cardiac catheterisation suite.
      cerebral_angiography: 2530
      MR_spectroscopy: 460
      MR_angiography: 552
      MR_venography: 506
      carotid_duplex: 322
      transcranial_doppler: 230

  order_specialized_test:
    # Closed vocab defined in dataset-generation/TOOL_PARAMETER_VOCABULARY.md
    by_type:
      neuropsych_battery: 1104
      emg_ncs: 552
      emg_single_fiber: 828
      repetitive_nerve_stimulation: 368
      nerve_biopsy: 1380
      muscle_biopsy: 1380
      skin_biopsy_iencf: 644
      minor_salivary_gland_biopsy: 644
      polysomnography: 920
      tilt_table: 276
      vep: 184
      ssep: 184
      baep: 184
      autonomic_testing: 368
      optical_coherence_tomography: 138
      visual_field_perimetry: 110
      ice_pack_test: 0
      respiratory_function: 92
      exercise_stress_test: 230
    # Rate for a `genetic_panel:<panel>` whose <panel> has no row below
    # (out-of-vocabulary panels are warned at execute time and here).
    # Approximate mid-size panel; value carried over unchanged from the
    # previous hardcoded fallback (predates the EUR conversion) to keep the
    # cost metric continuous.
    default_genetic_panel: 1500
    # `genetic_panel:<panel>` parameters (cost varies by panel size)
    genetic_panels:
      ALS: 1840
      FTD: 1840
      HD: 552
      CADASIL: 1104
      CAA: 1380
      early_onset_AD: 2300
      hereditary_ataxia: 2300
      CMT: 1656
      HSP: 1840
      mitochondrial: 2760
      MS_genetic_risk: 736
      wilson: 1104              # ATP7B
      porphyria: 1656           # HMBS, ALAS1, CPOX, PPOX
      small_fiber_neuropathy: 1380  # SCN9A, SCN10A, SCN11A
      PD: 1840                  # PRKN, PINK1, DJ-1, LRRK2, GBA, SNCA

  # --- Tools added after the July 2026 clinical tool review -------------------------------
  # The reviewers' structural finding: the action space could only image the brain and could
  # not obtain a specimen, so several conditions had a mandatory step with no callable act.
  # Rates are EUR reference estimates in the same band as the studies already listed above
  # (technical + professional component), pending coding sign-off — same caveat as the rest
  # of this file, not fee-schedule lookups.
  # One discriminator + one `by_type` block each, exactly like order_advanced_imaging, so
  # vocabulary.by_type_values, CostTracker._cost_by_type and the metric layer's scalar
  # discriminator all apply unchanged. Region and modality are fused into one `study` term
  # rather than split across two parameters, because a CT and an MRI of the same region are
  # different studies at different prices, and one term keeps them individually priceable.
  order_body_imaging:
    by_type:
      pelvis_abdomen_CT: 368
      pelvis_abdomen_MRI: 552
      pelvis_abdomen_ultrasound: 184
      # Thorax. The review asked for "cardiac or thoracic CT angiography when aortic
      # dissection, pulmonary embolism or a cardiac mass has to be confirmed or excluded
      # rapidly", and SYNC-CARD-RM04 was asking for a CT pulmonary angiogram through
      # order_ct_scan — the head tool, which has no region parameter. Its discriminators
      # (contrast, angiography) were therefore identical to a head-and-neck CTA, so imaging
      # the brain of a patient with a pulmonary embolism scored the required action. Thoracic
      # imaging belongs here, with the other regions, under the same <region>_<modality> term.
      chest_CT: 276
      chest_CTA: 368
      # One acquisition, one report, one charge — the staging / occult-primary study, and how 57
      # cases (anti-NMDAR teratoma search, glioma staging) actually order it. They were ordering
      # it through order_ct_scan with a `region: chest_abdomen_pelvis` annotation the head-CT
      # schema does not have and silently drops.
      chest_abdomen_pelvis_CT: 460
      mediastinum_CT: 322
      mediastinum_MRI: 506
      spine_MRI: 552
      spine_CT: 322
      peripheral_nerve_MRI: 460
      peripheral_nerve_ultrasound: 184
    modifiers:
      contrast: 116

  order_microbiology:
    by_type:
      blood_culture: 37
      whole_blood_pcr: 184
      throat_swab: 28
      urine: 28
      # Diagnostic paracentesis: the procedure plus its fluid studies (PMN count, protein,
      # culture into blood-culture bottles at the bedside), per EASL 2022.
      ascitic_fluid: 276

  obtain_tissue_diagnosis:
    # Two-part, like analyze_csf: the procedure, then the assays run on the specimen.
    # Resection is priced as the diagnostic act only — it is also therapeutic, which the
    # benchmark does not bill for.
    by_type:
      stereotactic_biopsy: 2760
      resection: 9200
      # Extracardiac / extracranial nodal sampling — EBUS-transbronchial needle aspiration or
      # surgical node biopsy. Added for the same reason the tool exists at all: SYNC-CARD-RP05
      # (cardiac sarcoidosis) carried "arrange tissue diagnosis (bronchoscopy with lymph node
      # biopsy)" as a `tool_name: null` referral, which is precisely the pattern the review
      # objected to in glioma — a mandatory step with no callable act. Histology here is a
      # pattern (non-necrotising granulomas), so no molecular assay is implied.
      lymph_node_biopsy: 1840
    by_molecular_assay:
      IDH1_IHC: 138
      IDH1_IDH2_sequencing: 552
      ATRX_IHC: 138
      1p_19q_codeletion: 460
      CDKN2A_B_deletion: 460
      TERT_promoter: 368
      EGFR_amplification: 368
      chr7_gain_chr10_loss: 460
      H3K27_status: 276
      MGMT_methylation: 460
      BRAF_V600: 276
    # Rate for an assay with no row above (warned at execute time and here).
    default_molecular_assay: 368

  perform_clinical_assessment:
    # The reviewers named these as required steps with no callable act behind them. Kept
    # deliberately small and non-overlapping: a full battery is already
    # order_specialized_test{neuropsych_battery}, bedside spirometry is already
    # {respiratory_function}, and formal autonomic testing is already {autonomic_testing}.
    # Duplicating a study under a second tool would let either satisfy the ground truth.
    by_type:
      cognitive_screen: 92                 # MoCA / MMSE at the bedside, not a full battery
      structured_headache_history_ichd3: 138
      gait_and_balance_timed: 92           # TUG / timed walk; the NPH tap test is two of these
      functional_neuro_signs: 138          # Hoover, entrainment — the positive signs of FND

  search_medical_literature:
    base: 0

  check_drug_interactions:
    base: 0

# Legacy flat costs (kept for backward compatibility with training rewards)
tool_costs:
  analyze_brain_mri: 294
  analyze_eeg: 230
  analyze_csf: 230
  analyze_ecg: 18
  interpret_labs: 23
  order_ct_scan: 184
  order_echocardiogram: 276
  order_cardiac_monitoring: 138
  order_advanced_imaging: 1840
  order_specialized_test: 552
  search_medical_literature: 0
  check_drug_interactions: 0
