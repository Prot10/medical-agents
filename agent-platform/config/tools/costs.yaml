      CBC: 14
      BMP: 18
      CMP: 28
      LFT: 23
      coagulation: 18
      thyroid: 28
      TSH: 23
      lipid: 18
      B12: 18
      folate: 14
      ESR: 9
      CRP: 14
      urinalysis: 9
      troponin: 23
      BNP: 37
      HbA1c: 23
      RPR: 14
      HIV: 23
      ceruloplasmin: 23
      copper: 18
      drug_screen: 28
      prolactin: 23
      AED_levels: 28
      dementia_workup: 92
      inflammatory_markers: 28
      autoimmune_basic: 74
      autoimmune_encephalitis: 1840
      paraneoplastic: 2300
      NMO_MOG: 460
      genetic: 1380
