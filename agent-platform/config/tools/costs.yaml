      # panel already above carry its price. See docs/benchmark/tool-contract.md.
      # Routine chemistry singles
      glucose: 5
      sodium: 7
      calcium: 7
      creatinine: 7
      bilirubin: 7
      magnesium: 9
      phosphate: 9
      serum_osmolality: 9
      urine_osmolality: 9
      LDH: 9
      CK: 14
      aldolase: 18
      ammonia: 18
      haptoglobin: 14
      iron_studies: 23
      "peripheral smear": 9
      smear: 9
      eosinophil_count: 9
      "beta-hCG": 14
      procalcitonin: 28
      D_dimer: 14
      "D-dimer": 14
      ACE: 28
      # Named by the ground truth of 100+ status-epilepticus and hepatic-encephalopathy actions
      # and reported in their stored lab panels, but never priced — so the agent could not ask
      # for either and no optimal action could pin them.
      lactate: 14
      ABG: 28   # arterial blood gas: pH, pCO2, pO2, bicarbonate, base excess
      # Aliases of panels already priced above
      LFTs: 23
      UA: 9
      lipids: 18
      lipid_panel: 18
      "lipid panel": 18
      syphilis: 14
      toxicology: 28
      tox_screen: 28
      valproate_level: 28
      lithium_level: 28
      ESR_CRP: 23
      serum_copper: 18
      # Vitamins / metabolic
      vitamin_D: 40
      MMA: 28
      homocysteine: 28
      thiamine_B1: 37
      niacin_B3: 40
      zinc: 18
      "24h_urinary_copper": 28
      m3243A_G_mtDNA: 300
      # Myeloma / paraprotein workup
      SPEP: 28
      IFE: 28
      serum_free_light_chains: 60
      beta2_microglobulin: 18
      quantitative_Ig: 28
      IgA: 18
      IgE: 18
      IgG_subclasses: 28
      plasma_progranulin: 100
      # Autoimmune / rheumatologic
      ANA: 18
      anti_dsDNA: 23
      "anti-dsDNA": 23
      ANCA: 28
      RF: 14
      anti_CCP: 28
      complement: 14
      C3: 9
      C4: 9
      "complement C3/C4": 18
      cryoglobulins: 37
      anti_SSA: 23
      anti_SSB: 23
      anti_Jo1: 28
      myositis_panel: 200
      "vasculitis screen": 100
      inflammatory: 28
      # Thrombophilia / coagulation
      protein_C: 37
      "protein C": 37
      protein_S: 37
      "protein S": 37
      "antithrombin III": 37
      "factor V Leiden": 200
      "prothrombin G20210A": 200
      lupus_anticoagulant: 37
      "lupus anticoagulant": 37
      antiphospholipid: 60
      anti_cardiolipin: 23
      "anticardiolipin IgG": 23
      "anticardiolipin IgM": 23
      anti_b2GP1: 23
      "anti-beta-2-glycoprotein-I IgG": 23
      "anti-beta-2-glycoprotein-I IgM": 23
      type_and_screen: 23
      ADAMTS13: 200
      ADAMTS13_activity: 200
      ADAMTS13_inhibitor: 200
      # Neuromuscular / paraneoplastic autoantibodies (send-out)
      anti_AChR: 100
      clustered_AChR_cell_based: 150
      anti_MuSK: 150
      anti_LRP4: 150
      AQP4_IgG: 230
      MOG_IgG: 230
      AQP4_IgG_cell_based: 230
      MOG_IgG_cell_based: 230
      "anti-GM1 IgM": 100
      anti_MAG: 200
      anti_NF155: 300
      anti_CNTN1: 300
      anti_VGCC_PQ: 200
      anti_VGCC_N: 200
      anti_SOX1: 200
      VEGF: 60
      paraneoplastic_panel: 2300
      paraneoplastic_antibodies: 2300
      autoimmune_encephalitis_panel: 1840
      # Endocrine / thyroid
      "Free T4": 28
      free_T4: 28
      free_T3: 28
      TRAb: 37
      anti_TPO: 23
      anti_thyroglobulin: 23
      # Serum IgG anti-GluN1 by live cell-based assay. Kept distinct from the CSF assay:
      # Reviewer 2 requires parallel testing and explicitly warns against serum-only reading.
      NMDAR_IgG_cell_based: 276
      PTH: 37
      gastrin: 28
      endocrine_panel: 40
      anti_intrinsic_factor: 23
      anti_parietal_cell: 23
      # Infectious serologies. Blood cultures are NOT here: they are
      # `order_microbiology{specimen: blood_culture}`. They were priced under both tools, so the
      # same study was reachable two ways and either satisfied the ground truth — exactly what
      # the one-study-one-tool rule below `perform_clinical_assessment` exists to prevent. 62
      # cases were ordering them through the laboratory tool and have been moved.
      VZV_IgG: 23
      Lyme_serology: 28
      hepatitis_B_surface_antigen: 18
      anti_HBc_IgG: 18
      hepatitis_C_antibody: 18
      anti_JCV_antibody: 100
      BAL: 100
      # Genetic
      "androgen receptor CAG repeat": 300
      # Toxicology / heavy metals
      blood_lead: 18
      urine_arsenic: 28
      urine_thallium: 28
      blood_mercury: 28
      # Porphyria workup
      urine_PBG: 37
      urine_ALA: 37
      urine_porphyrins: 37
      fecal_porphyrins: 37
      plasma_porphyrins: 37
      # Requested by the October 2026 case review. HIV monitoring: ALS-P05 reported the viral load
      # and CD4 count inside an `HIV` screen that names neither, and the immunocompromised
      # meningitis cases (BACT-MEN P02, P03, RS04) turn on the CD4 count.
      HIV_viral_load: 184        # CPT 87536, HIV-1 RNA quantification; priced as the CSF HIV_RNA
      CD4_count: 46              # CPT 86361, absolute CD4 count by flow cytometry
      # Beta-2 transferrin on a nasal or ear fluid: the CSF-leak test of recurrent meningitis
      # (BACT-MEN-RP04 had no action to order it). CPT 86335, immunofixation of another fluid.
      beta2_transferrin: 46
      # Serum CrAg screening before antiretroviral therapy at CD4 < 200 (WHO 2022 cryptococcal
      # guideline; BACT-MEN RS04, P03). Kept apart from the CSF assay, which `analyze_csf` prices
      # as `cryptococcal_antigen`: one specimen, one tool. CPT 87327, priced as the CSF assay.
      serum_cryptococcal_antigen: 46
      # Moved from the general_medicine pack on 2026-10-24: alpha-fetoprotein, the hepatocellular
      # carcinoma surveillance assay in cirrhosis (October 2026 review, HEP-ENC-M08). CPT 82105.
      AFP: 21
      # Requested by the October 2026 case review of Guillain-Barré syndrome: the Miller Fisher,
      # pharyngeal-cervical-brachial and ophthalmoplegic cases (GBS P01, RM12, RM15, RS15) state
      # an anti-GQ1b or anti-GT1a result that no assay could order (only `anti-GM1 IgM`, the
      # AMAN / multifocal motor neuropathy antibody, was priced). Two terms, not one ganglioside
      # panel, because a panel would price anti-GM1 a second time. CPT 83516 per antibody,
      # send-out ELISA, priced as `anti-GM1 IgM`.
      anti_GQ1b_IgG: 100
      anti_GT1a_IgG: 100
      # Botulinum neurotoxin in serum (and stool or gastric aspirate) by mouse bioassay or mass
      # spectrometry, the confirmatory test of botulism, the descending-paralysis mimic of GBS
      # (October 2026 review, GBS RM12, RS15). Done by public-health reference laboratories with
      # no CMS rate (CPT 87798 at most covers a toxin-gene PCR); reference estimate, priced as a
      # single-target PCR.
      botulinum_toxin_assay: 184
      # Plasma free metanephrines (metanephrine and normetanephrine), the screening test for a
      # catecholamine-secreting paraganglioma before any anaesthesia (October 2026 review,
      # GLIO-HG-RS01). CPT 83835.
      plasma_free_metanephrines: 22
      # Requested by the October 2026 case review of status epilepticus (SE-P05, organophosphate
      # poisoning with electrographic status): the stored labs report plasma and RBC cholinesterase
      # activities that no assay could order. Two terms, because they are two assays read
      # differently: plasma (butyryl) cholinesterase falls first and recovers in weeks, RBC
      # acetylcholinesterase mirrors synaptic inhibition [Eddleston_2008]. CPT 82480 and 82482.
      plasma_cholinesterase: 9
      RBC_cholinesterase: 18
      # Serum neuron-specific enolase at 48 and 72 hours, the biomarker of the ERC-ESICM 2021
      # multimodal prognosis after cardiac arrest (October 2026 review, SE-P03 and SE-M07 name it
      # in their prognostication plan). CPT 86316.
      NSE: 23
      # Toxoplasma gondii IgG, the serostatus that makes toxoplasmic encephalitis likely in
      # advanced HIV (October 2026 review, SE-M08). CPT 86777. IgM is not added: reactivation is
      # IgM-negative and the opportunistic-infection guideline does not use it.
      toxoplasma_IgG: 18
      # Spot urine sodium, with serum and urine osmolality the SIADH work-up of hyponatraemia
      # (October 2026 review, SE-M04 [Spasovski_2014]). CPT 84300, priced as serum sodium.
      urine_sodium: 7
    default_panel: 23

  analyze_csf:
    # CPT 62270 (LP procedure) + basic studies
    base: 230  # LP procedure + cell count, protein, glucose
    by_special_test:
      oligoclonal_bands: 23
      IgG_index: 18
      HSV_PCR: 184
      meningitis_panel: 322
      cytology: 37
      flow_cytometry: 184
      autoimmune_panel: 1840
      14_3_3_protein: 92
      RT_QuIC: 138
      Abeta42: 138
      phospho_tau: 138
      total_tau: 92
      NMDAR_antibodies: 276
      MOG_antibodies: 230
      # Assays the benchmark cases order but which originally had no row. Rates are reference
      # estimates in the same CLFS band as their neighbours and are pending coding sign-off;
      # they are not read from a fee schedule.
      NfL: 276                  # CSF neurofilament light chain (ALS, neurodegeneration)
      NfH: 276                  # CSF neurofilament heavy chain
      Abeta42_40_ratio: 184     # Abeta42/40 ratio (more specific than Abeta42 alone)
      VDRL: 23                  # CSF VDRL (neurosyphilis)
      HIV_RNA: 184              # CSF HIV viral load
      JCV_PCR: 184              # JC virus PCR (PML)
      cryptococcal_antigen: 46  # CSF CrAg
      ACE_CSF: 46               # CSF angiotensin-converting enzyme (neurosarcoidosis)
      kappa_free_light_chain_index: 46  # accepted positive-CSF marker in the 2024 McDonald criteria
      # Bilirubin/oxyhaemoglobin spectrophotometry after a negative or inconclusive NCCT in
      # suspected aSAH. This is a distinct priced assay; visual inspection is not a substitute.
      xanthochromia_spectrophotometry: 46
      # Requested by the October 2026 case review of bacterial meningitis: the tuberculous and
      # cryptococcal mimics (BACT-MEN P02, P03) stored their decisive CSF results with no assay
      # an agent could name. One term for the mycobacterial work-up the WHO TB guideline sends
      # together: AFB smear (CPT 87206), Xpert MTB/RIF Ultra (CPT 87556) and mycobacterial
      # culture (CPT 87116).
      mycobacterial_panel: 230
      fungal_culture: 28        # CPT 87102, fungal culture with identification
      india_ink: 9              # CPT 87210, wet mount with India ink
      ADA: 37                   # CSF adenosine deaminase, CPT 82657 (enzyme activity)
      # CSF cytomegalovirus PCR, requested by the October 2026 review of Guillain-Barré syndrome
      # (GBS-P02: CMV polyradiculitis in advanced HIV; RM16, RP15 and RS18 stored a CMV PCR
      # result that no order could name). CPT 87496, priced as HSV_PCR.
      CMV_PCR: 184
      # CSF Toxoplasma gondii and Epstein-Barr virus PCR, which separate toxoplasmic
      # encephalitis from primary CNS lymphoma in a ring-enhancing lesion in advanced HIV
      # (October 2026 review, SE-M08; NIH/CDC/IDSA opportunistic-infection guideline). CPT 87798
      # each (single-target amplified probe), priced as HSV_PCR.
      toxoplasma_PCR: 184
      EBV_PCR: 184
    # Where the CSF comes from. Billing does not change (`base` prices the sampling with the
    # basic studies), as for the MRI `protocols` block; the block is the source of the
    # `source` enum. Requested by the October 2026 review (BACT-MEN RS02: a shunt tap could not
    # be told apart from a lumbar puncture, so it could not be scored). A shunt tap (CPT 61070)
    # is priced like the LP it replaces; a sample drawn from an EVD has no procedure fee, so its
    # bill is over-stated by the LP share of `base`.
    sources:
      lumbar_puncture: 0
      shunt_tap: 0
      external_ventricular_drain: 0

  order_ct_scan:
    # CPT 70450 (without contrast), 70460 (with contrast), 70496 (CTA head)
    base: 184
    modifiers:
      contrast: 92
      angiography: 184

  order_echocardiogram:
    # CPT 93306 (TTE), 93312 (TEE), 93350 (echo during exercise stress)
    by_type:
      TTE: 276
      TEE: 552
      bubble_study: 368
      # Exercise echocardiography. Its own study, not order_specialized_test's ergometry:
      # the answer is an imaged, provoked left-ventricular outflow gradient, not the ECG
      # response to exertion. ESC 2018 gives it a Class I recommendation in hypertrophic
      # cardiomyopathy with syncope and a resting or provoked peak gradient below 50 mmHg;
      # SYNC-CARD-P02 was modelling it as a stress test, so a plain treadmill test scored
      # the point.
      exercise_echo: 460

  order_cardiac_monitoring:
    # CPT 93224 (Holter 24h), 93226 (48h), 93291 (event monitor), 33285 (ILR insertion)
    by_type:
      holter_24h: 138
      holter_48h: 184
      event_monitor_14d: 230
      event_monitor_30d: 276
      telemetry: 92
      # Implantable loop recorder: months-to-years of monitoring, used when the cases
      # specify duration_days of 180-365 (cryptogenic stroke, unexplained syncope). It has
      # no honest substitute among the external monitors, so it gets its own row rather
      # than being mis-mapped onto a 30-day event monitor.
      implantable_loop_recorder: 4600
      # Interrogation of an implanted pacemaker, ICD or loop recorder: the stored diagnostics
      # (atrial high-rate episodes, AF burden, ventricular episodes) since the last check.
      # Requested by the October 2026 review of vascular dementia (VASC-DEM-P08: a dual-chamber
      # pacemaker's 12 months of atrial data was coded as an implantable loop recorder, so the
      # study priced 4600 for a device already in place). CPT 93288 (in-person interrogation
      # evaluation, pacemaker).
      device_interrogation: 51

  order_advanced_imaging:
    # Closed vocab defined in dataset-generation/TOOL_PARAMETER_VOCABULARY.md
    by_type:
      amyloid_PET: 3680
      tau_PET: 4140
      FDG_PET: 1840
      # Brain perfusion SPECT (99mTc-HMPAO/ECD): the clinical reviewers requested this as
      # the explicit substitute when FDG-PET is unavailable in dementia subtype work-up.
      perfusion_SPECT: 920
      # Cardiac 18F-FDG PET/CT. A different study from the brain scan above under the same
      # tracer: 24-72 h of dietary suppression of myocardial glucose uptake, gated cardiac
      # acquisition, read against a perfusion study. Requested by the clinical review as part
      # of second-line cardiac imaging; SYNC-CARD-RP05 (cardiac sarcoidosis) was pinning
      # `FDG_PET`, so the ground truth for a cardiac question was satisfied by a dementia
      # scan. Priced above the brain study for the preparation and the co-registered perfusion.
      cardiac_FDG_PET: 2300
      # 11C-methionine / 18F-FET. Requested by the clinical review for high-grade glioma, to
      # separate treatment effect from true progression and to target biopsy at the most
      # aggressive area (EANO 2021, RANO). The same source states 18F-FDG is NOT an adequate
      # tracer for primary brain tumours, so without this row the only route to that question
      # was the study the guideline rules out. Between FDG_PET and amyloid_PET: cost is
      # dominated by tracer production (11C-methionine needs an on-site cyclotron).
      # Reference estimate, pending coding sign-off — as for the rest of this file.
      amino_acid_PET: 2300
      DaTscan: 4600
      MIBG_scan: 1656
      perfusion_MRI: 460
      # CT perfusion — tissue-based selection for extended-window thrombolysis and for
      # thrombectomy 6-24 h from last known well (AHA/ASA 2026). Only perfusion_MRI existed,
      # so the CT arm of that pathway was unreachable.
      CT_perfusion: 460
      cardiac_MRI: 552
      # Second-line cardiac imaging beyond the echocardiogram, requested by the clinical
      # review as one OPTIONAL item alongside cardiac_MRI: "the panel offers no such
      # escalation while it does offer brain MRI — the arrangement most likely to produce the
      # wrong imaging choice". The reviewer weighted the two halves differently and so does
      # this file: CT/MR escalation rests on advisory guideline text, whereas coronary
      # angiography carries a Class IIa recommendation (ESC 2018) driven by suspected
      # ischaemia rather than by the syncope itself.
      coronary_CTA: 460          # CPT 75574 — non-invasive route to coronary disease
      coronary_angiography: 2760  # invasive catheter study, procedure + facility
      # Cerebral digital subtraction angiography. Added 2026-08-08 after the per-case audit found
      # that the gold standard of the aneurysmal-SAH pathway could not be ordered, priced or scored:
      # coronary angiography was here, cerebral angiography was not. All 30 SAH cases made the CT
      # angiogram their definitive study, and the three stored DSA reports — including the one
      # carrying the coiling result — were reachable by no action at all. DSA is what AHA/ASA 2023
      # requires when the CTA is negative in a patient with a diffuse aneurysmal bleed pattern, and
      # it is the route by which the aneurysm is treated.
      # CPT 36224 (selective catheter placement, internal carotid, with angiography) plus facility;
      # priced just under coronary_angiography, which includes the cardiac catheterisation suite.
      cerebral_angiography: 2530
      MR_spectroscopy: 460
      MR_angiography: 552
      MR_venography: 506
      carotid_duplex: 322
      transcranial_doppler: 230
      # Pre-surgical functional imaging, requested by the October 2026 case review of high-grade
      # glioma: 19 of 30 cases returned BOLD activation maps or tractography inside a report
      # ordered as `perfusion_MRI` (or as `analyze_brain_mri`), and several required functional
      # mapping that no action could order.
      # Eloquence decides how much of a tumour can be removed (AIOM / EANO: resection as
      # extensive as safely possible), so the study the decision rests on must be orderable.
      functional_MRI: 552        # CPT 70555, BOLD fMRI with physician-administered paradigms
      DTI_tractography: 368      # diffusion acquisition + CPT 76377 tractography post-processing

  order_specialized_test:
    # Closed vocab defined in dataset-generation/TOOL_PARAMETER_VOCABULARY.md
    by_type:
      neuropsych_battery: 1104
      emg_ncs: 552
      emg_single_fiber: 828
      repetitive_nerve_stimulation: 368
      nerve_biopsy: 1380
      muscle_biopsy: 1380
      skin_biopsy_iencf: 644
      minor_salivary_gland_biopsy: 644
      polysomnography: 920
      tilt_table: 276
      vep: 184
      ssep: 184
      baep: 184
      autonomic_testing: 368
      optical_coherence_tomography: 138
      visual_field_perimetry: 110
      ice_pack_test: 0
      respiratory_function: 92
      exercise_stress_test: 230
      # Pure-tone and speech audiometry with tympanometry (CPT 92557 + 92567). Reinstated on
      # 2026-10-24 (it was retired on 2026-08-05 as `pure_tone_audiometry`, unreferenced): the
      # October 2026 review of bacterial meningitis requires a hearing test before discharge or
      # within four weeks (WHO 2025, NICE NG240), and the cases could only state it as a must.
      audiometry: 55
      # Formal speech and language evaluation by a speech-language pathologist: motor speech
      # (apraxia of speech, dysarthria), grammar, repetition, single-word comprehension and
      # connected-speech analysis, which classify primary progressive aphasia into its variants
      # (Gorno-Tempini 2011). Requested by the October 2026 review of early Alzheimer's disease
      # (ALZ-EARLY-P02, logopenic PPA). Not a second `neuropsych_battery`: the battery screens
      # language as one cognitive domain and does not assess motor speech. CPT 92523.
      speech_language_evaluation: 175
    genetic_panels:
      ALS: 1840
      FTD: 1840
      HD: 552
      CADASIL: 1104
      CAA: 1380
      early_onset_AD: 2300
      hereditary_ataxia: 2300
      CMT: 1656
      HSP: 1840
      mitochondrial: 2760
      MS_genetic_risk: 736
      wilson: 1104              # ATP7B
      porphyria: 1656           # HMBS, ALAS1, CPOX, PPOX
      small_fiber_neuropathy: 1380  # SCN9A, SCN10A, SCN11A
      PD: 1840                  # PRKN, PINK1, DJ-1, LRRK2, GBA, SNCA
      # SDHA/B/C/D, SDHAF2, VHL, RET, NF1, TMEM127, MAX, FH. Requested by the October 2026 case
      # review (GLIO-HG-RS01: a jugular foramen paraganglioma in a patient with a paraganglioma,
      # a phaeochromocytoma and two affected relatives had no germline test to order).
      hereditary_paraganglioma: 1380
      # CACNA1A, ATP1A2, SCN1A and PRRT2, the familial and sporadic hemiplegic migraine genes
      # (ICHD-3 1.2.3.1). Requested by the October 2026 review of migraine with aura (MIG-AURA
      # M03, RM11, RS11, P09), where the test could only be written as a referral. CPT 81479
      # (unlisted) for a four-gene panel; reference estimate, priced as the CADASIL panel.
      hemiplegic_migraine: 1104

  # --- Tools added after the July 2026 clinical tool review -------------------------------
  # The reviewers' structural finding: the action space could only image the brain and could
  # not obtain a specimen, so several conditions had a mandatory step with no callable act.
  # Rates are EUR reference estimates in the same band as the studies already listed above
  # (technical + professional component), pending coding sign-off — same caveat as the rest
  # of this file, not fee-schedule lookups.
  # One discriminator + one `by_type` block each, exactly like order_advanced_imaging, so
  # vocabulary.by_type_values, CostTracker._cost_by_type and the metric layer's scalar
  # discriminator all apply unchanged. Region and modality are fused into one `study` term
  # rather than split across two parameters, because a CT and an MRI of the same region are
  # different studies at different prices, and one term keeps them individually priceable.
  order_body_imaging:
    by_type:
      pelvis_abdomen_CT: 368
      pelvis_abdomen_MRI: 552
      pelvis_abdomen_ultrasound: 184
      testicular_ultrasound: 184
      # Thorax. The review asked for "cardiac or thoracic CT angiography when aortic
      # dissection, pulmonary embolism or a cardiac mass has to be confirmed or excluded
      # rapidly", and SYNC-CARD-RM04 was asking for a CT pulmonary angiogram through
      # order_ct_scan — the head tool, which has no region parameter. Its discriminators
      # (contrast, angiography) were therefore identical to a head-and-neck CTA, so imaging
      # the brain of a patient with a pulmonary embolism scored the required action. Thoracic
      # imaging belongs here, with the other regions, under the same <region>_<modality> term.
      chest_CT: 276
      chest_CTA: 368
      # One acquisition, one report, one charge — the staging / occult-primary study, and how 57
      # cases (anti-NMDAR teratoma search, glioma staging) actually order it. They were ordering
      # it through order_ct_scan with a `region: chest_abdomen_pelvis` annotation the head-CT
      # schema does not have and silently drops.
      chest_abdomen_pelvis_CT: 460
      mediastinum_CT: 322
      mediastinum_MRI: 506
      spine_MRI: 552
      spine_CT: 322
      peripheral_nerve_MRI: 460
      peripheral_nerve_ultrasound: 184
      # Moved from the general_medicine pack on 2026-10-23: the October 2026 case review
      # (ISCH-STR-P05) asked for the venous source of a paradoxical embolism to be imaged, and
      # the case could only gesture at it from the D-dimer. CPT 93970, bilateral.
      lower_extremity_venous_duplex: 170
      # Moved from the general_medicine pack on 2026-10-24: the October 2026 review of hepatic
      # encephalopathy (HEP-ENC M04, M08, S02, S06) needed a chest radiograph in the infection
      # screen. CPT 71046, two views.
      chest_xray: 28
      # Temporal artery ultrasound (halo sign) for giant cell arteritis, requested by the October
      # 2026 review (BACT-MEN-RS03) so that a GCA question can be ordered and scored. Billed as a
      # bilateral extracranial arterial duplex, CPT 93880.
      temporal_artery_ultrasound: 184
    modifiers:
      contrast: 116

  order_microbiology:
    by_type:
      blood_culture: 37
      # EDTA whole-blood PCR: N. meningitidis (the blood meningococcal PCR of NICE NG240,
      # which keeps the organism test available while lumbar puncture is deferred), with
      # S. pneumoniae and H. influenzae. CPT 87798 per target; priced as the CSF single-target
      # PCRs (HSV_PCR). Confirmed as the term for blood meningococcal PCR on 2026-10-24
      # (BACT-MEN-S05): a second spelling would price one study twice.
      whole_blood_pcr: 184
      throat_swab: 28
      urine: 28
      # Diagnostic paracentesis: the procedure plus its fluid studies (PMN count, protein,
      # culture into blood-culture bottles at the bedside), per EASL 2022.
      ascitic_fluid: 276
      # Moved from the general_medicine pack on 2026-10-24, rates unchanged. The October 2026
      # review asked for them in the core vocabulary: a culture of the ulcer that was the portal
      # of entry (BACT-MEN-RS01), sputum in the tuberculous meningitis mimic (BACT-MEN-P02), and
      # C. difficile testing in the infection screen of hepatic encephalopathy (HEP-ENC).
      sputum: 18                    # CPT 87070 culture + 87205 Gram stain
      stool: 46                     # CPT 87493 C. difficile toxin PCR
      wound_swab: 12                # CPT 87070
      # Gram stain and aerobic and anaerobic culture of material aspirated from a brain lesion
      # (October 2026 review, GLIO-HG-P04: an abscess on the differential of a ring-enhancing
      # mass). The laboratory work only: the aspiration is ordered and billed through
      # obtain_tissue_diagnosis (stereotactic_biopsy, resection), so one procedure is priced
      # once. CPT 87205 + 87070 + 87075.
      brain_aspirate: 30

  obtain_tissue_diagnosis:
    # Two-part, like analyze_csf: the procedure, then the assays run on the specimen.
    # Resection is priced as the diagnostic act only — it is also therapeutic, which the
    # benchmark does not bill for.
    by_type:
      stereotactic_biopsy: 2760
      resection: 9200
      # Extracardiac / extracranial nodal sampling — EBUS-transbronchial needle aspiration or
      # surgical node biopsy. Added for the same reason the tool exists at all: SYNC-CARD-RP05
      # (cardiac sarcoidosis) carried "arrange tissue diagnosis (bronchoscopy with lymph node
      # biopsy)" as a `tool_name: null` referral, which is precisely the pattern the review
      # objected to in glioma — a mandatory step with no callable act. Histology here is a
      # pattern (non-necrotising granulomas), so no molecular assay is implied.
      lymph_node_biopsy: 1840
      # Temporal artery biopsy for giant cell arteritis (October 2026 review, BACT-MEN-RS03).
      # CPT 37609 + 88305 histology.
      temporal_artery_biopsy: 644
      # Open surgical biopsy, through a laminectomy and myelotomy or a craniotomy, of a lesion a
      # stereotactic needle cannot reach safely and that is not to be resected (October 2026
      # review, GLIO-HG-RM02: a cervical intramedullary tumour modelled as `resection`). CPT 63285
      # (intramedullary, cervical) or 61140 (craniotomy for biopsy) + 88307 histology; reference
      # estimate between the stereotactic biopsy and the resection.
      open_biopsy: 5520
    by_molecular_assay:
      IDH1_IHC: 138
      IDH1_IDH2_sequencing: 552
      ATRX_IHC: 138
      1p_19q_codeletion: 460
      CDKN2A_B_deletion: 460
      TERT_promoter: 368
      EGFR_amplification: 368
      chr7_gain_chr10_loss: 460
      H3K27_status: 276
      MGMT_methylation: 460
      BRAF_V600: 276
      # Requested by the October 2026 case review of high-grade glioma: the lymphoma and
      # metastatic-melanoma mimics were scored on a tissue action that could only order glioma
      # markers (GLIO-HG-P02, an EBV-associated DLBCL diagnosed from IDH1 IHC alone; GLIO-HG-RP04,
      # a must requiring SOX10 that no action could request). CPT 88342 / 88341 per antibody,
      # 88365 for in situ hybridisation.
      CD20_IHC: 92
      EBER_ISH: 184
      SOX10_IHC: 92
      Melan_A_HMB45_IHC: 138    # two antibodies, one melanocytic panel
      # Requested by the October 2026 case review of high-grade glioma. Neuroendocrine markers of
      # a paraganglioma (GLIO-HG-RS01, a jugular foramen mass): two antibodies, one panel, as for
      # the melanocytic one. CPT 88342 + 88341.
      chromogranin_A_synaptophysin_IHC: 138
      # The metastasis work-up of a brain lesion (GLIO-HG-RP01): PAX8 (renal, thyroid, Mullerian),
      # TTF-1 (lung, thyroid) and thyroglobulin (thyroid). Three terms, because each answers a
      # different primary. CPT 88342 / 88341 per antibody.
      PAX8_IHC: 92
      TTF1_IHC: 92
      thyroglobulin_IHC: 92
      # H3 G34R/V, the defining alteration of the diffuse hemispheric glioma, H3 G34-mutant (WHO
      # CNS5; GLIO-HG RS01, RS03). Immunohistochemistry or sequencing; priced as H3K27_status.
      H3G34_status: 276
      # Genome-wide DNA methylation profiling (EPIC array with the brain-tumour classifier), for
      # a tumour whose class histology and the targeted assays leave open (WHO CNS5 essential or
      # desirable criterion in several entities; GLIO-HG RM02, RM03). No CMS rate (CPT 81479,
      # unlisted); reference estimate in the band of the gene panels.
      DNA_methylation_profiling: 1840
    # Rate for an assay with no row above (warned at execute time and here).

  perform_clinical_assessment:
    # The reviewers named these as required steps with no callable act behind them. Kept
    # deliberately small and non-overlapping: a full battery is already
    # order_specialized_test{neuropsych_battery}, bedside spirometry is already
    # {respiratory_function}, and formal autonomic testing is already {autonomic_testing}.
    # Duplicating a study under a second tool would let either satisfy the ground truth.
    by_type:
      cognitive_screen: 92                 # MoCA / MMSE at the bedside, not a full battery
      structured_headache_history_ichd3: 138
      gait_and_balance_timed: 92           # TUG / timed walk; the NPH tap test is two of these
      functional_neuro_signs: 138          # Hoover, entrainment — the positive signs of FND
      # Karnofsky / ECOG scored at the visit. Treatment planning in high-grade glioma turns on it
      # (EANO 2021: KPS < 70 is the unfavourable threshold), and the October 2026 review found
      # it only as a pre-illness line in the social history (GLIO-HG-RP04).
      performance_status: 46

  search_medical_literature:
    base: 0

  check_drug_interactions:
    base: 0

# --- Vocabulary packs ---------------------------------------------------------------------------
# Rows a case sees only through its domain (`NeuroBenchCase.domain`, `tools/vocabulary.py::
# DOMAIN_PACKS`). A pack adds terms to the blocks above and never re-prices one
# (`vocabulary.merge_packs` refuses a clash), so the NeuroBench catalogue, its prices and its
# 600 cases are untouched by anything below. The cost registry prices every pack.
packs:
  # Studies general medicine orders and neurology never needed, so that a recorded admission
  # (MIMIC-IV) or a general-medicine case can be ordered, priced and scored step by step.
  # PROVISIONAL rates: EUR from 2024 Medicare national amounts at 0.92, read from memory of
  # the fee schedule rather than looked up, pending the same coding sign-off as the rest of this
  # file. Check them against the CMS PFS / CLFS look-up before any cost result is reported.
  general_medicine:
    tools:
      interpret_labs:
        by_panel:
          lipase: 8                  # CPT 83690
          amylase: 8                 # CPT 82150
          hepatitis_panel_acute: 60  # CPT 80074: HAV IgM, HBsAg, anti-HBc IgM, anti-HCV
          uric_acid: 6               # CPT 84550
          cortisol: 20               # CPT 82533
          CEA: 23                    # CPT 82378
          CA_19_9: 25                # CPT 86301
          CA_125: 25                 # CPT 86304
          PSA: 23                    # CPT 84153
          fecal_occult_blood: 18     # CPT 82274, immunochemical
      order_body_imaging:
        by_type:
          abdomen_xray: 32                   # CPT 74019, two views (obstruction, free air)
          extremity_xray: 30                 # CPT 73030 / 73560 / 73610, two to three views
          hepatobiliary_ultrasound: 87       # CPT 76705, limited abdomen (right upper quadrant)
          renal_ultrasound: 106              # CPT 76770
          neck_ultrasound: 101               # CPT 76536, thyroid and cervical soft tissue
      order_microbiology:
        by_type:
          synovial_fluid: 92            # CPT 20610 arthrocentesis + cell count, crystals, culture
          pleural_fluid: 193            # CPT 32555 image-guided thoracentesis + fluid studies
          nasopharyngeal_swab: 129      # CPT 87636 / 87631 respiratory pathogen PCR
          bronchoalveolar_lavage: 368   # CPT 31624 bronchoscopy with lavage + culture, cytology
      order_specialized_test:
        by_type:
          upper_endoscopy: 322          # CPT 43235 / 43239, professional + facility estimate
          colonoscopy: 368              # CPT 45378 / 45380
          pulmonary_function_tests: 138 # CPT 94010 + 94726 + 94729: spirometry, volumes, DLCO
          ABPM: 55                      # CPT 93784, 24-hour ambulatory blood pressure
          DXA: 37                       # CPT 77080
      obtain_tissue_diagnosis:
        by_type:
          image_guided_core_biopsy: 644 # CPT 10005-10012 / 20206 / 47000 + 88305
          endoscopic_biopsy: 64         # CPT 88305 histology only; the endoscopy bills itself
          skin_biopsy: 156              # CPT 11102 + 88305
          bone_marrow_biopsy: 276       # CPT 38222 + 88305
      order_advanced_imaging:
        by_type:
          VQ_scan: 230                  # CPT 78582
          HIDA_scan: 258                # CPT 78226
