      # cost reward is accurate rather than everything collapsing to default_panel. Aliases of a
      # panel already above carry its price. See docs/benchmark/tool-contract.md.
      # Routine chemistry singles
      glucose: 5
      sodium: 7
      calcium: 7
      creatinine: 7
      bilirubin: 7
      magnesium: 9
      LDH: 9
      CK: 14
      aldolase: 18
      ammonia: 18
      haptoglobin: 14
      iron_studies: 23
      "peripheral smear": 9
      smear: 9
      eosinophil_count: 9
      "beta-hCG": 14
      procalcitonin: 28
      D_dimer: 14
      "D-dimer": 14
      ACE: 28
      # Aliases of panels already priced above
      LFTs: 23
      UA: 9
      lipids: 18
      lipid_panel: 18
      "lipid panel": 18
      syphilis: 14
      toxicology: 28
      tox_screen: 28
      valproate_level: 28
      "blood cultures x3": 37
      ESR_CRP: 23
      serum_copper: 18
      # Vitamins / metabolic
      vitamin_D: 40
      MMA: 28
      homocysteine: 28
      thiamine_B1: 37
      niacin_B3: 40
      zinc: 18
      "24h_urinary_copper": 28
      # Myeloma / paraprotein workup
      SPEP: 28
      IFE: 28
      serum_free_light_chains: 60
      beta2_microglobulin: 18
      quantitative_Ig: 28
      IgA: 18
      IgE: 18
      IgG_subclasses: 28
      plasma_progranulin: 100
      # Autoimmune / rheumatologic
      ANA: 18
      anti_dsDNA: 23
      "anti-dsDNA": 23
      ANCA: 28
      RF: 14
      anti_CCP: 28
      complement: 14
      C3: 9
      C4: 9
      "complement C3/C4": 18
      cryoglobulins: 37
      anti_SSA: 23
      anti_SSB: 23
      anti_Jo1: 28
      myositis_panel: 200
      "vasculitis screen": 100
      inflammatory: 28
      # Thrombophilia / coagulation
      protein_C: 37
      "protein C": 37
      protein_S: 37
      "protein S": 37
      "antithrombin III": 37
      "factor V Leiden": 200
      "prothrombin G20210A": 200
      lupus_anticoagulant: 37
      "lupus anticoagulant": 37
      antiphospholipid: 60
      anti_cardiolipin: 23
      "anticardiolipin IgG": 23
      "anticardiolipin IgM": 23
      anti_b2GP1: 23
      "anti-beta-2-glycoprotein-I IgG": 23
      "anti-beta-2-glycoprotein-I IgM": 23
      type_and_screen: 23
      ADAMTS13: 200
      ADAMTS13_activity: 200
      ADAMTS13_inhibitor: 200
      # Neuromuscular / paraneoplastic autoantibodies (send-out)
      anti_AChR: 100
      clustered_AChR_cell_based: 150
      anti_MuSK: 150
      anti_LRP4: 150
      AQP4_IgG: 230
      MOG_IgG: 230
      "anti-GM1 IgM": 100
      anti_MAG: 200
      anti_NF155: 300
      anti_CNTN1: 300
      anti_VGCC_PQ: 200
      anti_VGCC_N: 200
      anti_SOX1: 200
      VEGF: 60
      paraneoplastic_panel: 2300
      paraneoplastic_antibodies: 2300
