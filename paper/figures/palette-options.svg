<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <!-- Option 1: CERN palette from October -->
  <text x="40" y="50" font-size="26" font-weight="bold" fill="#222">1 · CERN (figura di ottobre)</text>
  <g font-size="18" fill="#333">
    <rect x="40" y="75" width="120" height="60" rx="10" fill="#0033A0"/><text x="40" y="160">Modello A</text><text x="40" y="182" fill="#888">#0033A0</text>
    <rect x="180" y="75" width="120" height="60" rx="10" fill="#6E2466"/><text x="180" y="160">Modello B</text><text x="180" y="182" fill="#888">#6E2466</text>
    <rect x="320" y="75" width="120" height="60" rx="10" fill="#BEBECB"/><text x="320" y="160">Base</text><text x="320" y="182" fill="#888">#BEBECB</text>
    <rect x="460" y="75" width="120" height="60" rx="10" fill="#1C446A"/><text x="460" y="160">Medici</text><text x="460" y="182" fill="#888">#1C446A</text>
    <rect x="600" y="75" width="120" height="60" rx="10" fill="#61C4D3"/><text x="600" y="160">Corretto ✓</text><text x="600" y="182" fill="#888">#61C4D3</text>
    <rect x="740" y="75" width="120" height="60" rx="10" fill="#E15E32"/><text x="740" y="160">Errore ✗</text><text x="740" y="182" fill="#888">#E15E32</text>
  </g>
  <!-- sample bars -->
  <g>
    <text x="900" y="95" font-size="18" fill="#333">esempio</text>
    <rect x="900" y="110" width="200" height="18" fill="#BEBECB"/>
    <rect x="900" y="134" width="150" height="18" fill="#6E2466"/>
    <rect x="900" y="158" width="250" height="18" fill="#0033A0"/>
  </g>
  <text x="40" y="225" font-size="17" fill="#777">Coerente col materiale CERN. Medici (navy) e modello A (blu) si confondono; ciano poco leggibile sul bianco.</text>

  <line x1="40" y1="260" x2="1160" y2="260" stroke="#ddd"/>

  <!-- Option 2: Okabe-Ito -->
  <text x="40" y="310" font-size="26" font-weight="bold" fill="#222">2 · Okabe-Ito (sicura per daltonici, la più usata in Nature)</text>
  <g font-size="18" fill="#333">
    <rect x="40" y="335" width="120" height="60" rx="10" fill="#0072B2"/><text x="40" y="420">Modello A</text><text x="40" y="442" fill="#888">#0072B2</text>
    <rect x="180" y="335" width="120" height="60" rx="10" fill="#E69F00"/><text x="180" y="420">Modello B</text><text x="180" y="442" fill="#888">#E69F00</text>
    <rect x="320" y="335" width="120" height="60" rx="10" fill="#999999"/><text x="320" y="420">Base</text><text x="320" y="442" fill="#888">#999999</text>
    <rect x="460" y="335" width="120" height="60" rx="10" fill="#CC79A7"/><text x="460" y="420">Medici</text><text x="460" y="442" fill="#888">#CC79A7</text>
    <rect x="600" y="335" width="120" height="60" rx="10" fill="#009E73"/><text x="600" y="420">Corretto ✓</text><text x="600" y="442" fill="#888">#009E73</text>
    <rect x="740" y="335" width="120" height="60" rx="10" fill="#D55E00"/><text x="740" y="420">Errore ✗</text><text x="740" y="442" fill="#888">#D55E00</text>
  </g>
  <g>
    <text x="900" y="355" font-size="18" fill="#333">esempio</text>
    <rect x="900" y="370" width="200" height="18" fill="#999999"/>
    <rect x="900" y="394" width="150" height="18" fill="#E69F00"/>
    <rect x="900" y="418" width="250" height="18" fill="#0072B2"/>
  </g>
  <text x="40" y="485" font-size="17" fill="#777">Tutti i colori restano distinti anche per chi non distingue rosso e verde. A (blu) e B (arancio) a colpo d'occhio opposti.</text>
  <text x="40" y="530" font-size="15" fill="#aaa">Fonte: Wong B., "Points of view: Color blindness", Nature Methods 8, 441 (2011).</text>
</svg>
