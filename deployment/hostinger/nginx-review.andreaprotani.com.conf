# review.andreaprotani.com — NeuroBench dataset review platform.
#
# Drop this in /etc/nginx/conf.d/review.andreaprotani.com.conf, then:
#   nginx -t && systemctl reload nginx
# After certbot rewrites this file for HTTPS, the listen 80 block becomes a
# 301 to https:// and a listen 443 ssl block is added by certbot.

server {
    listen 80;
    server_name review.andreaprotani.com;

    # HSTS — once certbot rewrites this server block to also `listen 443 ssl`,
    # this header is sent on every HTTPS response and instructs browsers to
    # refuse plain-HTTP requests to the host for the next year. `always`
    # ensures it's set even on error responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static frontend bundle (Vite output). Hashed assets are immutable.
    root /home/neuroreview/medical-agents/web-review/dist;
    index index.html;

    location /assets/ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # FastAPI backend on 127.0.0.1:8889 (uvicorn under systemd, runs as neuroreview).
    location /api/ {
        proxy_pass http://127.0.0.1:8889/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback — any unmatched URL serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
