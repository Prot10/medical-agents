# NeuroBench Condition Specifications — Expanded Set (20 conditions)
# Each condition defines clinical parameters, expected findings per modality,
# and difficulty variants for case generation.

focal_epilepsy_temporal:
  name: "Focal epilepsy — temporal lobe"
  abbreviation: "FEPI-TEMP"
  icd_code: "G40.209"
  description: "Focal seizures originating from the temporal lobe, often with mesial temporal sclerosis or low-grade tumors"
  typical_demographics:
    age_range: [18, 60]
    sex_bias: null
  encounter_type: "inpatient"
  # October 2026 round (criteria_packs/FEPI-TEMP.md is the authority): the first MRI is the
  # dedicated epilepsy-protocol study (gadolinium only when a lesion, infection or tumor is
  # suspected); staged EEG (routine, then sleep-deprived or ambulatory when non-diagnostic; video
  # only for event capture, PNES, seizure versus syncope or presurgical work-up; continuous ICU only
  # for NCSE); labs, ECG, drug check and literature optional unless the case names the indication;
  # FDG-PET and neuropsychology only in presurgical or lesional cases; no prolactin unless drawn 10
  # to 20 minutes after the event; echo and rhythm monitoring are waste.
  required_modalities: [EEG, MRI]
  optional_modalities: [LABS, ECG, CT, CSF, advanced_imaging, specialized_test, body_imaging]
  key_findings:
    eeg:
      straightforward:
        - "Right or left anterior temporal sharp waves and spikes (F7/T3 or F8/T4)"
        - "Intermittent temporal rhythmic delta activity (TIRDA)"
        - "Background otherwise normal with symmetric 9-10 Hz posterior dominant rhythm"
      moderate:
        - "Rare temporal sharp transients, morphology not clearly epileptiform"
        - "Subtle intermittent temporal slowing, laterality uncertain"
        - "Background mildly disorganized"
      diagnostic_puzzle:
        - "Normal awake EEG"
        - "Non-specific mild diffuse slowing only"
        - "Possible wicket spikes (benign variant mimicking pathology)"
    mri:
      straightforward:
        - "Hippocampal sclerosis with volume loss and T2/FLAIR hyperintensity"
        - "OR: Low-grade tumor (DNET or ganglioglioma) in mesial temporal structures"
      moderate:
        - "Mild but definite hippocampal sclerosis on the epilepsy-protocol MRI (volume loss with T2/FLAIR signal) that an outside standard MRI missed"
        - "Subtle temporal gray-white blurring suspicious for focal cortical dysplasia on 3T epilepsy-protocol MRI"
      diagnostic_puzzle:
        - "Normal epilepsy-protocol MRI (MRI-negative focal epilepsy)"
        - "Incidental non-specific white matter lesions (red herring)"
    labs:
      selected_cases_only:
        - "Glucose, sodium and calcium when an acute symptomatic seizure or mimic is plausible"
        - "Antiseizure medication level and organ function only when treatment exposure makes them relevant"
        - "Case-specific emergency studies, such as D-dimer/troponin/BNP in the concurrent pulmonary embolism case"
        - "Prolactin only when drawn 10 to 20 minutes after the event; it argues against PNES and does not separate seizure from syncope"
  differential_diagnoses:
    - diagnosis: "Psychogenic non-epileptic seizures (PNES)"
      key_distinguishing: "No EEG correlate, atypical semiology, eyes closed during event"
    - diagnosis: "Syncope (vasovagal or cardiac)"
      key_distinguishing: "Prodrome of lightheadedness, no post-ictal confusion, brief myoclonus possible"
    - diagnosis: "Migraine with aura"
      key_distinguishing: "Visual/sensory symptoms spread slowly (>5 min), followed by headache"
    - diagnosis: "Transient ischemic attack"
      key_distinguishing: "Negative symptoms (weakness, numbness), older patient, vascular risk factors"
    - diagnosis: "Acute symptomatic seizures (encephalitis, metabolic, toxic)"
      key_distinguishing: "Seizures during an acute brain insult are not epilepsy (ILAE 2010); fever, encephalopathy, CSF or metabolic abnormality"
    - diagnosis: "LGI1 antibody encephalitis"
      key_distinguishing: "Faciobrachial dystonic seizures, memory decline, hyponatremia; serum LGI1 antibodies"
  difficulty_variants:
    straightforward:
      presentation: "Classic temporal aura (deja vu, epigastric rising) followed by a witnessed focal to bilateral tonic-clonic seizure. Imaging and EEG results belong in the tool outputs, not in the presentation."
      expected_agent_confidence: 0.85
    moderate:
      presentation: "Recurrent episodes of altered awareness with automatisms, no clear aura recalled. The structural finding is subtle and appears only in the ordered MRI report."
      expected_agent_confidence: 0.65
    diagnostic_puzzle:
      presentation: "Episodes previously diagnosed as panic attacks: sudden fear, palpitations, depersonalization. No earlier EEG or MRI result is given in the history when the case scores ordering that study."
      expected_agent_confidence: 0.40
  common_followups:
    - trigger_action: "request_sleep_deprived_eeg"
      tool_name: "analyze_eeg"
      description: "Sleep-deprived EEG when routine EEG is normal or equivocal and uncertainty persists"
    - trigger_action: "request_ambulatory_eeg"
      tool_name: "analyze_eeg"
      description: "Ambulatory EEG after routine and sleep-deprived studies remain non-diagnostic"
    - trigger_action: "request_video_eeg"
      tool_name: "analyze_eeg"
      description: "Prolonged video-EEG only when habitual events must be captured, PNES differentiated, or presurgical localization performed"
    - trigger_action: "request_neuropsych_battery"
      tool_name: "order_specialized_test"
      description: "Neuropsychological battery (test_type neuropsych_battery) for memory and language lateralization, in presurgical drug-resistant or lesional surgical cases only"
    - trigger_action: "request_fdg_pet"
      tool_name: "order_advanced_imaging"
      description: "Interictal FDG-PET (modality FDG_PET) in presurgical evaluation of drug-resistant epilepsy, mainly when MRI is negative or discordant; never in pregnancy"
    - trigger_action: "request_aed_levels"
      tool_name: "interpret_labs"
      description: "Antiseizure medication levels only when adherence, a breakthrough seizure, pregnancy or an interaction is the question"

ischemic_stroke:
  name: "Acute ischemic stroke"
  abbreviation: "ISCH-STR"
  icd_code: "I63.9"
  description: "Acute ischemic cerebrovascular event with focal neurological deficits"
  typical_demographics:
    age_range: [18, 85]
    sex_bias: "slight_male"
  encounter_type: "emergency"
  # Clinical tool review, July 2026: CT optional->REQUIRED (non-contrast CT is the initial
  # emergent study); MRI required->optional (an alternative, never a delay to thrombolysis);
  # advanced_imaging optional for tissue-based selection outside the standard window (AHA/ASA
  # 2026)
  required_modalities: [CT, LABS, ECG]
  optional_modalities: [MRI, EEG, echo, cardiac_monitoring, advanced_imaging]
  key_findings:
    mri:
      straightforward:
        - "Acute diffusion restriction (DWI bright, ADC dark) in left MCA territory"
        - "Corresponding FLAIR hyperintensity (>4.5h onset)"
        - "MRA: left MCA M1 occlusion or severe stenosis"
      moderate:
        - "Small acute DWI lesion in posterior circulation (brainstem/cerebellum)"
        - "No large vessel occlusion on MRA"
        - "Chronic small vessel ischemic changes complicating interpretation"
      diagnostic_puzzle:
        - "DWI negative initially (very early presentation <1h)"
        - "Multiple small scattered DWI lesions suggesting embolic shower"
        - "Finding mimicked by posterior reversible encephalopathy syndrome (PRES)"
    labs:
      all_difficulties:
        - "CBC: normal or mild leukocytosis"
        - "BMP: glucose may be elevated (stress response)"
        - "Coagulation: PT/INR, PTT — normal (rules out coagulopathy)"
        - "Lipid panel: may show hyperlipidemia"
        - "HbA1c: may reveal undiagnosed diabetes"
        - "Troponin: may be mildly elevated (cardiac source)"
    ecg:
      straightforward:
        - "Atrial fibrillation with rapid ventricular response — clear cardioembolic source"
      moderate:
        - "Normal sinus rhythm, but with left atrial enlargement"
      diagnostic_puzzle:
        - "Normal sinus rhythm, no arrhythmia — cryptogenic stroke"
  differential_diagnoses:
    - diagnosis: "Hemorrhagic stroke"
      key_distinguishing: "CT/MRI shows hemorrhage rather than ischemia"
    - diagnosis: "Todd's paralysis (post-ictal)"
      key_distinguishing: "History of seizure preceding weakness, resolves within hours"
    - diagnosis: "Hemiplegic migraine"
      key_distinguishing: "Younger patient, migraine history, symptoms resolve completely"
    - diagnosis: "Hypoglycemia"
      key_distinguishing: "Low glucose, focal deficits resolve with correction"
    - diagnosis: "Brain tumor"
      key_distinguishing: "Subacute onset, no DWI restriction, enhancing mass on MRI"
  difficulty_variants:
    straightforward:
      presentation: "Sudden onset right hemiparesis and aphasia, last known well 2 hours ago. Known atrial fibrillation, not on anticoagulation."
      expected_agent_confidence: 0.90
    moderate:
      presentation: "Wake-up stroke with subtle right-sided neglect and mild dysarthria. No prior AF known. Vascular risk factors present."
      expected_agent_confidence: 0.70
    diagnostic_puzzle:
      presentation: "Young patient (35yo) with acute vertigo, diplopia, and ataxia. No traditional risk factors. Posterior circulation stroke mimicking vestibular neuritis."
      expected_agent_confidence: 0.45
  common_followups:
    - trigger_action: "request_ct_angiography"
      tool_name: "order_ct_scan"
      description: "CTA head and neck for vascular evaluation"
    - trigger_action: "request_ct_perfusion"
      tool_name: "order_advanced_imaging"
      description: "Automated core-penumbra assessment in selected wake-up or extended-window stroke"
    - trigger_action: "request_echocardiogram"
      tool_name: "order_echocardiogram"
      description: "Transthoracic or transesophageal echocardiogram"
    - trigger_action: "request_holter_monitor"
      tool_name: "order_cardiac_monitoring"
      description: "Inpatient telemetry or 24-48 h Holter on the stroke unit, after vessel imaging, for paroxysmal AF (monitor type matches its duration)"
    # October 2026 review (plan C9): no default thrombophilia panel. It produced orphan follow-ups
    # and contradictory results in 19 of 30 cases. Write an aetiological panel (antiphospholipid
    # antibodies, Factor V Leiden, ADAMTS13, ...) only when the case itself indicates it (young
    # cryptogenic stroke, PFO with venous thrombosis, prior thrombosis or pregnancy loss, pregnancy,
    # prior TTP) and only together with the action criterion that orders it.

autoimmune_encephalitis_nmdar:
  name: "Anti-NMDA receptor encephalitis"
  abbreviation: "NMDAR-ENC"
  icd_code: "G04.81"
  description: "Autoimmune encephalitis mediated by antibodies against the NMDA receptor, often associated with ovarian teratoma in young women"
  typical_demographics:
    age_range: [18, 40]
    sex_bias: "female_predominant"
  encounter_type: "emergency"
  # Clinical tool review, July 2026: occult-tumour screening is REQUIRED but tailored rather
  # than blanket whole-body CT — pelvic/abdominal imaging in women >=12 years, selected
  # testicular imaging in younger men, and broader chest/body imaging only when context supports
  # it. Routine EEG is the baseline; continuous ICU monitoring is a selected escalation.
  # October 2026 review round (criteria_packs/NMDAR-ENC.md): tumour screen by age and sex (women
  # 12-44 pelvic ultrasound, men under 45 scrotal ultrasound, anyone 45 or older contrast CAP CT);
  # the CSF report carries the final CSF anti-GluN1 titre (never "pending") and the labs report only
  # the serum assay; every case stores a cEEG follow-up consistent with its routine EEG; probable
  # criteria need an abnormal EEG or CSF pleocytosis/OCB, never the MRI.
  required_modalities: [EEG, MRI, LABS, CSF, body_imaging]
  optional_modalities: [ECG]
  key_findings:
    eeg:
      straightforward:
        - "Extreme delta brush (EDB) pattern — relatively characteristic, not pathognomonic"
        - "Generalized rhythmic delta activity with superimposed beta"
        - "Electrographic seizures, often subclinical"
      moderate:
        - "Generalized slowing with intermittent rhythmic delta"
        - "Possible electrographic seizures but no extreme delta brush"
        - "Disorganized background without clear epileptiform discharges"
      diagnostic_puzzle:
        - "Mild diffuse slowing only"
        - "Normal EEG early in course"
        - "Frontal intermittent rhythmic delta activity (FIRDA) — non-specific"
    mri:
      straightforward:
        - "FLAIR hyperintensity in bilateral medial temporal lobes"
        - "Possible cortical/subcortical signal abnormality"
      moderate:
        - "Subtle unilateral temporal FLAIR signal, could be artifact"
        - "No enhancement, no mass effect"
      diagnostic_puzzle:
        - "Normal MRI (normal or non-specific in about two thirds of anti-NMDAR encephalitis)"
        - "Non-specific white matter changes only"
    labs:
      all_difficulties:
        - "CBC: normal or mild lymphocytosis"
        - "BMP: may show SIADH (hyponatremia)"
        - "Inflammatory markers: CRP mildly elevated or normal"
        - "Thyroid function: usually normal; a raised anti-TPO is non-specific and does not establish Hashimoto encephalopathy"
    csf:
      straightforward:
        - "Lymphocytic pleocytosis (WBC 20-100, >90% lymphocytes)"
        - "Elevated protein (50-100 mg/dL)"
        - "Normal glucose"
        - "Positive anti-NMDAR antibodies (gold standard)"
        - "Oligoclonal bands present"
      moderate:
        - "Mild pleocytosis (WBC 5-20)"
        - "Protein borderline elevated"
        - "Positive anti-NMDAR (GluN1) IgG on cell-based assay, final titre reported"
      diagnostic_puzzle:
        - "Near-normal CSF initially (WBC <5, normal protein, OCB absent or equivocal)"
        - "Positive anti-NMDAR (GluN1) IgG on cell-based assay at low titre, final titre reported; serum may be negative"
        - "Normal glucose (CSF/serum ratio above 0.5)"
  differential_diagnoses:
    - diagnosis: "Viral encephalitis (HSV)"
      key_distinguishing: "Temporal lobe predilection, fever, CSF HSV PCR positive, more acute"
    - diagnosis: "Primary psychiatric disorder (first-break psychosis)"
      key_distinguishing: "No seizures, no movement disorder, no autonomic instability, normal EEG"
    - diagnosis: "Neuroleptic malignant syndrome"
      key_distinguishing: "Exposure to antipsychotics, rigidity, very high CK, high fever"
    - diagnosis: "CNS vasculitis"
      key_distinguishing: "Vessel irregularities on angiography, multifocal strokes"
    - diagnosis: "Hashimoto encephalopathy (SREAT)"
      key_distinguishing: "Anti-TPO antibodies with no well-characterised neuronal antibody; a diagnosis of exclusion"
    - diagnosis: "Other neuronal-surface antibody encephalitis (LGI1, CASPR2, GABA-B, AMPA)"
      key_distinguishing: "Its own antibody in serum or CSF; LGI1 with faciobrachial dystonic seizures and hyponatraemia"
  difficulty_variants:
    straightforward:
      presentation: "24-year-old woman with subacute personality change, new-onset seizures, orofacial dyskinesias, and autonomic instability over 2 weeks. Viral prodrome."
      expected_agent_confidence: 0.80
    moderate:
      presentation: "28-year-old woman with progressive confusion, insomnia, and one witnessed seizure over 3 weeks. Initially treated as psychiatric."
      expected_agent_confidence: 0.55
    diagnostic_puzzle:
      presentation: "22-year-old woman brought by family for 'bizarre behavior' — paranoia, social withdrawal, insomnia for 1 week. No seizures yet. Appears psychiatric."
      expected_agent_confidence: 0.30
  common_followups:
    - trigger_action: "request_continuous_eeg"
      tool_name: "analyze_eeg"
      description: "Continuous EEG (eeg_type continuous_icu), consistent with the routine EEG: same lateralisation and patterns"
    - trigger_action: "request_pelvic_ultrasound"
      tool_name: "order_body_imaging"
      description: "Pelvic and abdominal ultrasound to screen for ovarian teratoma"
    - trigger_action: "request_testicular_ultrasound"
      tool_name: "order_body_imaging"
      description: "Targeted germ-cell tumour screening in a selected younger male"
    - trigger_action: "request_autoimmune_panel"
      tool_name: "interpret_labs"
      description: "Neuronal-surface antibody panel (LGI1, CASPR2, GABA-B, AMPA); at 45 or older with the onconeural panel"
    - trigger_action: "request_ct_chest_abdomen_pelvis"
      tool_name: "order_body_imaging"
      description: "Contrast CT chest, abdomen and pelvis for a carcinoma search at age 45 or older (replaces the pelvic or scrotal ultrasound)"
    - trigger_action: "request_pelvic_mri"
      tool_name: "order_body_imaging"
      description: "Pelvic MRI to characterise an equivocal adnexal lesion on ultrasound (fat-suppressed sequences)"

alzheimers_early:
  name: "Alzheimer's disease"
  abbreviation: "ALZ-EARLY"
  icd_code: "G30.9"
  description: "Neurodegenerative dementia presenting with progressive episodic memory loss, typically in older adults"
  typical_demographics:
    age_range: [60, 85]
    sex_bias: "slight_female"
  encounter_type: "outpatient"
  # Clinical tool review, July 2026: structured cognitive assessment added as REQUIRED and
  # sequenced first; CT optional where MRI is contraindicated; advanced_imaging optional for
  # FDG-PET/perfusion SPECT and amyloid PET; specialized_test optional for genetics in young
  # onset. ECG removed. EEG is not routine and survives only for explicit non-AD questions:
  # CJD in RP04 and recurrent unresponsive spells in RP05.
  # October 2026 review round: per-case ICD is G31.84 (MCI), G30.0 (onset under 65) or G30.1;
  # presentations carry no test scores (the cognitive screen is a scored step); staging follows the
  # functional rule of criteria_packs/ALZ-EARLY.md; no literature, consult or MCI drug-check steps.
  required_modalities: [clinical_assessment, MRI, LABS]
  optional_modalities: [CSF, advanced_imaging, CT, specialized_test, EEG]
  key_findings:
    mri:
      straightforward:
        - "Bilateral hippocampal atrophy (Scheltens grade 2-3)"
        - "Medial temporal lobe volume loss on coronal images"
        - "Mild diffuse cortical atrophy, temporoparietal predominant"
        - "No acute infarcts, no mass lesions"
      moderate:
        - "Mild hippocampal atrophy (Scheltens grade 1-2), could be age-related"
        - "Subtle temporoparietal volume loss"
        - "Some periventricular white matter changes (vascular vs degenerative)"
      diagnostic_puzzle:
        - "Age-appropriate brain volume for stated age"
        - "Prominent white matter disease suggesting vascular contribution"
        - "Posterior-predominant atrophy (atypical AD — posterior cortical atrophy variant)"
    labs:
      all_difficulties:
        - "CBC: normal"
        - "CMP: normal"
        - "Thyroid function (TSH, free T4): normal; a raised TSH with normal free T4 is subclinical and does not explain the decline"
        - "Vitamin B12: normal or low-normal (low-normal prompts methylmalonic acid)"
        - "Folate: normal"
        - "RPR/VDRL: non-reactive (rules out neurosyphilis)"
        - "HIV: negative"
    csf:
      straightforward:
        - "Decreased Aβ42 (< 500 pg/mL) with Aβ40 reported"
        - "Aβ42/40 ratio decreased"
        - "Elevated phospho-tau (> 60 pg/mL)"
        - "Elevated total tau (> 400 pg/mL)"
        - "Routine Alzheimer panel only: no 14-3-3, RT-QuIC, infectious or autoimmune tests unless the progression is rapid"
      moderate:
        - "Borderline Aβ42 levels"
        - "Mildly elevated tau"
      diagnostic_puzzle:
        - "CSF not yet performed"
        - "If done: equivocal biomarkers"
  differential_diagnoses:
    - diagnosis: "Normal aging / subjective cognitive decline"
      key_distinguishing: "Neuropsych testing normal, no functional impairment"
    - diagnosis: "Vascular dementia"
      key_distinguishing: "Stepwise decline, prominent executive dysfunction, vascular risk factors, white matter disease"
    - diagnosis: "Depression (pseudodementia)"
      key_distinguishing: "Rapid onset, prominent mood symptoms, effort-dependent poor performance"
    - diagnosis: "Frontotemporal dementia"
      key_distinguishing: "Personality/behavior changes predominate, relatively preserved memory early"
    - diagnosis: "Lewy body dementia"
      key_distinguishing: "Visual hallucinations, parkinsonism, REM sleep behavior disorder, fluctuations"
  difficulty_variants:
    straightforward:
      presentation: "72-year-old retired teacher with 2-year progressive memory decline. Forgets recent conversations, repeats questions. Her husband has taken over the finances after missed bills."
      expected_agent_confidence: 0.80
    moderate:
      presentation: "68-year-old with memory complaints for 1 year confirmed by his wife. Some word-finding difficulty. Still managing finances and driving with his own reminders and calendar."
      expected_agent_confidence: 0.55
    diagnostic_puzzle:
      presentation: "65-year-old presenting with progressive difficulty reading and navigating (posterior cortical atrophy variant). Memory relatively preserved. No typical AD presentation."
      expected_agent_confidence: 0.35
  common_followups:
    - trigger_action: "request_neuropsych_testing"
      tool_name: "order_specialized_test"
      description: "Comprehensive neuropsychological battery"
    - trigger_action: "request_amyloid_pet"
      tool_name: "order_advanced_imaging"
      description: "Amyloid PET scan (florbetapir/florbetaben): alternative to CSF for amyloid status, one conclusive test is enough"
    - trigger_action: "request_fdg_pet"
      tool_name: "order_advanced_imaging"
      description: "FDG-PET for an atypical variant or an Alzheimer versus FTD or DLB question (author it in every case so the library never answers it)"
    - trigger_action: "request_perfusion_spect"
      tool_name: "order_advanced_imaging"
      description: "Brain perfusion SPECT when FDG-PET is unavailable"
    - trigger_action: "request_csf_biomarkers"
      tool_name: "analyze_csf"
      description: "CSF Aβ42, Aβ40, Aβ42/40 ratio, phospho-tau, total tau: an alternative to amyloid PET for amyloid status, with a concordant counterpart authored"
    - trigger_action: "request_mma_methylmalonic_acid"
      tool_name: "interpret_labs"
      description: "Methylmalonic acid when serum B12 is low-normal"
    - trigger_action: "request_genetic_testing"
      tool_name: "order_specialized_test"
      description: "Optional APP/PSEN1/PSEN2 panel after genetic counselling in young-onset or strongly familial disease; APOE is not a diagnostic test"

syncope_cardiac:
  name: "Cardiac syncope"
  abbreviation: "SYNC-CARD"
  icd_code: "R55"
  description: "Transient loss of consciousness due to cardiac arrhythmia or structural heart disease, often misdiagnosed as seizure"
  typical_demographics:
    age_range: [50, 80]
    sex_bias: "slight_male"
  encounter_type: "emergency"
  # EEG is not part of the cardiac syncope work-up (ESC 2018 Class III): it is waste unless a
  # prior seizure label makes the epilepsy question explicit (optional in 2 of the 30 cases).
  # Clinical tool review, July 2026: cardiac_monitoring optional->REQUIRED (the only test
  # producing symptom-rhythm correlation; ESC 2018 Class I in high-risk patients); LABS
  # required->optional (low yield unless clinically suggested); advanced cardiac imaging added as
  # optional. October 2026 round (plans/SYNC-CARD.md, SYNC-CARD-decisions.md): a lab panel names
  # only the assay that changes management (required in 10 cases); no hard "labs before
  # monitoring" rule (immediate monitoring is Class I); soft ECG before echo and before
  # monitoring; hard TTE before any exercise test; literature optional and last; a drug check is
  # required only for a concrete interaction (QT drugs, AV-nodal blockers, vasodilators in
  # obstructive HCM); tilt is waste once the mechanism is arrhythmic or structural and harm in
  # severe AS, obstructive HCM or RV outflow obstruction; exercise testing is harm in
  # symptomatic severe AS and waste once a pacing indication exists; head CT only on NICE NG232
  # criteria. Treatment, devices and referrals are musts, never tool calls.
  # body_imaging and tissue_diagnosis are optional at panel level because they belong to
  # specific mechanisms, not to the condition: thoracic CT angiography when a pulmonary
  # embolism presents as syncope (SYNC-CARD-RM04, where it was previously requested through the
  # head-CT tool), nodal biopsy when a granulomatous infiltration must be confirmed
  # histologically (SYNC-CARD-RP05, previously a referral with no callable act).
  required_modalities: [ECG, echo, cardiac_monitoring]
  optional_modalities: [LABS, EEG, MRI, advanced_imaging, body_imaging, tissue_diagnosis]
  key_findings:
    ecg:
      straightforward:
        - "Complete heart block (third-degree AV block) with ventricular escape rhythm at 35 bpm"
        - "OR: Prolonged QTc >500ms"
        - "OR: Spontaneous coved type 1 Brugada pattern (V1-V2)"
      moderate:
        - "Second-degree AV block (Mobitz type II)"
        - "OR: Bifascicular block (RBBB + left anterior fascicular block)"
        - "Borderline QTc prolongation (480-500ms)"
      diagnostic_puzzle:
        - "Normal sinus rhythm on initial ECG"
        - "Intermittent PVCs only"
        - "Arrhythmia not captured (paroxysmal)"
    labs:
      # Order on a specific suspicion, not as a routine battery (ESC 2018 section 4.1.1).
      # A natriuretic peptide may support the identification of structural heart disease but
      # does not establish the cause of the syncope, and untargeted thyroid, inflammatory,
      # autoimmune and paraneoplastic panels have no established role here. Author only the
      # panels the case's mechanism calls for, with reference ranges for the patient's sex.
      all_difficulties:
        - "Haemoglobin or haematocrit only when bleeding is suspected"
        - "Potassium and magnesium when an arrhythmia or QT prolongation may be electrolyte driven (low on a diuretic, for example)"
        - "Troponin and BNP only when ischaemia, pulmonary embolism or heart failure is in question"
        - "D-dimer only when the clinical probability of pulmonary embolism is low or intermediate, never at high probability"
    eeg:
      all_difficulties:
        - "Normal EEG — no epileptiform abnormalities (only where a prior seizure label is the question)"
        - "Normal background, normal posterior dominant rhythm"
    mri:
      all_difficulties:
        - "Normal brain MRI (only when focal signs or a central cause make it indicated)"
        - "No acute intracranial pathology"
    body_imaging:
      all_difficulties:
        - "chest_CTA: normal pulmonary arteries, no dissection (when a thoracic cause is excluded)"
        - "OR: intraluminal filling defects with an RV:LV ratio above 1.0 when a pulmonary embolism is the mechanism"
    tissue_diagnosis:
      all_difficulties:
        - "lymph_node_biopsy: non-necrotising granulomas with negative mycobacterial and fungal stains, when a granulomatous infiltration is the substrate"
  differential_diagnoses:
    - diagnosis: "Epileptic seizure"
      key_distinguishing: "Prolonged post-ictal confusion, lateral tongue bite, head turning, prolonged automatisms; brief jerks with rapid recovery favour convulsive syncope; the interictal EEG is usually normal"
    - diagnosis: "Vasovagal syncope"
      key_distinguishing: "Clear trigger (pain, prolonged standing, emotional), prodrome, young patient"
    - diagnosis: "Orthostatic hypotension"
      key_distinguishing: "Sustained fall of 20 mmHg systolic or 10 mmHg diastolic within 3 min of active standing; occurs on standing; antihypertensives or diuretics"
    - diagnosis: "Transient ischemic attack"
      key_distinguishing: "Focal neurological symptoms, no LOC typically, vascular risk factors"
    - diagnosis: "Psychogenic pseudosyncope"
      key_distinguishing: "Eyes closed, prolonged apparent unconsciousness, frequent attacks, psychiatric comorbidity; normal ECG and BP during an attack"
  difficulty_variants:
    # The presentation gives history and examination only: the ECG, monitoring and imaging are
    # scored work-up and their results never appear here.
    straightforward:
      presentation: "70-year-old man found on floor after witnessed syncopal episode without warning. No seizure-like activity. No post-ictal confusion. Pulse 38 and regular."
      expected_agent_confidence: 0.85
    moderate:
      presentation: "62-year-old with recurrent episodes of sudden LOC without warning. Brief convulsive movements witnessed (convulsive syncope). On antihypertensives."
      expected_agent_confidence: 0.60
    diagnostic_puzzle:
      presentation: "55-year-old with two episodes of LOC with 'shaking' — referred as 'new-onset seizures.' Episodes triggered by exertion. Family history of sudden cardiac death."
      expected_agent_confidence: 0.40
  common_followups:
    # Each study under the tool that performs it, with the vocabulary term in its discriminating
    # field. No tilt follow-up: tilt is waste once the mechanism is arrhythmic or structural and
    # harm in severe AS, obstructive HCM and RV outflow obstruction; where a case keeps a tilt
    # or exercise report it is the patient's own (no isoproterenol in ischaemic heart disease,
    # AS or HCM) or "not performed".
    - trigger_action: "request_transthoracic_echocardiogram"
      tool_name: "order_echocardiogram"
      description: "echo_type TTE: LVEF, wall thickness, valves with gradients, LVOT gradient at rest and on Valsalva, RV size and function, PASP, pericardium, masses; no diagnosis sentence, no bubble study"
    - trigger_action: "request_telemetry_holter_monitoring"
      tool_name: "order_cardiac_monitoring"
      description: "monitor_type telemetry (inpatient, high-risk features) with holter_24h/holter_48h accepted; event_monitor_14d/30d for events within 4 weeks; implantable_loop_recorder for infrequent recurrent events. The case fallback is the same recording, consistent with the ECG"
    - trigger_action: "request_exercise_stress_test"
      tool_name: "order_specialized_test"
      description: "test_type exercise_stress_test only for exertional syncope after the TTE has excluded severe AS and obstructive HCM (hard sequence); never in symptomatic severe AS or with a pacing indication already established. An LVOT gradient needs echo_type exercise_echo instead"
    - trigger_action: "request_cardiac_mri"
      tool_name: "order_advanced_imaging"
      description: "modality cardiac_MRI for a suspected cardiomyopathy, myocarditis or infiltration (ARVC, HCM, sarcoid, laminopathy; AV block before 60, ESC 2021 IIa)"

multiple_sclerosis:
  name: "Multiple sclerosis — relapsing-remitting"
  abbreviation: "MS-RR"
  icd_code: "G35.A"
  description: "Autoimmune demyelinating disease of the CNS with relapsing-remitting course, presenting with disseminated neurological symptoms"
  typical_demographics:
    age_range: [20, 45]
    sex_bias: "female_predominant"
  encounter_type: "inpatient"
  # Clinical tool review, July 2026, and the October 2026 round (criteria_packs/MS-RR.md,
  # plans/MS-RR-decisions.md): brain MRI and cervical-thoracic cord MRI (order_body_imaging
  # spine_MRI, never a second analyze_brain_mri) with gadolinium and the mimic labs are required;
  # CSF (OCB or kFLC index) is optional, recommended in puzzles, tumefactive and late-onset cases,
  # and contraindicated with mass effect; OCT and VEP are optional optic-nerve tests; AQP4/MOG by
  # cell-based assay is a separate interpret_labs order (required with a red flag, recommended with
  # optic neuritis or myelitis) whose results are a follow-up, never rows of the initial labs. EEG
  # and ECG have no diagnostic role. The diagnosis follows the 2024 McDonald revision (five regions
  # with the optic nerve; 4-5 regions need no DIT). No future-data or treatment-response follow-up.
  required_modalities: [MRI, body_imaging, LABS]
  optional_modalities: [CSF, specialized_test]
  key_findings:
    mri:
      straightforward:
        - "Multiple periventricular ovoid T2/FLAIR hyperintense lesions perpendicular to the ventricles (Dawson fingers)"
        - "At least one gadolinium-enhancing lesion alongside non-enhancing lesions"
        - "Juxtacortical or cortical and infratentorial lesions"
        - "The report names lesion sites and enhancement only; it never states whether McDonald criteria are met"
      moderate:
        - "A few typical ovoid periventricular lesions among non-specific subcortical foci"
        - "Single enhancing lesion"
        - "Spinal cord not assessed on a brain study: cord findings belong only to the spine MRI report"
      diagnostic_puzzle:
        - "Small subcortical foci that could be migraine-related or vascular, plus at least one typical lesion (ovoid periventricular, infratentorial or with incomplete-ring enhancement) that the agent must recognise"
        - "Tumefactive variant: a large lesion with open-ring enhancement open toward the cortex and less mass effect than its size predicts"
    body_imaging:
      all_difficulties:
        - "spine_MRI: short-segment (under 2 vertebral segments) peripheral or dorsolateral cord lesions, less than half the cross-section, with level, length, position and enhancement stated"
        - "A cervical lesion wherever the patient has a Lhermitte sign"
        - "No longitudinally extensive lesion"
    labs:
      all_difficulties:
        - "CBC: normal"
        - "BMP: normal"
        - "ANA: negative or low-titer positive (nonspecific)"
        - "Vitamin B12: normal"
        - "ESR/CRP: usually normal"
        - "Normal rows carry no clinical_significance text; AQP4-IgG/MOG-IgG are never in the initial labs"
    csf:
      straightforward:
        - "Oligoclonal bands present (>=2 unique to CSF)"
        - "Kappa free-light-chain index above the laboratory's stated cutoff"
        - "Elevated IgG index (>0.7), supportive only"
        - "Mild lymphocytic pleocytosis (5-15 cells)"
        - "Normal glucose, normal or mildly elevated protein"
      moderate:
        - "Oligoclonal bands present but only 2 bands"
        - "IgG index borderline (0.6-0.7)"
        - "Normal cell count"
      diagnostic_puzzle:
        - "No oligoclonal bands and kFLC index below the cutoff (occurs in ~5-10% of MS)"
        - "Normal IgG index"
        - "CSF entirely normal"
  differential_diagnoses:
    - diagnosis: "Neuromyelitis optica spectrum disorder (NMOSD)"
      key_distinguishing: "AQP4 antibodies positive, longitudinally extensive transverse myelitis, optic neuritis predominant"
    - diagnosis: "MOG antibody disease (MOGAD)"
      key_distinguishing: "MOG antibodies positive, optic neuritis with disc edema, better recovery"
    - diagnosis: "CNS vasculitis"
      key_distinguishing: "Angiography abnormal, CSF pleocytosis, enhancing lesions in non-typical MS locations"
    - diagnosis: "Migraine with white matter lesions"
      key_distinguishing: "Lesions subcortical not periventricular, no enhancement, no CSF abnormalities"
    - diagnosis: "Neurosarcoidosis"
      key_distinguishing: "Leptomeningeal enhancement, elevated ACE, pulmonary findings"
  difficulty_variants:
    straightforward:
      presentation: "28-year-old woman with acute painful monocular vision loss and a prior episode of limb numbness 6 months ago."
      expected_agent_confidence: 0.85
    moderate:
      presentation: "33-year-old woman with subacute leg weakness, worse on one side, and urinary urgency; she recalls a transient sensory episode two years ago that was never investigated."
      expected_agent_confidence: 0.60
    diagnostic_puzzle:
      presentation: "25-year-old woman with migraine, episodic vertigo and fatigue; an outside MRI was reported as non-specific white matter changes and her symptoms were attributed to anxiety and migraine."
      expected_agent_confidence: 0.35
  common_followups:
    # No repeat MRI at 3 months or after steroids (future data and treatment response, ruling 4),
    # and VEP and OCT are specialized tests, not labs (24 Oct 2026 close-out).
    - trigger_action: "request_spine_mri"
      tool_name: "order_body_imaging"
      description: "Cervical and thoracic spinal cord MRI with gadolinium (study spine_MRI): short peripheral lesions with levels"
    - trigger_action: "request_aqp4_mog_cell_based_assay"
      tool_name: "interpret_labs"
      description: "Serum AQP4-IgG and MOG-IgG by cell-based assay (panel Neuroimmunology), served only to an order that names the assay"
    - trigger_action: "request_visual_evoked_potentials"
      tool_name: "order_specialized_test"
      description: "VEP (test_type vep), optional: P100 latency of both eyes, prolonged in an affected optic nerve"
    - trigger_action: "request_optical_coherence_tomography"
      tool_name: "order_specialized_test"
      description: "OCT (test_type optical_coherence_tomography), optional: both eyes; swelling or normal in acute optic neuritis, thinning only after an earlier episode"

bacterial_meningitis:
  name: "Acute bacterial meningitis"
  abbreviation: "BACT-MEN"
  icd_code: "G00.9"
  description: "Acute bacterial infection of the meninges, a neurological emergency requiring immediate empiric antibiotics"
  typical_demographics:
    age_range: [18, 70]
    sex_bias: null
  encounter_type: "emergency"
  # MRI is the late-imaging modality in bacterial meningitis (assess
  # complications: abscess, ventriculitis, empyema, cerebritis, venous sinus
  # thrombosis) but is not first-line: blood cultures and empirical antibiotics come first,
  # then LP without routine imaging (CT first only for a WHO 2025 section A.4 feature). Practice
  # supports demoting MRI to optional rather than treating it as mandatory.
  # Clinical tool review, July 2026: non-CSF microbiology added as REQUIRED (blood cultures,
  # whole-blood PCR, throat swab; WHO 2025); ECG removed — neither source assigns it a role in
  # this condition
  required_modalities: [LABS, CSF, microbiology]
  optional_modalities: [MRI, CT, EEG]
  key_findings:
    csf:
      straightforward:
        - "Turbid/cloudy appearance"
        - "Opening pressure elevated (>25 cmH2O)"
        - "WBC 1000-5000, >90% neutrophils"
        - "Protein markedly elevated (>200 mg/dL)"
        - "Glucose very low (<20 mg/dL), CSF:blood ratio 0.4 or less"
        - "Gram stain positive (gram-positive diplococci = pneumococcus)"
        - "CSF culture: Streptococcus pneumoniae"
      moderate:
        - "Mildly turbid CSF"
        - "WBC 200-500, 70% neutrophils, 30% lymphocytes"
        - "Protein 100-200 mg/dL"
        - "Glucose 30-40 mg/dL (borderline)"
        - "Gram stain negative (partially treated)"
        - "CSF culture pending"
      diagnostic_puzzle:
        - "Clear CSF (early presentation or partially treated)"
        - "WBC 50-100, mixed pleocytosis"
        - "Protein mildly elevated (60-100 mg/dL)"
        - "Glucose low-normal"
        - "Gram stain negative, culture negative (prior antibiotics)"
    labs:
      all_difficulties:
        - "CBC: leukocytosis with left shift (WBC 15-25K, >80% neutrophils)"
        - "BMP: possible hyponatremia (SIADH)"
        - "CRP: markedly elevated (>100 mg/L)"
        - "Procalcitonin: elevated (>2 ng/mL)"
        - "Coagulation: may show DIC (elevated PT/INR, low fibrinogen, elevated D-dimer)"
        - "Blood cultures: positive in 50-70% of cases"
        - "Lactate: elevated"
    mri:
      straightforward:
        - "Diffuse leptomeningeal enhancement on post-contrast T1"
        - "Possible subdural empyema or cerebritis"
        - "Restricted diffusion in sulci (pus)"
      moderate:
        - "Subtle leptomeningeal enhancement"
        - "No complications (no empyema, no infarcts)"
      diagnostic_puzzle:
        - "Normal MRI (early presentation)"
        - "Subtle enhancement that could be post-LP artifact"
  differential_diagnoses:
    - diagnosis: "Viral meningitis"
      key_distinguishing: "Lymphocytic pleocytosis, normal glucose, less toxic-appearing"
    - diagnosis: "Viral encephalitis (HSV)"
      key_distinguishing: "Temporal lobe involvement on MRI, seizures, personality change"
    - diagnosis: "Subarachnoid hemorrhage"
      key_distinguishing: "Sudden thunderclap headache, xanthochromia, RBCs in CSF"
    - diagnosis: "Tuberculous meningitis"
      key_distinguishing: "Subacute course, basilar enhancement, very low glucose, lymphocytic"
    - diagnosis: "Fungal meningitis (cryptococcal)"
      key_distinguishing: "Immunocompromised, subacute, positive India ink or CrAg"
  difficulty_variants:
    straightforward:
      presentation: "45-year-old with acute onset severe headache, fever 39.5°C, neck stiffness, photophobia, and altered mental status over 12 hours. Classic meningeal signs."
      expected_agent_confidence: 0.90
    moderate:
      presentation: "55-year-old post-splenectomy patient with headache, low-grade fever, and confusion over 24 hours. Partially treated with oral amoxicillin by PCP before presentation."
      expected_agent_confidence: 0.65
    diagnostic_puzzle:
      presentation: "35-year-old with 3-day headache, mild neck stiffness, and subjective fevers. Afebrile in ED. Recent URI. Lumbar puncture shows mixed pleocytosis — viral vs early bacterial unclear."
      expected_agent_confidence: 0.40
  # October 2026 review round: request_repeat_lp (a post-treatment repeat LP served to every LP
  # call), request_pcr_panel (CSF PCR is part of the index CSF report) and request_audiometry
  # (filed under interpret_labs; hearing assessment is a must, not a tool call) removed: they
  # generated classes C1 and C8 of plans/BACT-MEN.md
  common_followups:
    - trigger_action: "request_ct_head"
      tool_name: "order_ct_scan"
      description: "Non-contrast CT head before LP only where readily accessible and a WHO 2025 section A.4 feature is present at presentation (GCS below 10, focal neurological signs, cranial nerve deficits, papilloedema, new-onset seizures in adults, severe immunocompromised state); obtained after blood cultures and the first antibiotic dose, never delaying treatment; otherwise only for a parameningeal or skull-base source, after the LP"
    - trigger_action: "request_blood_cultures"
      tool_name: "order_microbiology"
      description: "Blood cultures drawn before antibiotics (collected_before_antimicrobials false if any antimicrobial was taken in the previous 7 days)"
    - trigger_action: "request_lumbar_puncture"
      tool_name: "analyze_csf"
      description: "Index LP (never an initial output): opening pressure, cells, glucose with paired blood glucose, protein, lactate, Gram stain, multiplex PCR; culture pending in the index report, deferred while shock, a bleeding diathesis or spreading purpura is uncorrected (WHO 2025 A.1.1)"

parkinsons:
  name: "Parkinson's disease"
  abbreviation: "PD"
  icd_code: "G20.A1"
  description: "Neurodegenerative movement disorder characterized by asymmetric resting tremor, rigidity, bradykinesia, and postural instability"
  typical_demographics:
    age_range: [55, 80]
    sex_bias: "slight_male"
  encounter_type: "outpatient"
  # July 2026 clinical review and October 2026 round (criteria_packs/PD.md, plans/PD.md): MRI
  # (CT only when MRI is impossible) is the one routine study; no fixed lab panel (labs only for a
  # case-specific Wilson, drug-level, thyroid or pre-treatment question); no literature criterion;
  # medication review required only with a dopamine blocker on the list or a pre-DBS review; EEG,
  # CSF, autonomic and tilt testing never criteria (ECG only for syncope). Neuropsychology optional
  # when cognition is active, required before DBS. Labels follow MDS 2015: a first visit before
  # levodopa is "clinically probable PD", never "established".
  required_modalities: [MRI]
  optional_modalities: [LABS, specialized_test, advanced_imaging, CT]
  key_findings:
    mri:
      straightforward:
        - "Normal brain MRI for age (consistent with PD; no structural or vascular cause of the parkinsonism)"
        - "No vascular parkinsonism (no basal ganglia infarcts)"
        - "No NPH features (no ventriculomegaly out of proportion to sulcal atrophy)"
        - "Possible mild age-appropriate atrophy"
      moderate:
        - "Normal MRI but with some periventricular white matter changes"
        - "Ventricles proportionate to sulci (Evans index below 0.30; above 0.30 is abnormal, never 'upper limit of normal')"
      diagnostic_puzzle:
        - "PD-labelled puzzle: MRI normal for age (atypical markers would contradict the label)"
        - "MSA-labelled case only: putaminal atrophy with iron-sensitive signal decrease, middle cerebellar peduncle or pontine atrophy, hot cross bun sign (MDS 2022 markers)"
        - "PSP-labelled case only: midbrain atrophy (hummingbird sign), supportive and not required"
        - "Standard parkinsonism MRI is non-contrast: no gadolinium or MRA lines unless the case gives a reason (e.g. prior TIA)"
    labs:
      selected_cases_only:
        - "Target a metabolic, toxic, young-onset or pretreatment question; do not order a fixed PD panel"
        - "Wilson studies may be appropriate in young-onset parkinsonism"
        - "Medication levels, renal/liver function or thyroid testing are used only when the case supplies that indication"
  differential_diagnoses:
    - diagnosis: "Essential tremor"
      key_distinguishing: "Action/postural tremor (not resting), bilateral, no rigidity/bradykinesia, FH positive"
    - diagnosis: "Drug-induced parkinsonism"
      key_distinguishing: "Often symmetric, exposure to dopamine blockers (metoclopramide, prochlorperazine, antipsychotics); normal DaTscan; resolves over weeks to months after withdrawal"
    - diagnosis: "Multiple system atrophy (MSA)"
      key_distinguishing: "Early autonomic failure, cerebellar signs, rapid progression; poor levodopa response only after a documented trial of up to 1000 mg/day for at least a month (MDS 2022)"
    - diagnosis: "Dementia with Lewy bodies (DLB)"
      key_distinguishing: "Dementia before or within a year of parkinsonism, fluctuations, visual hallucinations, RBD, neuroleptic sensitivity (McKeith 2017)"
    - diagnosis: "Vascular parkinsonism"
      key_distinguishing: "Lower-body predominant, gait onset, vascular lesions on MRI, usually normal DaTscan"
    - diagnosis: "Progressive supranuclear palsy (PSP)"
      key_distinguishing: "Vertical gaze palsy, early falls, axial rigidity > limb, poor levodopa response"
    - diagnosis: "Normal pressure hydrocephalus (NPH)"
      key_distinguishing: "Gait apraxia (magnetic gait), urinary incontinence, dementia, ventriculomegaly"
  difficulty_variants:
    straightforward:
      presentation: "65-year-old man with 2-year progressive right hand resting tremor, shuffling gait, and micrographia. Exam shows asymmetric cogwheel rigidity and bradykinesia."
      expected_agent_confidence: 0.85
    moderate:
      presentation: "70-year-old man with 1-year gait instability and bilateral mild bradykinesia. No clear resting tremor. On metoclopramide for gastroparesis (confounding)."
      expected_agent_confidence: 0.55
    diagnostic_puzzle:
      presentation: "60-year-old with parkinsonism, orthostatic light-headedness and urinary urgency, raising MSA. The data must fit the label: a PD-labelled case has asymmetric onset, a rest tremor on examination and at most the red flags its supportive criteria counterbalance (MDS 2015); an MSA case meets MDS 2022 and states a poor levodopa response only after a documented trial."
      expected_agent_confidence: 0.35
  common_followups:
    - trigger_action: "request_datscan"
      tool_name: "order_advanced_imaging"
      description: "DaTscan (modality DaTscan), stored as a binary abnormal report in every case because the library default is normal (an MDS absolute exclusion); required only where the label rests on it (dopamine-blocker or valproate confounder), optional for a live degenerative-vs-nondegenerative differential, waste when the diagnosis is clinically clear; it does not distinguish PD from MSA, PSP or DLB"
    - trigger_action: "request_mibg"
      tool_name: "order_advanced_imaging"
      description: "Cardiac MIBG (modality MIBG_scan) only where a supportive criterion or a DLB indicative biomarker is in question; binary report, no disease name"
    - trigger_action: "request_sleep_study"
      tool_name: "order_specialized_test"
      description: "Polysomnography (test_type polysomnography), stored wherever dream enactment or RBD is reported; optional criterion only when dream enactment is not yet PSG-confirmed"
    - trigger_action: "request_neuropsych_testing"
      tool_name: "order_specialized_test"
      description: "Neuropsychological battery (test_type neuropsych_battery), stored wherever the exam MoCA is below 28 and consistent with it; optional when cognition is clinically relevant, required before DBS"
    - trigger_action: "request_counselled_pd_gene_panel"
      tool_name: "order_specialized_test"
      description: "Optional genetic_panel:PD after counselling, only for onset before 50 or a first-degree relative"
    - trigger_action: "request_orthostatic_bp"
      tool_name: "perform_clinical_assessment"
      description: "Lying and standing blood pressure (assessment_type orthostatic_blood_pressure) where orthostatic symptoms are reported and the exam gives no figures"

brain_tumor_glioma:
  name: "Brain tumor — high-grade glioma (GBM)"
  abbreviation: "GLIO-HG"
  icd_code: "C71.9"
  description: "High-grade primary brain tumor (glioblastoma) presenting with progressive neurological symptoms, seizures, or signs of elevated intracranial pressure"
  typical_demographics:
    age_range: [45, 75]
    sex_bias: "slight_male"
  encounter_type: "inpatient"
  # October 2026 review round (plans/GLIO-HG.md C5): EEG has no role in tumour diagnosis and is
  # never required; it is recommended only to characterise uncertain spells or altered
  # consciousness. A documented seizure is treated (levetiracetam, no enzyme inducers); a patient
  # without seizures gets no antiseizure prophylaxis (AIOM).
  # Clinical tool review, July 2026: tissue acquisition + integrated histomolecular diagnosis
  # added as REQUIRED — without it the pathway can only reach a suspicion, which WHO CNS5 labels
  # NOS; advanced_imaging optional for perfusion MRI and amino-acid PET, which separate
  # pseudoprogression from progression
  # October 2026 close-out: current performance status (KPS/ECOG, perform_clinical_assessment
  # performance_status) is required in every case, because every treatment branch after the
  # integrated diagnosis is chosen on it (EANO 2021; Reviewer 2, RP04 0289beef, as a class).
  required_modalities: [MRI, LABS, tissue_diagnosis, clinical_assessment]
  optional_modalities: [EEG, ECG, advanced_imaging, body_imaging, microbiology]
  key_findings:
    mri:
      straightforward:
        - "Large heterogeneously enhancing mass with central necrosis (ring-enhancing)"
        - "Surrounding vasogenic edema with mass effect"
        - "Midline shift"
        - "Location: frontal or temporal lobe (most common)"
        - "Restricted diffusion at enhancing rim (high cellularity)"
        # rCBV belongs in the order_advanced_imaging perfusion_MRI report, not the structural MRI
        - "Elevated rCBV in the enhancing rim on the separate perfusion study"
      moderate:
        - "Irregular enhancing mass without classic ring pattern"
        - "Moderate surrounding edema"
        - "Minimal mass effect"
        - "Location in eloquent cortex complicating surgical planning"
      diagnostic_puzzle:
        - "Non-enhancing infiltrative lesion (low-grade appearing but actually high-grade)"
        - "Multifocal lesions mimicking metastases or CNS lymphoma"
        - "OR: ring-enhancing lesion mimicking abscess or demyelination"
    eeg:
      straightforward:
        - "Focal slowing over the tumor region (continuous polymorphic delta)"
        - "Possible epileptiform discharges in peri-tumoral cortex"
        - "Background asymmetry"
      moderate:
        - "Regional slowing, less well-localized"
        - "No clear epileptiform discharges"
      diagnostic_puzzle:
        - "Generalized slowing without clear focal features"
        - "OR: Focal findings contralateral to the lesion (false lateralization)"
    labs:
      all_difficulties:
        - "CBC: normal"
        - "BMP: normal"
        - "Coagulation: normal (pre-surgical baseline)"
        - "LDH: may be mildly elevated"
        - "Liver and renal function: normal (baseline for chemotherapy)"
  differential_diagnoses:
    - diagnosis: "Brain metastasis"
      key_distinguishing: "Multiple lesions at gray-white junction, known primary cancer, more spherical"
    - diagnosis: "Brain abscess"
      key_distinguishing: "Restricted diffusion centrally (pus), ring enhancement thin and smooth, fever, elevated WBC"
    - diagnosis: "CNS lymphoma"
      key_distinguishing: "Homogeneous enhancement, periventricular, immunocompromised; steroids before biopsy can mask it, so they are held unless herniation is impending"
    - diagnosis: "Tumefactive demyelination"
      key_distinguishing: "Open ring enhancement, young patient, less mass effect for size, MS history"
    - diagnosis: "Low-grade glioma"
      key_distinguishing: "Non-enhancing, slower growth, younger patient, FLAIR bright without necrosis"
  # October 2026 review round (plan C8): presentations give the clinical picture and at most an
  # outpatient non-contrast CT with a mass and oedema; the contrast MRI, perfusion, spectroscopy and
  # tissue results are scored studies and appear only in their tool outputs.
  difficulty_variants:
    straightforward:
      presentation: "58-year-old man with 3-week progressive headache, left arm weakness, and a new-onset seizure. CT shows a large right frontal mass with midline shift."
      expected_agent_confidence: 0.90
    moderate:
      presentation: "52-year-old woman with 2-month personality change and word-finding difficulty; outpatient non-contrast CT shows a left temporal mass with surrounding oedema."
      expected_agent_confidence: 0.65
    diagnostic_puzzle:
      presentation: "48-year-old with new seizures and a recent dental infection; non-contrast CT shows a right frontotemporal mass with oedema, and abscess, tumour and demyelination are all on the table."
      expected_agent_confidence: 0.40
  # October 2026 review round: each follow-up names the tool that performs the study. Perfusion,
  # spectroscopy, fMRI and DTI are order_advanced_imaging modalities; tissue is never an
  # interpret_labs result and never an initial output; no literature-search, consult or CSF step
  # (LP is harm with shift, effacement, hydrocephalus, papilloedema or a spinal block).
  common_followups:
    - trigger_action: "request_mri_perfusion"
      tool_name: "order_advanced_imaging"
      description: "Perfusion MRI (modality perfusion_MRI): rCBV in the enhancing rim, values only, no integrated diagnosis"
    - trigger_action: "request_mr_spectroscopy"
      tool_name: "order_advanced_imaging"
      description: "MR spectroscopy (modality MR_spectroscopy): choline, NAA, lipid/lactate ratios, values only"
    - trigger_action: "request_ct_chest_abdomen_pelvis"
      tool_name: "order_body_imaging"
      description: "Contrast CT chest/abdomen/pelvis (study chest_abdomen_pelvis_CT) only when metastasis is a live alternative (multifocal lesions, prior cancer, systemic symptoms)"
    - trigger_action: "assess_performance_status"
      tool_name: "perform_clinical_assessment"
      description: "Current KPS and ECOG derived from the examination (assessment_type performance_status), not the pre-illness value in the social history"
    - trigger_action: "request_functional_mri"
      tool_name: "order_advanced_imaging"
      description: "Task fMRI (modality functional_MRI) for language or motor mapping, only when eloquent cortex lies close to the lesion"
    - trigger_action: "request_dti_tractography"
      tool_name: "order_advanced_imaging"
      description: "DTI tractography (modality DTI_tractography) of the tracts near the lesion, only when a major tract is at risk"
    - trigger_action: "request_tissue_diagnosis"
      tool_name: "obtain_tissue_diagnosis"
      description: "Maximal safe resection where site and condition allow (AIOM; EANO 2021), stereotactic biopsy for deep, midline, multifocal or suspected lymphoma lesions or an unfit patient; layered WHO CNS5 report. Assays by entity: IDH1 R132H IHC with IDH1/IDH2 sequencing when negative at 55 or under, ATRX and MGMT in every diffuse glioma, H3 K27 in midline tumours, CDKN2A/B in IDH-mutant astrocytoma, 1p/19q only when IDH-mutant, TERT, EGFR and +7/-10 when histology lacks necrosis or microvascular proliferation"

functional_neurological_disorder:
  name: "Functional neurological disorder (conversion disorder)"
  abbreviation: "FND"
  icd_code: "F44.4"
  description: "Neurological symptoms (weakness, tremor, seizures) not explained by organic disease, diagnosed by positive clinical signs, not by exclusion"
  typical_demographics:
    age_range: [20, 50]
    sex_bias: "female_predominant"
  encounter_type: "inpatient"
  # Composition (August 2026 agreement with the physicians, confirmed by Andrea 24 Oct 2026): FND
  # stays (DLB is a deferred same-size swap) on the physicians' terms:
  # perform_clinical_assessment{functional_neuro_signs} is the only required diagnostic act; all
  # instrumental work is optional, video-EEG in paroxysmal cases included; a test that answers a
  # named red flag (glucose after insulin, sodium in polydipsia, MRI for a stroke or MS-relapse
  # mimic) is recommended. A drug review may be required as a management act when a drug started
  # for the events must be tapered. See criteria_packs/FND.md and plans/FND-decisions.md.
  required_modalities: [clinical_assessment]
  optional_modalities: [EEG, MRI, LABS]
  key_findings:
    eeg:
      all_difficulties:
        - "Video-EEG (paroxysmal cases, optional study): habitual events recorded without ictal change before, during or after the event"
        - "No interictal epileptiform discharges, except in a patient with established epilepsy"
        - "Normal background; the posterior dominant rhythm persists during the events"
        - "The report describes the EEG and the recorded events; it never names PNES, functional or psychogenic"
    mri:
      all_difficulties:
        - "Only where a named question exists (stroke mimic, new deficit on MS or PD, CNS vasculitis); non-contrast with DWI unless enhancement is the question (MS on natalizumab)"
        - "No structural lesion explaining symptoms"
        - "No evidence of stroke, demyelination, or mass"
    labs:
      all_difficulties:
        - "Named assays for a named red flag only, never a screening battery: glucose after an insulin dose, sodium and osmolality in polydipsia, electrolytes, magnesium, phosphate and thiamine in malnutrition"
        - "Results answer the red flag and do not explain the deficit or the events"
        - "Post-event prolactin, if drawn: a normal level excludes nothing; a dopamine antagonist makes it uninterpretable"
  differential_diagnoses:
    - diagnosis: "Epileptic seizures"
      key_distinguishing: "EEG correlate during event, stereotyped semiology, post-ictal confusion, elevated prolactin"
    - diagnosis: "Multiple sclerosis"
      key_distinguishing: "MRI white matter lesions, CSF oligoclonal bands, clinical dissemination"
    - diagnosis: "Myasthenia gravis"
      key_distinguishing: "Fatigable weakness, ptosis, diplopia, positive AChR antibodies, decremental response on RNS"
    - diagnosis: "Stroke/TIA"
      key_distinguishing: "Acute onset, vascular territory distribution, DWI restriction on MRI"
    - diagnosis: "Early Parkinson's disease"
      key_distinguishing: "Rest tremor, cogwheel rigidity, bradykinesia, asymmetric, progressive"
  difficulty_variants:
    straightforward:
      presentation: "28-year-old woman with acute-onset right leg weakness and witnessed shaking episodes with eyes closed and preserved recall. Hoover sign positive. Give-way weakness on exam. Recent psychosocial stressor."
      expected_agent_confidence: 0.80
    moderate:
      presentation: "35-year-old woman with intermittent whole-body tremor and episodes of unresponsiveness. Some features overlap with epilepsy. Previous normal EEG but no events captured."
      expected_agent_confidence: 0.55
    diagnostic_puzzle:
      presentation: "40-year-old woman with progressive bilateral leg weakness over weeks, wheelchair-bound, after an extensive normal outpatient workup; the positive signs need a careful examination (one sign equivocal). Past history of fibromyalgia and chronic pain."
      expected_agent_confidence: 0.35
  common_followups:
    # EMG/NCS is a waste avoided action in every FND case and a psychiatric evaluation is a must,
    # not a test (ruling 4), so neither is seeded as a follow-up (24 Oct 2026 close-out).
    - trigger_action: "request_video_eeg"
      tool_name: "analyze_eeg"
      description: "Prolonged video-EEG (eeg_type video) in paroxysmal cases, an optional study: habitual events recorded without ictal change"
    - trigger_action: "request_spine_mri"
      tool_name: "order_body_imaging"
      description: "Spine MRI (study spine_MRI) only for acute paraplegia or a cord question: normal cord, no compression"
    - trigger_action: "request_neuropsych_testing"
      tool_name: "order_specialized_test"
      description: "Neuropsychological battery (test_type neuropsych_battery), optional: quantifies the comorbidity that treatment targets"

guillain_barre:
  name: "Guillain-Barré syndrome"
  abbreviation: "GBS"
  icd_code: "G61.0"
  description: "Acute immune-mediated polyradiculoneuropathy (demyelinating or axonal) causing rapidly progressive, relatively symmetric weakness with reduced or absent reflexes and a nadir within 4 weeks, often after an infection"
  typical_demographics:
    age_range: [15, 85]
    sex_bias: "slight_male"
  encounter_type: "emergency"
  # Clinical tool review, July 2026: cardiac_monitoring optional->REQUIRED (autonomic instability
  # triggers ICU escalation alongside FVC); respiratory monitoring is already
  # specialized_test{respiratory_function}, which stays REQUIRED; spinal and nerve imaging added
  # as optional to exclude cord compression
  # October 2026 review round (plans/GBS.md, GBS-decisions.md; criteria pack is the authority):
  # no antecedent-infection serology or PCR in current labs (C3), no anti-GM1 and no ganglioside
  # panel in typical GBS (C2), no repeat NCS, telemetry or culture result dated after the
  # assessment (C12), respiratory follow-ups under order_specialized_test with weight-based values
  # (C1), contrast spine MRI only for a red flag, under order_body_imaging.
  required_modalities: [LABS, CSF, specialized_test, cardiac_monitoring]
  optional_modalities: [MRI, ECG, body_imaging]
  key_findings:
    labs:
      all_difficulties:
        - "Baseline blood tests: full blood count, glucose, electrolytes, renal function, liver tests, albumin and CK; abnormal liver tests or low albumin mark a higher risk of a severe course"
        - "Hyponatraemia (SIADH) possible in severe cases"
        - "No antecedent-infection serology or PCR in the current labs: the antecedent illness is history (a dated prior stool culture or swab may be named as history)"
        - "Anti-GQ1b IgG only when Miller Fisher syndrome or an MFS-spectrum overlap is suspected (anti-GT1a in the pharyngeal-cervical-brachial variant); not for typical sensorimotor GBS, subtyping or prognosis"
        - "ESR/CRP: normal or mildly raised; any raised value is explained in the case"
    csf:
      straightforward:
        - "Opening pressure normal"
        - "Albuminocytological dissociation: raised protein (100-400 mg/dL) with cells <5/mm3"
        - "Glucose: normal, with a CSF:serum ratio consistent with the serum glucose"
        - "No organisms on Gram stain; culture no growth to date"
      moderate:
        - "Mildly raised protein (50-100 mg/dL) with a normal cell count"
        - "Early presentation: CSF protein may be normal in the first week"
      diagnostic_puzzle:
        - "CSF protein only borderline raised (45-55 mg/dL)"
        - "Mild pleocytosis (10-50 cells/mm3): compatible with GBS but prompts exclusion of an alternative (HIV-associated GBS, CMV polyradiculitis, lymphoma, Lyme); more than 50/mm3 suggests another diagnosis"
        - "Normal CSF early in the acute phase"
    specialized_test:
      straightforward:
        - "Nerve conduction studies (NCS): markedly prolonged distal motor latencies"
        - "Reduced or absent motor nerve conduction velocities (<70% lower limit of normal)"
        - "Absent or prolonged F-waves and H-reflex (early proximal demyelination)"
        - "Reduced CMAP amplitudes bilaterally"
        - "Sensory NCS: absent or reduced SNAPs"
        - "EMG: reduced recruitment without fibrillations acutely (early AIDP)"
      moderate:
        - "Mild NCS slowing, borderline demyelinating criteria"
        - "Asymmetric nerve involvement"
        - "Early study: only prolonged distal latencies, F-waves not yet absent"
      diagnostic_puzzle:
        - "AMAN: reduced CMAP amplitudes or inexcitable motor nerves with normal conduction velocities and normal sensory responses (AMSAN: the same with reduced sensory amplitudes); subtype words only where the numbers meet them"
        - "Miller Fisher syndrome: reduced sensory amplitudes and absent H-reflexes with largely normal motor studies"
        - "Equivocal or normal NCS in the first week; a repeat study at 2-3 weeks is a recommendation in the assessment, never a stored result"
    mri:
      straightforward:
        - "Enhancement of cauda equina nerve roots on contrast MRI spine (lumbosacral)"
        - "Enhancement of cranial nerves (VII, IX, X) in severe cases"
      moderate:
        - "Subtle nerve root enhancement on lumbosacral MRI"
        - "No significant cord signal change"
      diagnostic_puzzle:
        - "Normal spine MRI (enhancement not always present)"
        - "Cord T2 signal changes raising concern for myelitis (differentiates from transverse myelitis)"
    ecg:
      all_difficulties:
        - "Sinus tachycardia (autonomic dysfunction)"
        - "OR: sinus bradycardia or pauses in severe autonomic involvement (findings only; no treatment in the report)"
        - "T-wave changes or QTc prolongation possible in dysautonomia"
        - "Arrhythmias (AF, ventricular ectopy) in severe autonomic instability"
  differential_diagnoses:
    - diagnosis: "Transverse myelitis"
      key_distinguishing: "Spinal cord T2 signal on MRI, sensory level, upper motor neuron signs, sphincter dysfunction"
    - diagnosis: "CIDP (chronic inflammatory demyelinating polyneuropathy)"
      key_distinguishing: "Progression beyond 8 weeks, or 3 or more treatment-related fluctuations (acute-onset CIDP); cannot be excluded at presentation, reassess at 8 weeks"
    - diagnosis: "Botulism"
      key_distinguishing: "Descending paralysis, cranial nerve palsies first, pupillary and autonomic involvement, no sensory symptoms, normal CSF protein, food or wound exposure"
    - diagnosis: "Myasthenia gravis"
      key_distinguishing: "Fatigable ptosis, diplopia or bulbar weakness with preserved reflexes; decrement on repetitive nerve stimulation, AChR or MuSK antibodies"
    - diagnosis: "Tick paralysis"
      key_distinguishing: "Ascending paralysis, tick found on scalp, resolves rapidly after tick removal"
    - diagnosis: "Spinal cord compression"
      key_distinguishing: "Back pain, upper motor neuron signs below level, MRI shows compression"
  difficulty_variants:
    straightforward:
      presentation: "35-year-old with progressive ascending leg and arm weakness and areflexia over 5 days, after a diarrhoeal illness 2 weeks earlier. Unable to walk."
      expected_agent_confidence: 0.88
    moderate:
      presentation: "50-year-old with 10-day history of bilateral foot numbness, progressive leg and mild arm weakness, and facial diplegia. Mild breathlessness when lying flat."
      expected_agent_confidence: 0.62
    diagnostic_puzzle:
      presentation: "28-year-old with acute diplopia, ataxia, and areflexia, no limb weakness (Miller Fisher syndrome). Initially managed as a suspected brainstem stroke."
      expected_agent_confidence: 0.38
  # October 2026 review round: request_repeat_ncs removed (it generated NCS results dated after
  # the assessment that also answered the index order, class C12); the ganglioside follow-up is
  # generated only for MFS-spectrum, pharyngeal-cervical-brachial and ophthalmoplegic cases.
  common_followups:
    - trigger_action: "request_respiratory_monitoring"
      tool_name: "order_specialized_test"
      description: "Bedside respiratory function: FVC in L, % predicted and mL/kg (weight recorded in the general exam), MIP and MEP, with the trend; values below reference flagged L; ventilated patients report the last pre-intubation values"
    - trigger_action: "request_anti_gq1b_gt1a_ganglioside_panel"
      tool_name: "interpret_labs"
      description: "Anti-GQ1b IgG (with anti-GT1a IgG in the pharyngeal-cervical-brachial variant), only for MFS-spectrum, PCB or ophthalmoplegic presentations; every positive result is interpreted in the assessment"
    - trigger_action: "request_spine_mri_contrast"
      tool_name: "order_body_imaging"
      description: "Contrast spine MRI only for a red flag (sensory level, sphincter dysfunction at onset, marked asymmetry, recent spinal procedure or trauma, cord signs): excludes compression or myelitis; nerve root enhancement is supportive"
    - trigger_action: "request_cardiac_monitoring"
      tool_name: "order_cardiac_monitoring"
      description: "Continuous telemetry with blood pressure monitoring over the first 24 hours: autonomic findings only, no treatment in the report"

myasthenia_gravis:
  name: "Myasthenia gravis"
  abbreviation: "MG"
  icd_code: "G70.00"
  description: "Autoimmune disorder of the neuromuscular junction caused by antibodies against AChR or MuSK, presenting with fatigable weakness"
  typical_demographics:
    age_range: [15, 85]
    sex_bias: "female_predominant"
  encounter_type: "inpatient"
  # Clinical tool review, July 2026: mediastinal (thymic) imaging added as REQUIRED in every newly
  # diagnosed patient irrespective of serostatus (Jacob 2025); a chest radiograph does not satisfy
  # it. Thymic imaging is order_body_imaging (mediastinum_CT with contrast), never the head-CT tool.
  # October 2026 review round (plans/MG.md, MG-decisions.md): ICD G70.00 for a new or stable
  # presentation, G70.01 only for an exacerbation or crisis; LEMS mimic cases use G73.1.
  required_modalities: [LABS, specialized_test, body_imaging]
  # No CSF in any MG case (Reviewer 2). Brain/orbit MRI only after negative serology and
  # neurophysiology or for a central or orbital mimic the case raises; advanced imaging is FDG-PET
  # for the LEMS tumour search only; ECG before amifampridine in LEMS.
  optional_modalities: [MRI, ECG, advanced_imaging, CT]
  key_findings:
    labs:
      straightforward:
        - "Anti-AChR binding antibodies (RIA or cell-based assay): positive in about 85% of generalized and about 50% of ocular MG; binding in nmol/L, blocking and modulating in %"
        - "Thyroid function in every patient; anti-TPO or TRAb when thyroid disease is suspected or known"
        - "CBC and BMP listed analyte by analyte with values (no 'All normal' panels)"
      moderate:
        - "Anti-AChR binding antibody modestly raised: a value above the laboratory's reference range is positive, not borderline"
        - "Anti-MuSK antibodies tested when AChR is negative; positive in a minority of AChR-negative patients (proportion varies by population)"
        - "Thyroid peroxidase antibodies: positive (concurrent autoimmunity)"
      diagnostic_puzzle:
        - "Seronegative MG: AChR and MuSK negative; diagnosed only after the high-sensitivity cell-based panel (clustered AChR, clustered MuSK, LRP4)"
        - "Anti-LRP4 antibodies in a minority of double-seronegative patients (wide variation between cohorts)"
        - "No paraneoplastic panel in MG; anti-titin, anti-RyR and striational antibodies are not orderable and not diagnostically helpful"
    specialized_test:
      straightforward:
        - "Repetitive nerve stimulation at 2-3 Hz: decrement above 10% in a facial and a proximal muscle, normal baseline CMAP amplitudes, no post-exercise facilitation"
        - "Single-fiber EMG (when RNS is normal or serology negative): increased jitter and blocking; sensitive (over 90%) but not specific"
        - "Ice-pack test only with ptosis: MRD1 improves by at least 2 mm after 2-5 minutes"
      moderate:
        - "RNS at 3 Hz: decrement near the 10% threshold in one muscle only"
        - "SFEMG: mildly increased jitter without blocking"
        - "Respiratory function (staging): FVC in L, % predicted and mL/kg at the stated weight, MIP and MEP in cmH2O, flagged L when below reference"
      diagnostic_puzzle:
        - "Ocular MG: normal limb RNS, abnormal SFEMG in a facial muscle"
        - "RNS normal; SFEMG abnormal in a weak muscle"
        - "LEMS mimic: low baseline CMAPs with an increment of at least 60% after 10 s of exercise (Oh 2005)"
    body_imaging:
      straightforward:
        - "Contrast CT of the anterior mediastinum: well-defined anterior mediastinal mass most consistent with thymoma (present in about 10-15% of MG)"
      moderate:
        - "Thymic hyperplasia or a residual thymus for age, without a mass"
        - "Indeterminate anterior mediastinal soft tissue reported with its features (the tissue diagnosis is not in the CT report)"
      diagnostic_puzzle:
        - "Normal mediastinum (age-involuted thymus, no thymic pathology)"
    mri:
      all_difficulties:
        - "Only where the case raises a central or orbital mimic: normal brain and orbit MRI (no brainstem or cavernous sinus lesion, no extraocular muscle enlargement)"
  differential_diagnoses:
    - diagnosis: "Lambert-Eaton myasthenic syndrome (LEMS)"
      key_distinguishing: "Proximal leg weakness, areflexia, autonomic symptoms, low CMAPs with post-exercise facilitation, P/Q-type VGCC antibodies, associated with SCLC"
    - diagnosis: "Botulism"
      key_distinguishing: "Descending paralysis, fixed dilated pupils, no fatigability pattern, toxin assay positive"
    - diagnosis: "Brainstem stroke"
      key_distinguishing: "Acute onset, DWI restriction on MRI, other brainstem signs, non-fatigable diplopia"
    - diagnosis: "Multiple sclerosis"
      key_distinguishing: "MRI white matter lesions, CSF oligoclonal bands, internuclear ophthalmoplegia"
    - diagnosis: "Thyroid ophthalmopathy (Graves)"
      key_distinguishing: "Proptosis, lid retraction, anti-thyroid antibodies, restricted EOM on MRI orbits"
  # October 2026 review round: presentations describe the clinical picture only. Antibody, RNS,
  # SFEMG, CT and spirometry results of scored studies belong in the tool outputs, never in the HPI.
  difficulty_variants:
    straightforward:
      presentation: "35-year-old woman with 3-month progressive ptosis, diplopia worsening at end of day, and proximal arm fatigue when lifting her arms overhead."
      expected_agent_confidence: 0.88
    moderate:
      presentation: "52-year-old man with fatigable bilateral ptosis and dysphagia over 4 months, worse in the evening and after prolonged chewing."
      expected_agent_confidence: 0.62
    diagnostic_puzzle:
      presentation: "45-year-old woman with fluctuating dysarthria and dysphagia over 6 months, worse at the end of the day and initially attributed to anxiety."
      expected_agent_confidence: 0.35
  # October 2026 review round: management (IVIG, plasma exchange, thymectomy, pyridostigmine
  # trials) is never a follow-up; serology of the first-line panel lives in the initial labs.
  common_followups:
    - trigger_action: "request_repetitive_nerve_stimulation"
      tool_name: "order_specialized_test"
      description: "2-3 Hz repetitive nerve stimulation of a facial and a proximal muscle (test_type repetitive_nerve_stimulation), with routine NCS"
    - trigger_action: "request_emg_single_fiber"
      tool_name: "order_specialized_test"
      description: "Single-fiber EMG of a weak facial or limb muscle (test_type emg_single_fiber), when RNS is normal or serology is negative"
    - trigger_action: "request_musk_antibodies"
      tool_name: "interpret_labs"
      description: "Anti-MuSK antibodies when AChR is negative; the cell-based panel or anti-LRP4 only when AChR and MuSK are both negative"
    - trigger_action: "request_respiratory_function"
      tool_name: "order_specialized_test"
      description: "Respiratory function (test_type respiratory_function): FVC in L, % predicted and mL/kg, MIP and MEP; staging, first when bulbar or breathless"
    - trigger_action: "request_mediastinal_ct"
      tool_name: "order_body_imaging"
      description: "Contrast CT of the mediastinum (study mediastinum_CT) for thymoma or thymic hyperplasia in every newly diagnosed patient"

subarachnoid_hemorrhage:
  name: "Subarachnoid hemorrhage"
  abbreviation: "SAH"
  icd_code: "I60.9"
  description: "Life-threatening intracranial hemorrhage into the subarachnoid space, most commonly from rupture of an intracranial aneurysm"
  typical_demographics:
    age_range: [40, 70]
    sex_bias: "slight_female"
  encounter_type: "emergency"
  # Clinical tool review, July 2026: NCCT is the mandatory first study and CTA is a distinct
  # subsequent acquisition. CSF becomes required per case only after a negative/inconclusive
  # NCCT with persistent suspicion; it is deliberately not a blanket required modality here.
  # TCD is optional surveillance (COR 2a), an admission baseline. Catheter DSA with 3D rotational
  # angiography follows the CTA in every case (recommended; required when CTA is negative) and must
  # never be confused with CTA/MRA. October 2026 review: ECG is required in every case; the
  # Hunt-Hess grade is the agent's judgment and never appears in the presentation.
  required_modalities: [CT, LABS, ECG]
  optional_modalities: [CSF, advanced_imaging, echo]
  key_findings:
    ct:
      straightforward:
        - "Hyperdense blood in basal cisterns (suprasellar, sylvian fissures, interhemispheric)"
        - "Fisher grade 3-4: thick subarachnoid clot and/or intraventricular blood"
        - "Hydrocephalus (acute communicating) due to CSF outflow obstruction"
        - "Possible intracerebral extension or subdural hematoma"
      moderate:
        - "Thin subarachnoid blood — Fisher grade 2"
        - "Blood in Sylvian fissure only, no hydrocephalus"
        - "Sentinel bleed: small subarachnoid or focal hyperdensity"
      diagnostic_puzzle:
        - "No subarachnoid hyperdensity in a late presenter (more than 6 hours, or days) or with anemia"
        - "Subtle sulcal effacement without obvious hyperdensity"
        - "CT artifact or isodense blood in anemic patient"
      vascular_assessment:
        - "CTA is obtained only after the noncontrast CT to localize the aneurysm and plan treatment"
        - "Aneurysm location, neck, dome and branch anatomy; CTA is not a substitute for first-line NCCT"
    csf:
      straightforward:
        - "Grossly bloody CSF, non-clearing across tubes 1-4"
        - "Xanthochromia (yellow CSF) on spectrophotometry — definitive for SAH when CT negative"
        - "Elevated RBC count (>100,000/μL)"
        - "Elevated protein due to blood breakdown"
        - "Opening pressure elevated"
      moderate:
        - "Bloody tap with partial clearing (tubes 1-4) — traumatic tap vs SAH"
        - "Xanthochromia present but CT was negative"
      diagnostic_puzzle:
        - "LP within about 12 hours of ictus: oxyhemoglobin only, bilirubin not yet formed; non-clearing counts decide"
        - "Traumatic tap with equivocal clearing across tubes"
        - "Late presentation (days): red cells largely lysed, spectrophotometric bilirubin persists (about 2 weeks)"
    labs:
      all_difficulties:
        # Reports state values and flags only; the interpretation is the agent's.
        - "CBC: white count may be raised"
        - "BMP with potassium and magnesium (QTc management); sodium may fall over the first days"
        - "Coagulation: PT/INR, PTT before securing or CSF diversion"
        - "Troponin: raised in 20-30% (numeric value)"
        - "BNP: numeric value, may be raised"
        - "Glucose: may be raised"
        - "Type and screen"
    advanced_imaging:
      straightforward:
        - "Catheter DSA with 3D rotational angiography: aneurysm size, neck, dome-to-neck ratio and branches, consistent with the CTA; diagnostic findings only, never coiling, clipping or occlusion class"
        - "Optional TCD at admission: baseline velocities for the day of presentation, no vasospasm in the first days"
      moderate:
        - "Late presenter (day 3 or later): TCD may show mildly raised velocities; vasospasm mainly days 3 to 14"
      diagnostic_puzzle:
        - "CTA-negative SAH: catheter DSA is the reference test (required), negative in perimesencephalic non-aneurysmal SAH"
    ecg:
      all_difficulties:
        - "Diffuse deep T-wave inversions (neurogenic T-waves)"
        - "QTc prolongation"
        - "ST-segment changes mimicking STEMI (subarachnoid-induced cardiac injury)"
        - "Sinus tachycardia, possible atrial or ventricular arrhythmias"
  differential_diagnoses:
    - diagnosis: "Thunderclap migraine"
      key_distinguishing: "Normal CT, normal LP (no xanthochromia), personal or family history of migraine, recurrent episodes"
    - diagnosis: "RCVS (reversible cerebral vasoconstriction syndrome)"
      key_distinguishing: "Recurrent thunderclap headaches over days-weeks, convexity rather than basal-cistern SAH, segmental vasoconstriction, resolves within 3 months"
    - diagnosis: "Cervical artery dissection"
      key_distinguishing: "Headache and neck pain; dissection on CTA of the neck"
    - diagnosis: "Cerebral venous sinus thrombosis"
      key_distinguishing: "Hyperdense sinus or venous infarct on CT, filling defect on venography"
    - diagnosis: "Bacterial meningitis"
      key_distinguishing: "CSF neutrophilic pleocytosis, low glucose, fever, no xanthochromia, positive culture"
    - diagnosis: "Intracerebral hemorrhage"
      key_distinguishing: "Parenchymal blood on CT, focal neurological deficits, hypertension"
    - diagnosis: "Pituitary apoplexy"
      key_distinguishing: "Sellar mass on MRI, visual field defects, hormonal abnormalities, blood within pituitary"
  difficulty_variants:
    straightforward:
      presentation: "52-year-old woman with sudden 'worst headache of my life' while exerting at the gym, vomiting, neck stiffness and photophobia; alert and oriented, no focal deficit."
      expected_agent_confidence: 0.92
    moderate:
      presentation: "45-year-old man with a sudden severe headache 8 hours ago, now mildly improved; a CT at the outside hospital was reported as negative and he is transferred for further evaluation."
      expected_agent_confidence: 0.68
    diagnostic_puzzle:
      presentation: "38-year-old woman with a sudden severe headache 4 days ago, dismissed as 'just a headache' and partly relieved by analgesics, now with mild neck stiffness."
      expected_agent_confidence: 0.42
  common_followups:
    - trigger_action: "request_ct_angiography"
      tool_name: "order_ct_scan"
      description: "CTA of the head and neck after the non-contrast CT: aneurysm site, size, neck and branches; no dissection in the neck vessels"
    - trigger_action: "request_digital_subtraction_angiography"
      tool_name: "order_advanced_imaging"
      description: "Diagnostic catheter angiography with 3D rotational imaging before securing (anatomy consistent with the CTA, dome-to-neck ratio, branches, other aneurysms, vasospasm); never reports coiling, clipping or an occlusion class"
    - trigger_action: "request_transcranial_doppler"
      tool_name: "order_advanced_imaging"
      description: "Optional admission-baseline TCD dated to the day of presentation; velocities only, no clinical notes"
    - trigger_action: "request_echocardiogram"
      tool_name: "order_echocardiogram"
      description: "Echocardiogram when troponin is raised or the ECG shows neurogenic changes: LVEF and the wall-motion pattern (a mild apical hypokinesis with preserved EF is not called Takotsubo)"
    - trigger_action: "request_order_cardiac_monitoring"
      tool_name: "order_cardiac_monitoring"
      description: "Telemetry from arrival to assessment (2 to 6 hours): rhythm, rate range, quantified ectopy and QTc; no management words, never a 24-hour report"

migraine_with_aura:
  name: "Migraine with aura"
  abbreviation: "MIG-AURA"
  icd_code: "G43.1"
  description: "Recurrent disabling headache with reversible focal neurological aura (visual, sensory, or language), requiring exclusion of secondary causes"
  typical_demographics:
    age_range: [18, 50]
    sex_bias: "female_predominant"
  encounter_type: "outpatient"
  # Clinical tool review, July 2026: the structured ICHD-3 history/examination is the actual
  # required migraine act and uses the true >=3-of-6 rule. MRI and labs are selected only for
  # documented red flags. ECG and CSF are removed. The sole EEG case has a witnessed seizure;
  # the three echo cases are two infarct mechanisms and MELAS cardiomyopathy screening, not
  # routine migraine investigations.
  # October 2026 close-out (criteria_packs/MIG-AURA.md): MRI only for red flags and never in a
  # typical-aura S case; vessel imaging (MRA, MRV) is its own order_advanced_imaging study and a
  # brain MRI report never describes vessels; literature is optional and last; the drug check uses
  # {"drug": ...} and is required only for a concrete interaction or contraindication; genetic
  # counselling and hemiplegic migraine gene testing are musts, not tool calls. A single attack is
  # ICHD-3 1.5.2 probable migraine with aura.
  required_modalities: [clinical_assessment]
  optional_modalities: [MRI, LABS, echo, cardiac_monitoring, EEG, advanced_imaging, specialized_test]
  key_findings:
    mri:
      straightforward:
        - "Normal brain MRI (only when a red flag justified it)"
        - "No acute infarct on DWI (DWI excludes infarction, not TIA)"
        - "No structural lesion (AVM, tumour, cavernoma)"
        - "Possible incidental non-specific subcortical white matter hyperintensities (common in migraine)"
      moderate:
        - "Small non-specific punctate frontal subcortical white matter T2 hyperintensities, no anterior temporal or external capsule involvement"
        - "No restricted diffusion"
      diagnostic_puzzle:
        - "Cortical infarct in the territory of a prolonged aura (migrainous infarction only if the aura persisted beyond 60 min; otherwise an embolic or other cause)"
        - "Confluent anterior temporal pole and external capsule white matter hyperintensities: CADASIL pattern"
        - "Cortical stroke-like lesion crossing vascular territories with a lactate peak on spectroscopy: MELAS"
        - "Posterior fossa AVM or cavernoma presenting with aura-like episodes"
    labs:
      # Labs are optional unless a red flag or a work-up calls for them; never a default panel.
      all_difficulties:
        - "ESR and CRP normal in a first aura after 50 (giant cell arteritis question)"
        - "Antiphospholipid panel only in an infarct work-up: lupus anticoagulant (dRVVT) negative, anticardiolipin and anti-beta2-glycoprotein I IgG and IgM below 20 units"
        - "Lactate and CK only when MELAS is in question"
  differential_diagnoses:
    - diagnosis: "Transient ischemic attack"
      key_distinguishing: "Sudden onset, negative symptoms (field loss rather than a spreading scotoma), no march or succession, older age, vascular risk factors; DWI is normal in TIA, so the distinction is clinical"
    - diagnosis: "Focal seizure with visual phenomena"
      key_distinguishing: "Stereotyped, brief (<1-2 min), structured hallucinations rather than spreading scotoma, EEG abnormality"
    - diagnosis: "AVM or cavernoma"
      key_distinguishing: "Structural lesion on MRI, fixed neurological findings, hemorrhage history"
    - diagnosis: "MELAS (mitochondrial disease)"
      key_distinguishing: "Stroke-like episodes, elevated lactate, maternal inheritance, MRI non-vascular territory signal"
    - diagnosis: "Brain tumor"
      key_distinguishing: "Progressive symptoms, mass on MRI with enhancement, no aura spreading pattern"
  difficulty_variants:
    straightforward:
      presentation: "28-year-old woman with 5-year history of typical visual aura (fortification spectra spreading over 20-30 min) followed by unilateral throbbing headache with nausea; normal examination."
      expected_agent_confidence: 0.85
    moderate:
      presentation: "35-year-old woman presenting with right arm tingling spreading to the face over 10 minutes, then severe headache; a similar but milder episode a year ago; normal examination. Imaging not yet done."
      expected_agent_confidence: 0.62
    diagnostic_puzzle:
      presentation: "42-year-old woman with episodic expressive language difficulty building over 5-10 minutes and lasting 15-20 minutes, followed by headache; questioned TIA. Imaging not yet done."
      expected_agent_confidence: 0.38
  common_followups:
    - trigger_action: "request_prolonged_eeg"
      tool_name: "analyze_eeg"
      description: "Video-EEG only when an actual seizure event requires classification; not for routine aura"
    - trigger_action: "request_thrombophilia_panel"
      tool_name: "interpret_labs"
      description: "Antiphospholipid panel only in a documented infarction workup (not a coagulation screen, not routine)"
    - trigger_action: "request_mitochondrial_workup"
      tool_name: "interpret_labs"
      description: "Serum lactate and CK only if MELAS is suspected"
    - trigger_action: "request_mtdna_m3243ag"
      tool_name: "order_specialized_test"
      description: "genetic_panel:mitochondrial, m.3243A>G heteroplasmy on urine or buccal cells, after the MRI shows a stroke-like lesion; report states sample and heteroplasmy level"
    - trigger_action: "request_mr_angiography"
      tool_name: "order_advanced_imaging"
      description: "MR_angiography as its own study only for motor aura, exertional or thunderclap onset, an infarct or an aneurysm question; the brain MRI report never describes vessels"

frontotemporal_dementia:
  name: "Frontotemporal dementia"
  abbreviation: "FTD"
  icd_code: "G31.09"
  description: "Neurodegenerative syndrome with early prominent behavioral and executive dysfunction due to frontal and anterior temporal lobe degeneration"
  typical_demographics:
    age_range: [50, 70]
    sex_bias: null
  encounter_type: "outpatient"
  # Clinical tool review, July 2026: validated neuropsychological testing REQUIRED
  # (specialized_test) and cognitive assessment REQUIRED; advanced_imaging required->optional and
  # narrowed to FDG-PET or perfusion SPECT; CT optional as the MRI alternative
  required_modalities: [clinical_assessment, MRI, LABS, specialized_test]
  # CT appears in 2 cases for different explicit reasons: FTD-M09 presents acutely in the ED
  # and needs haemorrhage/mass exclusion before the dementia work-up; FTD-S06 cannot tolerate
  # MRI because of severe claustrophobia and uses non-contrast CT as the reviewed alternative.
  optional_modalities: [advanced_imaging, CT]
  # October 2026 review round (plans/FTD-decisions.md, criteria_packs/FTD.md): literature search
  # is never a clinical step (optional, last, general text only); check_drug_interactions only for
  # a concrete interaction, never as a toxicity test (lithium and valproate levels are
  # interpret_labs); FDG-PET or perfusion SPECT is recommended when the MRI is normal or equivocal
  # (the imaging support probable bvFTD needs), optional otherwise; bedside screen scores belong to
  # the clinical-assessment output, not to the examination; PPA cases (G31.01) are scored against
  # the Gorno-Tempini features, add a speech-language evaluation and are not labelled bvFTD;
  # presentations carry no result of a scored study.
  key_findings:
    mri:
      straightforward:
        - "Frontotemporal atrophy — bilateral frontal and anterior temporal lobe volume loss"
        - "Relatively preserved parietal and occipital cortex (distinguishes from Alzheimer's)"
        - "Knife-blade atrophy of frontal gyri on coronal sequences"
        - "Caudate atrophy may be present"
        - "No mass lesion, no infarcts"
      moderate:
        - "Asymmetric frontal atrophy (right > left) with relatively preserved medial temporal lobes"
        - "Mild to moderate bifrontal volume loss, could overlap with normal aging"
        - "Some periventricular white matter changes"
      diagnostic_puzzle:
        - "Minimal structural atrophy — early FTD, especially in young-onset"
        - "Asymmetric anterior temporal atrophy (left in svPPA, right in the right temporal variant) that can be mistaken for Alzheimer-type medial temporal atrophy"
        - "Normal MRI in 10-15% of bvFTD (especially C9orf72 expansion carriers)"
    labs:
      all_difficulties:
        - "CBC: normal"
        - "Complete metabolic panel including renal and hepatic function: normal"
        - "Thyroid function (TSH): normal"
        - "Vitamin B12: normal"
        - "Folate: normal"
        - "ESR and CRP: no inflammatory signal"
        - "Infectious, autoimmune, toxic, nutritional and genetic studies are targeted to the presentation rather than fixed"
    advanced_imaging:
      straightforward:
        - "FDG-PET: severe frontal and anterior temporal hypometabolism"
        - "Relative preservation of posterior cortex (posterior cingulate sign absent — differs from Alzheimer's)"
        - "Bilateral frontotemporal hypometabolism with subcortical involvement"
      moderate:
        - "FDG-PET: asymmetric right frontotemporal hypometabolism"
        - "Mild bilateral frontal hypometabolism — needs clinical correlation"
      diagnostic_puzzle:
        - "FDG-PET or perfusion SPECT: frontal dysfunction may be subtle or borderline and must be interpreted with the clinical syndrome"
        - "Amyloid PET is reserved for a specific active Alzheimer-pathology differential, not routine FTD imaging"
    specialized_test:
      straightforward:
        - "Neuropsychological testing: severely impaired executive function (go/no-go, trails B)"
        - "Relatively preserved episodic memory initially (differs from Alzheimer's)"
        - "Social cognition deficits: impaired faux pas, theory of mind tasks"
        - "Language: effortful speech in PNFA or semantic loss in SD variant"
      moderate:
        - "Neuropsychological: prominent executive dysfunction with some episodic memory impairment"
        - "Borderline performance on frontal lobe tasks"
      diagnostic_puzzle:
        - "Neuropsychological: mixed pattern, cannot clearly differentiate from Alzheimer's"
        - "Normal or near-normal on structured testing despite behavioral changes (poor sensitivity)"
  differential_diagnoses:
    - diagnosis: "Alzheimer's disease"
      key_distinguishing: "Episodic memory predominant, hippocampal > frontal atrophy, amyloid PET positive, CSF Aβ42 low"
    - diagnosis: "Primary psychiatric disorder (bipolar, schizophrenia)"
      key_distinguishing: "Onset often before age 40, no atrophy on MRI, normal FDG-PET, no progressive course"
    - diagnosis: "Normal pressure hydrocephalus (NPH)"
      key_distinguishing: "Gait apraxia, urinary incontinence, ventriculomegaly disproportionate to atrophy"
    - diagnosis: "Creutzfeldt-Jakob disease (CJD)"
      key_distinguishing: "Rapid progression (<1 year), myoclonus, cortical ribboning on DWI, CSF RT-QuIC positive"
    - diagnosis: "Primary progressive aphasia"
      key_distinguishing: "Language-predominant, asymmetric left perisylvian atrophy, preserved behavior early"
  difficulty_variants:
    straightforward:
      presentation: "58-year-old accountant brought by his wife with a 2-year personality change: disinhibition, compulsive eating, loss of empathy, poor hygiene; he has left work. No imaging or test results in the presentation."
      expected_agent_confidence: 0.82
    moderate:
      presentation: "64-year-old with 1-year progressive apathy, social withdrawal, and perseverative behavior; the psychiatrist considers depression and an antidepressant has not helped. Imaging and neuropsychology are pathway results, not history."
      expected_agent_confidence: 0.58
    diagnostic_puzzle:
      presentation: "54-year-old with 18-month behavioral changes referred as 'depression vs personality disorder'; a father whose psychiatric illness began in his 50s. The MRI is normal or equivocal and FDG-PET (recommended) supplies the imaging support; C9orf72 is an optional counselled test, never pending in the history."
      expected_agent_confidence: 0.32
  common_followups:
    - trigger_action: "request_fdg_pet_or_perfusion_spect"
      tool_name: "order_advanced_imaging"
      description: "Optional FDG-PET, or brain perfusion SPECT when FDG-PET is unavailable, after the core assessment if subtype remains uncertain"
    - trigger_action: "request_genetic_panel"
      tool_name: "order_specialized_test"
      description: "Optional counselled C9orf72/GRN/MAPT panel (genetic_panel:FTD) in bvFTD with onset before 65; counselling is a must only with onset before 55, a suggestive family history or MND; a pathogenic C9orf72 result is also authored on genetic_panel:ALS; not required for the clinical syndrome diagnosis"
    - trigger_action: "request_speech_language_evaluation"
      tool_name: "order_specialized_test"
      description: "PPA cases only: speech_language_evaluation of naming, single-word comprehension, object knowledge, irregular-word reading, repetition, grammar and motor speech, without naming the variant"
    - trigger_action: "request_drug_level"
      tool_name: "interpret_labs"
      description: "Targeted level where the medication list makes toxicity a mimic: lithium_level (with creatinine and TSH from the baseline panel), or valproate_level and ammonia"
    - trigger_action: "request_comprehensive_neuropsych"
      tool_name: "order_specialized_test"
      description: "Comprehensive neuropsychological battery including social cognition measures"

status_epilepticus:
  name: "Status epilepticus"
  abbreviation: "SE"
  icd_code: "G41.9"
  description: "Prolonged or repetitive seizure activity (≥5 min for convulsive SE) without full recovery between episodes, requiring emergency treatment"
  typical_demographics:
    age_range: [18, 75]
    sex_bias: null
  encounter_type: "emergency"
  # Clinical tool review, July 2026: tiers confirmed unchanged; all five annotations are
  # description-level (cEEG duration and review frequency, ASM levels, CT timing after
  # stabilisation, venous-phase imaging)
  required_modalities: [EEG, LABS, CT]
  optional_modalities: [MRI, CSF]
  key_findings:
    eeg:
      straightforward:
        - "Continuous generalized rhythmic epileptiform discharges >5 minutes (convulsive SE)"
        - "OR: Non-convulsive SE (NCSE) — continuous or near-continuous electrographic seizures"
        - "Ictal pattern: rhythmic spike-wave at 2-4 Hz, evolving frequency, amplitude, morphology"
        - "Postictal suppression between bursts in post-convulsive phase"
        - "Equivocal NCSE only: a diagnostic benzodiazepine trial under EEG (Salzburg criteria), stored as its own follow-up; no EEG reports the response to treatment"
      moderate:
        - "Lateralized periodic discharges (LPDs, ACNS 2021 terminology) on the ictal-interictal continuum"
        - "Generalized periodic discharges (GPDs) with fluctuating consciousness"
        - "Subtle NCSE pattern: rhythmic delta with embedded spikes"
      diagnostic_puzzle:
        - "Ictal-interictal continuum — GPDs or LPDs without clear ictal pattern"
        - "Burst-suppression pattern post-anoxia vs sedation vs NCSE"
        - "Normal EEG between seizures in PNES/psychogenic non-epileptic status"
    labs:
      all_difficulties:
        # Values, units, ranges and flags only; each analyte once, in its own panel. No "Exclusion
        # studies" or "Mimic exclusion" block of unvalued "within reference range" analytes (October
        # 2026 review, class C1), and no interpretation such as "stress response" in the report.
        - "Point-of-care glucose, then BMP with sodium, calcium and magnesium, renal and hepatic function"
        - "CBC"
        - "ASM levels only in a patient already taking an ASM"
        - "Toxicology screen when the cause is not evident from the history (routine screens do not detect isoniazid)"
        - "Lactate and CK raised after convulsive SE, consistent with the duration of the convulsions"
        - "Troponin only where cardiac injury is in question"
        - "Ammonia only in liver disease or valproate use; coagulation only on anticoagulants, liver disease or HELLP"
        - "beta-hCG only in women of reproductive age without a known pregnancy"
        - "Blood cultures only where infection is suspected (fever with a source, leukocytosis, immunosuppression with sepsis); seizure-related hyperthermia within hours of convulsions is not an indication"
    ct:
      straightforward:
        - "CT head without contrast: exclude structural cause (hemorrhage, mass)"
        - "Hemorrhagic contusion or new mass lesion precipitating SE"
        - "No acute intracranial hemorrhage (metabolic or toxic SE)"
      moderate:
        - "CT shows old infarct or prior craniotomy (known epileptogenic substrate)"
        - "No new acute finding — SE due to medication non-compliance"
      diagnostic_puzzle:
        - "Normal CT — does not exclude encephalitis, autoimmune SE, or subtle cortical lesions"
        - "Post-ictal cerebral edema on CT (diffuse sulcal effacement)"
    mri:
      straightforward:
        - "DWI restriction in cortical ribbon pattern (unilateral) — ictal edema"
        - "FLAIR cortical hyperintensity corresponding to seizure focus"
        - "Limbic encephalitis pattern: bilateral mesial temporal FLAIR signal"
      moderate:
        - "Subtle DWI changes resolving after seizure cessation (reversible ictal changes)"
        - "Multifocal cortical T2/FLAIR changes — autoimmune vs ischemic"
      diagnostic_puzzle:
        - "Normal MRI — does not exclude NCSE or autoimmune encephalitis early"
        - "DWI changes mimicking stroke (ictal DWI pseudostroke)"
    csf:
      straightforward:
        - "Mild pleocytosis after SE is usually under 10 cells/uL; a higher count needs another cause"
        - "Anti-NMDAR, anti-LGI1, anti-GABA-B antibodies — autoimmune SE workup"
        - "HSV PCR: positive in HSV encephalitis-associated SE"
      moderate:
        - "Normal cell count, protein and glucose (does not exclude early HSV or LGI1 encephalitis; antibodies pending)"
        - "Mild protein elevation — post-ictal blood-brain barrier disruption"
      diagnostic_puzzle:
        - "CSF pleocytosis — infectious vs autoimmune vs post-ictal unclear"
        - "Autoimmune antibody panel pending — empiric immunotherapy decision required"
  differential_diagnoses:
    - diagnosis: "Psychogenic non-epileptic status (PNES)"
      key_distinguishing: "No EEG correlate during clinical events, eyes closed, prolonged, variable semiology, unaffected by AEDs"
    - diagnosis: "Autoimmune encephalitis"
      key_distinguishing: "Subacute onset, psychiatric prodrome, autoimmune antibodies, limbic MRI changes"
    - diagnosis: "Metabolic encephalopathy"
      key_distinguishing: "Triphasic waves on EEG, no ictal pattern, metabolic derangement (hepatic, uremic, hyponatremia)"
    - diagnosis: "Drug toxicity (serotonin syndrome, TCA)"
      key_distinguishing: "Drug exposure history, hyperreflexia, clonus, hyperthermia, toxicology positive"
    - diagnosis: "Hypoxic-ischemic encephalopathy"
      key_distinguishing: "Preceding cardiac arrest or hypoxic event, burst-suppression EEG, DWI cortical/basal ganglia changes"
  difficulty_variants:
    straightforward:
      presentation: "40-year-old with known epilepsy on valproate, who ran out of tablets 3 days ago, found convulsing continuously for 15 minutes."
      expected_agent_confidence: 0.88
    moderate:
      presentation: "65-year-old found confused and minimally responsive after witnessed brief shaking. Now 'awake' but disoriented, with intermittent subtle eyelid twitching."
      expected_agent_confidence: 0.62
    diagnostic_puzzle:
      presentation: "55-year-old with new-onset unresponsiveness, intermittent eye deviation and subtle lip-smacking, with no clear convulsion."
      expected_agent_confidence: 0.38
  # October 2026 review: the initial EEG output is the continuous video-EEG (eeg_type continuous_icu),
  # so there is no cEEG follow-up (its trigger shared the token "continuous" with continuous_icu and
  # served post-treatment EEGs, class C4); no ASM-level follow-up after loading (a treatment effect,
  # ruling 4); a follow-up exists only when a criterion orders it. Triggers must not share a token
  # with the core EEG or lab orders.
  common_followups:
    - trigger_action: "request_autoimmune_encephalitis_panel"
      tool_name: "interpret_labs"
      description: "Second-tier serum autoimmune or paraneoplastic antibody panel, only where autoimmune or paraneoplastic encephalitis is in the differential and a criterion orders it"
    - trigger_action: "request_mri_brain_contrast"
      tool_name: "analyze_brain_mri"
      description: "MRI brain with gadolinium when SE is new-onset, unexplained or refractory, or encephalitis, autoimmune disease or tumor is suspected; not required when the cause is already established"
    - trigger_action: "request_lumbar_puncture"
      tool_name: "analyze_csf"
      description: "CSF (cells, protein, glucose, HSV PCR, antibodies as indicated) when the cause is unclear, without delay with fever or immunosuppression, after head CT; only where a CSF criterion exists. LP is an avoided action with mass effect or midline shift, platelets below 50 x10^9/L or uncorrected coagulopathy"

vascular_dementia:
  name: "Vascular dementia (major vascular cognitive disorder)"
  abbreviation: "VASC-DEM"
  icd_code: "F01.50"
  description: "Major vascular cognitive disorder: cognitive decline attributable to cerebrovascular disease — subcortical small-vessel ischaemia, multiple cortical infarcts, a single strategic infarct, cerebral amyloid angiopathy, or mixed with Alzheimer pathology"
  typical_demographics:
    age_range: [55, 88]
    sex_bias: "slight_male"
  encounter_type: "outpatient"
  # Clinical tool review, July 2026. Replaces `peripheral_neuropathy`, which both reviewers
  # judged too broad a category to score ("SOSTITUIRE PATOLOGIA", Reviewer 1, severity error),
  # and completes the four major dementias — AD, FTD, DLB, VaD — so the benchmark can score the
  # differential among them, which was the reviewers' stated reason for asking.
  #
  # Tiers follow the rule the reviewers applied everywhere else: REQUIRED only where the
  # governing guideline makes the step mandatory for the diagnosis itself.
  #   clinical_assessment (cognitive_screen) — VASCOG 2014 and DSM-5 both require impairment
  #     documented on a validated instrument; the executive/processing-speed-predominant profile
  #     with relatively spared recognition memory is the discriminator against AD
  #   MRI — the vascular attribution IS the imaging: STRIVE-2 markers (confluent WMH, lacunes,
  #     microbleeds, cortical superficial siderosis, atrophy pattern). CT only where MRI is
  #     contraindicated, and then it cannot see microbleeds — that limitation is scored
  #   LABS — reversible mimics (TSH, B12, folate; RPR and HIV with a risk factor) plus the vascular risk factors that
  #     change management (HbA1c, lipid panel)
  # ECG, cardiac monitoring and echocardiography stay OPTIONAL at panel level and are required
  # per case only where the infarct pattern is embolic, because that is where an occult source
  # changes treatment from risk-factor control to anticoagulation. Same for carotid duplex/MRA:
  # required only where a large-artery source is in play.
  # October 2026 review round (plans/VASC-DEM.md, VASC-DEM-decisions.md; the criteria pack is the
  # authority): ECG after any ischaemic infarct (recommended at least); TTE is never waste after an
  # ischaemic infarct; no literature step and no generic drug check; the MRI criterion has no
  # `sequences`/`protocol` arguments; RPR and HIV only with a risk factor. Presentations give the
  # clinical picture only: the screen score, imaging and lab results are what the agent orders.
  # Findings below are written as what each modality reports, never the diagnosis, the severity
  # verdict or management.
  required_modalities: [clinical_assessment, MRI, LABS]
  optional_modalities: [CT, ECG, advanced_imaging, specialized_test, cardiac_monitoring, echo, CSF]
  key_findings:
    clinical_assessment:
      straightforward:
        - "MoCA 19/30 with the loss concentrated in trail-making, digit span backwards and verbal fluency; delayed recall improves with cueing"
        - "Executive/processing-speed profile out of proportion to the memory deficit (opposite of the AD profile)"
        - "Stepwise history corroborated by an informant; abrupt worsening dated to a documented event"
        - "Timed-up-and-go prolonged with short-stepped, wide-based gait and preserved arm swing"
      moderate:
        - "MoCA 24/30, borderline, executive items disproportionately affected"
        - "Mixed profile: both amnestic and executive deficits, attribution unclear on testing alone"
        - "Gradual rather than stepwise decline reported, which does not exclude small-vessel disease"
      diagnostic_puzzle:
        - "MoCA 26/30 in a high-baseline patient whose informant reports loss of complex activities"
        - "Prominent apathy and slowed processing mistaken by the family for depression"
        - "Fluctuating attention on repeat testing (raises DLB) without visual hallucinations or parkinsonism"
    mri:
      straightforward:
        - "Confluent periventricular and deep white matter hyperintensity, Fazekas 3"
        - "Multiple lacunes in basal ganglia, thalamus and pons (>3 cavitated lesions)"
        - "Enlarged basal-ganglia perivascular spaces; no restricted diffusion (all lesions chronic)"
        - "Multiple chronic cortical and cortico-subcortical infarcts in more than one arterial territory"
        - "Strategic infarct: left anterior thalamus / genu of the internal capsule / angular gyrus"
        - "Deep cerebral microbleeds on SWI in a hypertensive distribution (thalamus, basal ganglia, pons)"
        - "Medial temporal lobes relatively preserved for age (Scheltens 0-1)"
      moderate:
        - "Moderate white matter hyperintensity, Fazekas 2, early confluence"
        - "One or two lacunes plus mild global atrophy"
        - "Hippocampal atrophy Scheltens 2 alongside Fazekas 2 white matter hyperintensity"
      diagnostic_puzzle:
        - "Strictly lobar microbleeds with cortical superficial siderosis and posterior WMH; findings fulfil Boston criteria v2.0 for probable cerebral amyloid angiopathy"
        - "Severe confluent WMH with anterior temporal pole and external capsule involvement in a patient under 60"
        - "Fazekas 3 burden in a patient whose cognitive screen is near normal"
        - "Bilateral cortical and internal border-zone infarcts in a patient with a documented hypotensive episode"
    labs:
      all_difficulties:
        - "CBC: within sex-specific reference ranges (Hct about 3 x Hb)"
        - "CMP: creatinine and eGFR (CKD-EPI 2021) consistent with age and sex; liver tests normal"
        - "TSH: within range"
        - "Vitamin B12: normal or low-normal; folate normal"
        - "RPR and HIV only where a risk factor makes them indicated: non-reactive, negative"
        - "HbA1c: elevated (7-9%) in a patient with long-standing diabetes"
        - "Lipid panel: elevated LDL, low HDL; total cholesterol = LDL + HDL + TG/5"
      moderate:
        - "HbA1c borderline (5.9-6.4%); LDL 70-100 mg/dL on a statin already prescribed"
        - "B12 low-normal (180-250 pg/mL), prompting methylmalonic acid"
      diagnostic_puzzle:
        - "Every reversible-cause lab normal"
        - "ESR/CRP mildly elevated without other inflammatory markers"
    advanced_imaging:
      straightforward:
        - "Carotid duplex: >50% stenosis of the internal carotid artery ipsilateral to the cortical infarcts"
        - "MR angiography: intracranial large-artery stenosis; no dissection"
      moderate:
        - "Carotid duplex: 30-49% plaque, not flow-limiting"
        - "FDG-PET: patchy multifocal hypometabolism following the white matter lesions rather than a temporoparietal pattern"
      diagnostic_puzzle:
        - "Amyloid PET: positive visual read (cortical tracer uptake in two or more regions)"
        - "FDG-PET: temporoparietal and posterior cingulate hypometabolism, consistent with an Alzheimer-type metabolic profile"
    csf:
      moderate:
        - "Abeta42 borderline, Abeta42/40 ratio normal, phospho-tau normal"
      diagnostic_puzzle:
        - "Abeta42/40 ratio low with phospho-tau181 raised"
        - "Normal cell count and protein"
        - "Cerebral amyloid angiopathy: Abeta40 and Abeta42 both reduced"
    ecg:
      straightforward:
        - "Atrial fibrillation with controlled ventricular response"
        - "Left ventricular hypertrophy with a strain pattern (chronic hypertension)"
      moderate:
        - "Sinus rhythm with frequent atrial ectopy"
      diagnostic_puzzle:
        - "Sinus rhythm, normal intervals"
  differential_diagnoses:
    - diagnosis: "Alzheimer's disease"
      key_distinguishing: "Insidious amnestic-predominant decline, recall not helped by cueing, medial temporal atrophy out of proportion to vascular burden, amyloid biomarkers positive"
    - diagnosis: "Mixed Alzheimer and vascular dementia"
      key_distinguishing: "Both hippocampal atrophy and a significant vascular burden, or positive amyloid biomarkers with confluent white matter disease — a distinct diagnosis, not a tie-break"
    - diagnosis: "Dementia with Lewy bodies"
      key_distinguishing: "Fluctuating cognition, well-formed visual hallucinations, spontaneous parkinsonism, REM sleep behaviour disorder, reduced DaTscan uptake"
    - diagnosis: "Frontotemporal dementia (behavioural variant)"
      key_distinguishing: "Early disinhibition and loss of empathy with frontotemporal atrophy and no vascular burden"
    - diagnosis: "Normal pressure hydrocephalus"
      key_distinguishing: "Ventriculomegaly with Evans index >0.3 and a disproportionately enlarged subarachnoid space, gait-first triad, objective improvement after a tap test"
    - diagnosis: "Cerebral amyloid angiopathy"
      key_distinguishing: "Strictly lobar microbleeds and cortical superficial siderosis on SWI, lobar haemorrhage history; a vascular cause in which anticoagulation is avoided where possible"
    - diagnosis: "CADASIL"
      key_distinguishing: "Onset under 60, migraine with aura, family history of stroke or dementia, anterior temporal pole and external capsule white matter involvement, NOTCH3 variant"
    - diagnosis: "Depression (pseudodementia)"
      key_distinguishing: "Prominent low mood and effort-dependent performance, deficits improving with treatment, imaging burden not explaining the severity"
  difficulty_variants:
    straightforward:
      presentation: "74-year-old with 30 years of hypertension and type 2 diabetes, brought by his daughter after a stepwise decline over 3 years dated to two episodes of transient weakness; she now manages his medicines and finances. Short-stepped gait, brisk reflexes, slow to initiate answers."
      expected_agent_confidence: 0.82
    moderate:
      presentation: "69-year-old with 2 years of gradual slowing, apathy, forgetfulness and word-finding difficulty. Treated hypertension. Her husband reports missed appointments and that he has taken over the bills."
      expected_agent_confidence: 0.55
    diagnostic_puzzle:
      presentation: "58-year-old with 18 months of executive decline, a long history of migraine with aura and a mother who developed dementia at 62 after two strokes. Blood pressure normal, no diabetes."
      expected_agent_confidence: 0.35
  common_followups:
    - trigger_action: "request_carotid_duplex"
      tool_name: "order_advanced_imaging"
      description: "Carotid duplex ultrasound for extracranial large-artery stenosis as the infarct mechanism"
    - trigger_action: "request_mr_angiography"
      tool_name: "order_advanced_imaging"
      description: "MR angiography of the head and neck for intracranial stenosis or dissection"
    - trigger_action: "request_fdg_pet"
      tool_name: "order_advanced_imaging"
      description: "FDG-PET to separate a temporoparietal Alzheimer pattern from patchy vascular hypometabolism"
    - trigger_action: "request_amyloid_pet"
      tool_name: "order_advanced_imaging"
      description: "Amyloid PET where mixed Alzheimer and vascular pathology is the question"
    - trigger_action: "request_csf_biomarkers"
      tool_name: "analyze_csf"
      description: "CSF Abeta42, Abeta42/40 ratio and phospho-tau for coexisting Alzheimer biology (not where LP is declined or anticoagulation would need interrupting; waste in CAA)"
    - trigger_action: "request_prolonged_cardiac_monitoring"
      tool_name: "order_cardiac_monitoring"
      description: "Extended ambulatory monitoring for paroxysmal atrial fibrillation after embolic-pattern infarcts with a sinus-rhythm ECG (pacemaker interrogation where a device is present)"
    - trigger_action: "request_neuropsych_battery"
      tool_name: "order_specialized_test"
      description: "Formal neuropsychological battery to document the domain profile and track it"
    - trigger_action: "request_notch3_panel"
      tool_name: "order_specialized_test"
      description: "NOTCH3 sequencing where hereditary small-vessel disease is suspected"

normal_pressure_hydrocephalus:
  name: "Normal pressure hydrocephalus"
  abbreviation: "NPH"
  icd_code: "G91.2"
  description: "Hakim's triad of gait apraxia, urinary incontinence, and cognitive impairment with ventriculomegaly disproportionate to cortical atrophy"
  typical_demographics:
    age_range: [60, 80]
    sex_bias: "slight_male"
  encounter_type: "inpatient"
  # Clinical tool review, July 2026: specialized_test replaced by clinical_assessment: the
  # required act is objective gait and cognition before and after the tap test, not the generic
  # test bucket. LABS required->optional. Advanced imaging and the standalone
  # neuropsychological battery were removed as requested; neither is a gold NPH study.
  # October 2026 round (plans/NPH.md, NPH-decisions.md): no literature or drug-check step
  # (anticoagulant handling is a must, ASRA 2025); the patient block gives no Evans index,
  # callosal angle, DESH, TUG, MoCA or referral diagnosis; reports give their own modality's
  # findings with no iNPH, shunt or tap verdict; the baseline gait report never contains the
  # post-tap values, which come from the CSF tap report and a separate reassessment follow-up.
  required_modalities: [MRI, CSF, clinical_assessment]
  optional_modalities: [LABS]
  key_findings:
    mri:
      straightforward:
        - "Communicating ventriculomegaly with Evans index above 0.3, no obstructing lesion or aqueductal stenosis"
        - "DESH: tight high-convexity and medial parietal sulci with enlarged Sylvian fissures"
        - "Corpus callosum thinning and upward bowing"
        - "Periventricular T2/FLAIR signal with its Fazekas grade"
        - "Aqueductal flow void; fourth ventricle normal or mildly enlarged"
        - "Acute callosal angle (below 90 degrees on the coronal plane through the posterior commissure), supportive, not diagnostic"
        - "Temporal horns enlarged out of proportion to the hippocampi (MTA score stated)"
      moderate:
        - "Evans index just above 0.3 (0.31 to 0.33); 0.30 exactly does not meet the criterion"
        - "Mild-to-moderate ventriculomegaly with some cortical atrophy"
        - "No DESH; at least one other supportive feature (acute callosal angle or temporal horn enlargement)"
        - "Callosal angle 90 to 100 degrees"
      diagnostic_puzzle:
        - "Ventriculomegaly with prominent cortical atrophy (atrophy ex vacuo vs iNPH)"
        - "Secondary NPH after trauma, subarachnoid haemorrhage, meningitis or subdural haematoma (the antecedent is in the history; the MRI shows its residue)"
        - "Concurrent neurodegenerative disease (Alzheimer's, Parkinson's, PSP or bvFTD with iNPH)"
    labs:
      all_difficulties:
        - "Targeted, optional panel: CBC, BMP, TSH, vitamin B12 (with MMA when B12 is low-normal), RPR where indicated"
        - "Values, units, reference ranges and flags only; no interpretation of what a value rules out"
        - "Coagulation and platelets where a bleeding risk affects the lumbar tap"
    csf:
      straightforward:
        - "Opening pressure 7 to 24.5 cmH2O (70 to 245 mmH2O, Relkin 2005; 20 cmH2O or less in the Japanese guideline)"
        - "WBC below 5 cells/uL"
        - "Protein and glucose normal"
        - "Tap test figures: volume removed (30 to 50 mL), TUG and 10-m walk before the tap, at 2 to 4 hours and at 24 hours, with % change; no positive or negative verdict"
      moderate:
        - "Opening pressure normal"
        - "Tap test: small objective change in TUG with a concordant 10-m walk change"
        - "Cognitive screen change after the tap less clear than the gait change"
      diagnostic_puzzle:
        - "Single tap with no objective gait change (tap sensitivity 26 to 61%, so extended lumbar drainage is the next study)"
        - "Opening pressure at the upper end of normal (18 to 22 cmH2O)"
    clinical_assessment:
      straightforward:
        - "Baseline gait report: magnetic gait, short steps, wide base, reduced step height, en-bloc turns; TUG, 10-m walk time and steps, turn steps"
        - "Baseline only: no post-tap value and no verdict in the baseline report"
        - "Post-tap reassessment (separate follow-up): the same measures at 2 to 4 and 24 hours with % change, identical to the CSF report"
      moderate:
        - "Gait analysis: mild magnetic gait component"
        - "Cognitive screen (MoCA) with executive, attention and delayed-recall deficits and cueing benefit"
      diagnostic_puzzle:
        - "Gait impairment partly attributable to an orthopaedic or spinal cause documented in the history"
        - "Post-tap reassessment with no objective change"
  differential_diagnoses:
    - diagnosis: "Alzheimer's disease"
      key_distinguishing: "Episodic-memory-predominant syndrome, hippocampal atrophy, and no early gait apraxia; use targeted AD biomarkers only when copathology remains a specific question"
    - diagnosis: "Parkinson's disease"
      key_distinguishing: "Resting tremor, cogwheel rigidity, responds to levodopa, DaTscan abnormal, no ventriculomegaly"
    - diagnosis: "Vascular dementia"
      key_distinguishing: "Stepwise decline, lacunar infarcts on MRI, vascular risk factors, periventricular white matter disease"
    - diagnosis: "Cervical myelopathy"
      key_distinguishing: "Upper motor neuron signs, spasticity, Lhermitte sign, cord compression on MRI cervical spine"
    - diagnosis: "Subcortical ischemic vascular disease"
      key_distinguishing: "Prominent white matter hyperintensities, hypertension, stepwise cognitive decline, no Evans index criterion"
  difficulty_variants:
    straightforward:
      presentation: "73-year-old man with 2 years of shuffling gait, urinary urgency and progressive forgetfulness, referred by his GP for the gait difficulty. Outside imaging was reported as showing enlarged ventricles; the images are not available."
      expected_agent_confidence: 0.85
    moderate:
      presentation: "68-year-old with 1 year of gait deterioration and slowed thinking, hypertension and diabetes, no urinary symptoms; referred for progressive gait difficulty."
      expected_agent_confidence: 0.58
    diagnostic_puzzle:
      presentation: "75-year-old with gait decline and memory complaints that began first, a prior working diagnosis of Alzheimer's disease and a family history of dementia; the family asks whether anything treatable has been missed."
      expected_agent_confidence: 0.32
  common_followups:
    - trigger_action: "request_moca_cognitive_screen"
      tool_name: "perform_clinical_assessment"
      description: "Baseline cognitive screen (MoCA with domain subscores), assessment_type cognitive_screen"
    - trigger_action: "request_post_reassessment"
      tool_name: "perform_clinical_assessment"
      description: "Post-tap timed gait reassessment at 2 to 4 and 24 hours (never put 'tap' in the trigger: it captures the baseline call)"
    - trigger_action: "repeat_csf_analysis"
      tool_name: "analyze_csf"
      description: "Extended lumbar drainage after a negative tap (72 hours, about 10 mL/hour, 300 to 500 mL), with daily timed gait; a plain trigger so it is served only on the second CSF call"

hepatic_encephalopathy:
  name: "Hepatic encephalopathy"
  abbreviation: "HEP-ENC"
  icd_code: "K72.9"
  description: "Neuropsychiatric syndrome complicating acute or chronic liver failure, driven by hyperammonemia and cerebral edema"
  typical_demographics:
    age_range: [40, 70]
    sex_bias: "slight_male"
  encounter_type: "emergency"
  # Clinical tool review, July 2026: infection screen with diagnostic paracentesis added as
  # REQUIRED (microbiology; EASL 2022); EEG required->optional (no recommendation makes it
  # routine) and CT required->optional (ACG 2026 suggests AGAINST routine imaging without focal
  # deficits); abdominal shunt imaging added as optional
  required_modalities: [LABS, microbiology]
  optional_modalities: [EEG, CT, MRI, ECG, body_imaging]
  key_findings:
    labs:
      straightforward:
        - "Ammonia: one admission value, often elevated (reference 11-51 μmol/L); it neither grades nor confirms HE and is never repeated to judge response (ACG 2026; EASL 2022)"
        - "LFTs: ALT/AST markedly elevated (>1000 U/L in acute hepatitis), or low/normal in end-stage cirrhosis"
        - "Total bilirubin: markedly elevated"
        - "PT/INR: markedly prolonged (INR >2.0) — hepatic synthetic dysfunction"
        - "Albumin: low (<2.5 g/dL in chronic liver disease)"
        - "BMP: hyponatremia (dilutional), hypokalemia, hypomagnesemia"
        - "Glucose: hypoglycemia (acute liver failure)"
        - "CBC: thrombocytopenia (hypersplenism in cirrhosis), leukocytosis (infection precipitant)"
        - "Infective precipitant when present: ascitic PMN 250 cells/mm3 or more (SBP) or a positive blood or urine culture, reported by microbiology, not in the admission panel"
        - "Toxicology: benzodiazepines, opiates (precipitants in cirrhosis)"
      moderate:
        - "Ammonia: mildly to moderately elevated; poor correlation with grade"
        - "LFTs: elevated but not markedly (AST/ALT 100-300 U/L)"
        - "INR: mildly prolonged (1.5-2.0)"
        - "Identifiable precipitant: GI bleed (elevated BUN), infection, medication, constipation"
      diagnostic_puzzle:
        - "Ammonia normal or only mildly elevated — does not exclude HE (poor correlation with grade)"
        - "Acute-on-chronic setting: unclear what is baseline cognitive function"
        - "Multiple concurrent metabolic derangements (hyponatremia, hypoglycemia, uremia)"
    eeg:
      straightforward:
        - "Triphasic waves (TWs): generalized, fronto-predominant, 1.5-2.5 Hz — characteristic of HE"
        - "Generalized high-amplitude slow activity (2-4 Hz delta) with superimposed faster frequencies"
        - "Background slowing with loss of posterior dominant rhythm"
        - "No true epileptiform discharges (distinguishes from NCSE)"
      moderate:
        - "Generalized slowing with theta-delta activity (4-6 Hz transition range)"
        - "Intermittent triphasic-like waves — not fully classic morphology"
        - "Background disorganization proportional to grade 2-3 HE"
      diagnostic_puzzle:
        - "Triphasic waves also seen in uremic encephalopathy, Wernicke's, septic encephalopathy — non-specific"
        - "NCSE is excluded by the EEG itself (no evolving or rhythmic epileptiform discharges), never by a benzodiazepine challenge"
        - "Normal EEG in minimal/covert HE"
    ct:
      straightforward:
        - "CT head: normal (primary function — exclude structural cause)"
        - "No acute hemorrhage, mass, or infarct"
        - "Cerebral edema (sulcal effacement, loss of gray-white differentiation) in acute liver failure"
      moderate:
        - "CT normal — no structural explanation for encephalopathy"
        - "Chronic changes only: cortical atrophy consistent with chronic liver disease"
      diagnostic_puzzle:
        - "Subdural hematoma (thrombocytopenic patient with head injury during encephalopathy)"
        - "Small hyperdensity — thrombocytopenia-related microhemorrhage vs spontaneous"
    mri:
      straightforward:
        - "T1 hyperintensity in bilateral globus pallidi (manganese deposition in chronic liver disease)"
        - "Diffuse cortical and basal ganglia DWI restriction (acute liver failure — cerebral edema)"
        - "Normal MRI in episodic HE in compensated cirrhosis"
      moderate:
        - "Subtle bilateral globus pallidi T1 hyperintensity"
        - "No DWI restriction — subacute/episodic HE without cerebral edema"
      diagnostic_puzzle:
        - "White matter T2 changes — acquired hepatocerebral degeneration vs concurrent Wernicke's"
        - "Bilateral T2 signal in basal ganglia — acquired hepatolenticular degeneration"
  differential_diagnoses:
    - diagnosis: "Wernicke encephalopathy"
      key_distinguishing: "Thiamine deficiency (alcoholism/malnutrition), classic triad (confusion/ophthalmoplegia/ataxia), MRI periaqueductal and mammillary body T2 signal, responds to thiamine"
    - diagnosis: "Uremic encephalopathy"
      key_distinguishing: "Elevated creatinine/BUN, renal failure history, myoclonus, reversed by dialysis"
    - diagnosis: "Drug intoxication (opiates, benzodiazepines)"
      key_distinguishing: "Toxicology positive, normal LFTs/ammonia, pinpoint pupils, responds to naloxone/flumazenil"
    - diagnosis: "Bacterial meningitis or encephalitis"
      key_distinguishing: "Fever, meningism, CSF pleocytosis, positive cultures, no liver disease history"
    - diagnosis: "Hyponatremia (severe)"
      key_distinguishing: "Na+ <120 mEq/L, osmotic demyelination risk, responds to Na+ correction, no liver failure marker"
  # October 2026 review round: presentations describe the clinical picture only. Ammonia, EEG, CT
  # and other results of scored studies belong in the tool outputs, never in the generated HPI.
  difficulty_variants:
    straightforward:
      presentation: "58-year-old with known alcohol-related cirrhosis found confused and combative, with black tarry stools since the previous day; asterixis on examination."
      expected_agent_confidence: 0.88
    moderate:
      presentation: "52-year-old with NAFLD-related cirrhosis on diuretics, admitted with lethargy, disorientation to time and asterixis; no precipitant evident from the history."
      expected_agent_confidence: 0.62
    diagnostic_puzzle:
      presentation: "45-year-old with known Child-Pugh B cirrhosis presenting with new fluctuating confusion while taking a nightly benzodiazepine and a thiazide diuretic; several possible contributors to separate."
      expected_agent_confidence: 0.38
  # October 2026 review round (plans/HEP-ENC.md CENTRAL 3): request_lactulose_rifaximin,
  # request_sbp_paracentesis (under interpret_labs), request_continuous_eeg (benzodiazepine
  # challenge), request_thiamine_empiric and request_liver_transplant_evaluation removed: they
  # delivered treatment, consults and treatment response through diagnostic tools (class C1) in all
  # 30 cases. Treatment is a must, never a tool call. The paracentesis and urine follow-ups below
  # follow plan section 3.2
  common_followups:
    - trigger_action: "request_diagnostic_paracentesis"
      tool_name: "order_microbiology"
      description: "Diagnostic paracentesis (specimen ascitic_fluid) only when ascites is present: cell count with differential, total protein and albumin, Gram stain and culture inoculated into blood-culture bottles at the bedside; SBP is PMN 250 cells/mm3 or more (EASL 2018; AASLD 2021)"
    - trigger_action: "request_urine_specimen"
      tool_name: "order_microbiology"
      description: "Urinalysis and urine culture (specimen urine), one specimen and one time point per report"

amyotrophic_lateral_sclerosis:
  name: "Amyotrophic lateral sclerosis (motor neuron disease)"
  abbreviation: "ALS"
  icd_code: "G12.21"
  description: "Progressive neurodegenerative disease with combined upper and lower motor neuron degeneration in multiple body regions, leading to respiratory failure"
  typical_demographics:
    age_range: [45, 75]
    sex_bias: "slight_male"
  encounter_type: "outpatient"
  # Clinical tool review, July 2026: specialized_test stays REQUIRED as EMG/NCS specifically;
  # spinal imaging added for cervical myelopathy and other mimics — as REQUIRED, not optional,
  # because all 30 cases already required it: the cord was imaged as part of the brain MRI, marked
  # by an `include_cervical_spine` annotation the brain tool has no parameter for and drops. So the
  # exclusion of compressive myelopathy — the mimic that must be ruled out before a motor neuron
  # disease diagnosis — was neither separately orderable nor scoreable.
  # Respiratory function is recommended for safety/staging rather than diagnostic confirmation.
  # Genetic testing is a separate optional offer with counselling in all cases (2023 consensus),
  # and CSF is limited to five targeted atypical-mimic work-ups.
  required_modalities: [specialized_test, MRI, body_imaging, LABS]
  optional_modalities: [CSF]
  key_findings:
    specialized_test:
      straightforward:
        - "EMG: widespread denervation — fibrillations, positive sharp waves, fasciculation potentials in ≥3 regions (bulbar, cervical, thoracic, lumbosacral)"
        - "Large amplitude, long-duration, polyphasic motor unit potentials (chronic reinnervation)"
        - "Reduced recruitment — severe in affected regions"
        - "Fasciculation potentials: complex morphology (distinguishes from benign fasciculations)"
        - "Motor NCS: reduced CMAP amplitudes (axonal loss), normal or near-normal conduction velocities"
        - "Sensory NCS: NORMAL — critical feature (pure motor involvement)"
        - "Awaji 2008: fasciculation potentials count as active denervation only in a muscle that also shows chronic neurogenic change"
      moderate:
        - "EMG: denervation in only 2 body regions — requires clinical correlation for UMN signs in other regions"
        - "Possible early median or ulnar entrapment neuropathy (confounding)"
        - "Fibrillations sparse — early disease or limb-onset predominant"
      diagnostic_puzzle:
        - "EMG shows denervation predominantly in one region — possible flail limb or flail arm variant"
        - "Fasciculations without fibrillations — benign fasciculation syndrome vs early ALS"
        - "Abnormal motor NCS with slow velocities — MMN mimicking ALS, check anti-GM1 antibodies"
    mri:
      straightforward:
        - "Brain MRI: T2/FLAIR hyperintensity along corticospinal tracts (bilateral internal capsule to brainstem)"
        - "Motor cortex T2 signal loss (low signal in primary motor cortex — iron deposition in UMN degeneration)"
        - "Frontal and temporal atrophy if ALS-FTD overlap (15% of ALS cases)"
        - "MRI cervical spine: no significant cord compression (rules out myelopathy)"
      moderate:
        - "Brain MRI: subtle corticospinal tract T2 change in posterior limb of internal capsule"
        - "Normal MRI — does not exclude ALS (insensitive early)"
        - "MRI spine: mild degenerative changes without significant cord compression"
      diagnostic_puzzle:
        - "MRI cervical spine: multilevel degenerative disease with moderate cord compression — cervical myelopathy cannot be excluded as contributor"
        - "No corticospinal tract signal change on brain MRI — early or lower motor neuron predominant"
    labs:
      all_difficulties:
        - "CBC: normal"
        - "BMP: normal"
        - "CK: normal or mildly to moderately elevated (denervation); above 5x ULN is higher than usual in ALS, so name a myopathic contributor (statin myopathy on a statin)"
        - "Thyroid function: normal (rules out thyrotoxic myopathy)"
        - "Vitamin B12: normal"
        - "Targeted anti-GM1 only for an MMN phenotype; paraprotein studies only when clinically suggested"
        - "Targeted HIV, paraneoplastic or metabolic testing according to exposure, comorbidity and phenotype"
        - "Androgen-receptor CAG repeat only for a compatible male lower-motor-neuron phenotype"
    csf:
      atypical_only:
        - "Basic CSF and selected assays answer a named inflammatory, infectious, demyelinating or neoplastic mimic"
        - "CSF neurofilament is not used to diagnose ALS; normal CSF does not exclude ALS"
  differential_diagnoses:
    - diagnosis: "Cervical spondylotic myelopathy"
      key_distinguishing: "Cord compression on MRI, predominantly upper motor neuron below lesion, no widespread EMG denervation, no bulbar involvement"
    - diagnosis: "Multifocal motor neuropathy (MMN)"
      key_distinguishing: "Purely lower motor neuron, conduction block on NCS, anti-GM1 antibodies positive, responds to IVIG"
    - diagnosis: "Kennedy disease (SBMA)"
      key_distinguishing: "Only lower motor neuron, bulbar and facial involvement, sensory NCS mildly abnormal, androgen receptor CAG repeat expansion, gynecomastia"
    - diagnosis: "Inclusion body myositis (IBM)"
      key_distinguishing: "Proximal and distal weakness, finger flexors > extensors, markedly elevated CK, EMG shows myopathic features, muscle biopsy diagnostic"
    - diagnosis: "Multiple sclerosis (progressive)"
      key_distinguishing: "White matter lesions on MRI, no fasciculations, no EMG denervation, CSF oligoclonal bands"
  difficulty_variants:
    straightforward:
      presentation: "58-year-old man with 1-year progressive left hand weakness and wasting, then right leg weakness. Fasciculations visible in tongue and limbs. Brisk reflexes in wasted muscles. EMG shows denervation in 4 regions. Normal sensory NCS."
      expected_agent_confidence: 0.90
    moderate:
      presentation: "62-year-old woman with 8-month progressive dysarthria and dysphagia, subtle bilateral leg weakness. EMG shows bulbar and cervical denervation. MRI cervical spine shows moderate stenosis — myelopathy contribution unclear."
      expected_agent_confidence: 0.62
    diagnostic_puzzle:
      presentation: "52-year-old with 6-month right arm weakness and fasciculations only. EMG shows denervation in cervical and lumbosacral regions but no clear UMN signs on examination. Flail arm variant possible but other diagnoses not fully excluded."
      expected_agent_confidence: 0.40
  # October 2026 review round (ruling 4): the MDT clinic referral is management and lives in the
  # assessment musts, never in a tool; the genetic panel is an order_specialized_test
  # (genetic_panel:ALS) after the EMG; a repeat EMG months later is a must, not a follow-up (no tool
  # output may report the future); CSF neurofilament is not a routine ALS study (EFNS 2012).
  common_followups:
    - trigger_action: "request_pulmonary_function_als"
      tool_name: "order_specialized_test"
      description: "Respiratory function (test_type respiratory_function): FVC and SNIP, with MIP where available; staging and NIV timing once ALS is supported, never diagnostic"
    - trigger_action: "request_genetic_als_panel"
      tool_name: "order_specialized_test"
      description: "ALS genetic panel (test_type genetic_panel:ALS): C9orf72 repeat expansion plus SOD1, TARDBP, FUS and TBK1, after the EMG and pre-test counselling; recommended in familial cases, optional otherwise"
    - trigger_action: "check_riluzole_interactions"
      tool_name: "check_drug_interactions"
      description: "Riluzole against the patient's own medicines, alcohol use and liver function, after the diagnosis is established (SmPC monitoring schedule)"
