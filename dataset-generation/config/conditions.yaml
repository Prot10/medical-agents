      tool_name: "interpret_labs"
      description: "FVC, sniff nasal inspiratory pressure (SNIP), NIF for respiratory involvement and NIV timing"
    - trigger_action: "request_genetic_als_panel"
      tool_name: "interpret_labs"
      description: "ALS genetic panel: SOD1, C9orf72 repeat expansion, TARDBP, FUS (especially family history or young-onset)"
    - trigger_action: "request_als_multidisciplinary_clinic"
      tool_name: "interpret_labs"
      description: "ALS multidisciplinary clinic referral (neurology, pulmonology, PT/OT, speech, nutrition, palliative care)"
    - trigger_action: "request_csf_nfl"
